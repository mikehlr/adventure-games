<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0000aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Περιπολικό 7 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --k:#000000; --b:#0000aa; --c:#00aaaa; --r:#aa0000; --lg:#aaaaaa; --dg:#555555; --lb:#5555ff; --lc:#55ffff; --y:#ffff55; --w:#ffffff; --lr:#ff5555;
  --bg:#000000; color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; } }
:root[data-theme="dark"]{ --bg:#000000; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;}
body{box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Fira Mono','Courier New',monospace;font-weight:500;color:var(--k);}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;background:#000;--u:2px;--ts:1;}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;border-radius:0;}
button:focus-visible{outline:2px solid var(--y);outline-offset:2px;}

#bar{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*10);background:var(--k);color:var(--w);display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(var(--u)*30);font-size:calc(var(--u)*5.4*var(--ts));white-space:nowrap;pointer-events:none;}
#bar[hidden]{display:none;}
#bar b{font-weight:700;color:var(--lc);}
#bar.bump #pts{animation:bump .6s steps(2) 2;}
@keyframes bump{50%{color:var(--y);}}

#dlg{position:absolute;left:50%;top:calc(var(--u)*16);transform:translateX(-50%);width:min(94%,calc(70% + (var(--ts) - 1) * 46%));
  max-height:calc(100% - var(--u)*54);overflow-y:auto;background:var(--w);border:calc(var(--u)*1) solid var(--b);
  box-shadow:inset 0 0 0 calc(var(--u)*1) var(--w),inset 0 0 0 calc(var(--u)*1.8) var(--b);padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*6);text-align:left;}
#dlg[hidden]{display:none;}
#dlg.over{border-color:var(--r);box-shadow:inset 0 0 0 calc(var(--u)*1) var(--w),inset 0 0 0 calc(var(--u)*1.8) var(--r);}
#dlgText{margin:0;font-size:calc(var(--u)*6.4*var(--ts));line-height:1.5;min-height:1.5em;}
#dlgOpts{display:flex;flex-direction:column;gap:calc(var(--u)*2);margin-top:calc(var(--u)*5);}
#dlgOpts:empty{display:none;}
#dlgOpts button{background:var(--lg);border:calc(var(--u)*.6) solid var(--k);padding:calc(var(--u)*2.4) calc(var(--u)*4);font-size:calc(var(--u)*6*var(--ts));text-align:left;}
#dlgOpts button:active{background:var(--y);}
#more{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1.5);font-size:calc(var(--u)*5);color:var(--b);animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}

#whisper{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:calc(var(--u)*10*var(--ts));font-weight:700;color:var(--y);
  text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--k);opacity:0;transition:opacity .3s;pointer-events:none;}
#whisper.show{opacity:1;}
#hint{position:absolute;left:50%;bottom:calc(var(--u)*6);transform:translateX(-50%);max-width:calc(44% + (var(--ts) - 1) * 10%);text-align:center;
  font-size:calc(var(--u)*5.6*var(--ts));background:var(--k);color:var(--w);padding:calc(var(--u)*1.2) calc(var(--u)*4);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hint:empty{display:none;}
#tip{position:absolute;left:50%;bottom:calc(var(--u)*20);transform:translateX(-50%);width:min(80%,calc(52% + (var(--ts) - 1) * 40%));text-align:center;
  font-size:calc(var(--u)*5.2*var(--ts));color:var(--w);background:rgba(0,0,170,.85);padding:calc(var(--u)*2) calc(var(--u)*4);pointer-events:none;transition:opacity .5s;opacity:0;}
#tip.show{opacity:1;}

.ctl{position:absolute;width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;background:rgba(170,170,170,.75);
  border:calc(var(--u)*.8) solid var(--k);display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;box-shadow:inset calc(var(--u)*-1) calc(var(--u)*-1.5) 0 rgba(0,0,0,.35);}
.ctl svg{width:44%;height:44%;fill:none;stroke:var(--k);stroke-width:2.8;stroke-linecap:square;}
.ctl.held{background:var(--w);}
.ctl b{font-size:calc(var(--u)*12);font-weight:700;line-height:1;}
#bL{left:calc(var(--u)*6);bottom:calc(var(--u)*6);}
#bR{left:calc(var(--u)*40);bottom:calc(var(--u)*6);}
#bA{right:calc(var(--u)*6);bottom:calc(var(--u)*6);width:calc(var(--u)*34);height:calc(var(--u)*34);background:rgba(255,255,85,.6);}
#bA.live{background:var(--y);}
#bB{right:calc(var(--u)*44);bottom:calc(var(--u)*24);width:calc(var(--u)*26);height:calc(var(--u)*26);background:rgba(85,255,255,.7);}
#bB b{font-size:calc(var(--u)*10);}
#bInv{right:calc(var(--u)*6);top:calc(var(--u)*14);width:calc(var(--u)*24);height:calc(var(--u)*24);}
#bMenu{left:calc(var(--u)*6);top:calc(var(--u)*14);width:calc(var(--u)*22);height:calc(var(--u)*22);}
#sel{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*46);max-width:42%;display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:calc(var(--u)*1.4) calc(var(--u)*5) calc(var(--u)*1.4) calc(var(--u)*2);font-size:calc(var(--u)*5.6*var(--ts));white-space:nowrap;
  background:var(--w);border:calc(var(--u)*.8) solid var(--b);}
#sel[hidden]{display:none;}
#sel canvas{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none;image-rendering:pixelated;}
#sel span{overflow:hidden;text-overflow:ellipsis;}

#inv{position:absolute;left:0;right:0;top:calc(var(--u)*10);padding:calc(var(--u)*6) calc(var(--u)*36) calc(var(--u)*6);background:var(--lg);border-bottom:calc(var(--u)*1) solid var(--k);}
#inv[hidden]{display:none;}
#slots{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center;min-height:calc(var(--u)*22);}
.slot{width:calc(var(--u)*22);height:calc(var(--u)*22);padding:calc(var(--u)*3);background:var(--w);border:calc(var(--u)*.6) solid var(--k);}
.slot.on{background:var(--y);}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
#invBar{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5);margin-top:calc(var(--u)*4);flex-wrap:wrap;}
#invCap{font-size:calc(var(--u)*5.8*var(--ts));min-height:1.3em;text-align:center;}
#invBar button{background:var(--w);border:calc(var(--u)*.6) solid var(--k);padding:calc(var(--u)*1.4) calc(var(--u)*6);font-size:calc(var(--u)*5.6*var(--ts));}
#invBar button:disabled{opacity:.4;}

#menu{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*40);display:flex;flex-direction:column;gap:calc(var(--u)*2);}
#menu[hidden]{display:none;}
#menu button{background:var(--w);border:calc(var(--u)*.6) solid var(--k);padding:calc(var(--u)*2.4) calc(var(--u)*7);font-size:calc(var(--u)*6*var(--ts));text-align:left;}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 calc(var(--u)*16) calc(var(--u)*12);
  background:linear-gradient(90deg,rgba(0,0,170,.88) 0%,rgba(0,0,170,.45) 55%,rgba(0,0,170,0) 82%);color:var(--w);}
.screen[hidden]{display:none;}
#title h1{margin:0;font-weight:700;font-size:calc(var(--u)*20);line-height:1;color:var(--y);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--k);letter-spacing:.02em;}
#title h1 b{display:block;font-weight:700;}
#title h1 span{display:block;font-size:calc(var(--u)*7.4);color:var(--lc);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--k);margin-top:calc(var(--u)*4);}
#title nav{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*8);}
#title nav button{background:var(--lg);color:var(--k);border:calc(var(--u)*.8) solid var(--k);padding:calc(var(--u)*2) calc(var(--u)*8);font-size:calc(var(--u)*7*var(--ts));
  box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--k);}
#title nav button:active{background:var(--y);}
#title nav button[hidden]{display:none;}
#title small{font-size:calc(var(--u)*5*var(--ts));margin-top:calc(var(--u)*6);color:var(--w);}
#end{background:var(--b);justify-content:center;align-items:center;text-align:center;padding:calc(var(--u)*10) calc(16% - (var(--ts) - 1) * 16%);overflow-y:auto;}
#end.over{background:var(--r);}
#end h2{margin:0 0 calc(var(--u)*6);font-size:calc(var(--u)*15);color:var(--y);text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--k);}
#end p{font-size:calc(var(--u)*6.4*var(--ts));line-height:1.5;margin:0 0 calc(var(--u)*3);opacity:0;animation:rise 1s steps(4) forwards;}
#end .btns{display:flex;gap:calc(var(--u)*4);justify-content:center;flex-wrap:wrap;margin-top:calc(var(--u)*5);opacity:0;animation:rise 1s steps(4) forwards;}
#end button{background:var(--lg);color:var(--k);border:calc(var(--u)*.8) solid var(--k);padding:calc(var(--u)*2) calc(var(--u)*8);font-size:calc(var(--u)*6.2*var(--ts));box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--k);}
#end button[hidden]{display:none;}
@keyframes rise{to{opacity:1;}}

#settings{position:absolute;inset:0;background:var(--lg);display:flex;flex-direction:column;justify-content:center;padding:0 12%;gap:calc(var(--u)*4);z-index:5;}
#settings[hidden]{display:none;}
#settings h3{margin:0;font-size:calc(var(--u)*12);color:var(--b);}
#settings .lab{margin:0;font-size:calc(var(--u)*5.6);}
#tsRow,#lgRow{display:flex;gap:calc(var(--u)*3);}
#tsRow button,#lgRow button{flex:1;background:var(--w);border:calc(var(--u)*.6) solid var(--k);padding:calc(var(--u)*2.4) 0;line-height:1;}
#tsRow button[aria-pressed="true"],#lgRow button[aria-pressed="true"]{background:var(--y);}
#tsPrev{margin:0;font-size:calc(var(--u)*6.4*var(--ts));line-height:1.4;min-height:2.8em;background:var(--w);padding:calc(var(--u)*3);border:calc(var(--u)*.6) solid var(--b);}
#settings .row{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;}
#settings .row button{background:var(--w);border:calc(var(--u)*.6) solid var(--k);padding:calc(var(--u)*2.4) calc(var(--u)*7);font-size:calc(var(--u)*6);}

#rotate{position:fixed;inset:0;background:var(--b);color:var(--y);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-size:18px;text-align:center;padding:0 12%;z-index:9;}
#rotate i{display:block;width:34px;height:58px;border:3px solid var(--y);animation:turn 2.4s steps(6) infinite;}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){#more,#rotate i{animation:none;}}

[hidden]{display:none!important;}
</style>



<style id="gfxcss">
/* settings panel: scrollable on small screens (content centred only when it fits) */
#settings{overflow-y:auto!important;justify-content:flex-start!important;padding-top:calc(var(--u)*8)!important;padding-bottom:calc(var(--u)*10)!important;touch-action:pan-y!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
#settings>*{flex-shrink:0;} #settings>:first-child{margin-top:auto!important;} #settings>:last-child{margin-bottom:auto!important;}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="bar" hidden><span><b data-i18n="Περιπολικό 7">Περιπολικό 7</b></span><span id="pts"></span></div>
  <div id="whisper"></div>
  <div id="hint"></div>
  <div id="tip"></div>

  <button class="ctl" id="bL" aria-label="◀"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
  <button class="ctl" id="bR" aria-label="▶"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
  <button class="ctl" id="bA" aria-label="A"><b>A</b></button>
  <button class="ctl" id="bB" aria-label="B"><b>B</b></button>
  <button class="ctl" id="bInv" aria-label="Inventory"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1.3 12H5.3L4 8Zm4 0V6a4 4 0 0 1 8 0v2"/></svg></button>
  <button class="ctl" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
  <button id="sel" hidden></button>

  <div id="menu" hidden>
    <button id="mSet" data-i18n="Ρυθμίσεις">Ρυθμίσεις</button>
    <button id="mTitle" data-i18n="Στην αρχική">Στην αρχική</button>
  </div>

  <div id="inv" hidden>
    <div id="slots"></div>
    <div id="invBar">
      <div id="invCap"></div>
      <button id="bExam" disabled data-i18n="Εξέταση">Εξέταση</button>
      <button id="bClose" data-i18n="Κλείσιμο">Κλείσιμο</button>
    </div>
  </div>

  <div id="dlg" hidden><p id="dlgText"></p><div id="dlgOpts"></div><span id="more">▼</span></div>

  <div class="screen" id="title">
    <h1><b data-i18n="Περιπολικό 7">Περιπολικό 7</b><span data-i18n="Πρώτη βάρδια στην Ακτή, 1989">Πρώτη βάρδια στην Ακτή, 1989</span></h1>
    <nav>
      <button id="tNew" data-i18n="Νέο παιχνίδι">Νέο παιχνίδι</button>
      <button id="tCont" hidden data-i18n="Συνέχεια">Συνέχεια</button>
      <button id="tSet" data-i18n="Ρυθμίσεις">Ρυθμίσεις</button>
    </nav>
    <small data-i18n="Ακολούθησε τον κανονισμό. Ο κανονισμός σε κρατάει ζωντανό.">Ακολούθησε τον κανονισμό. Ο κανονισμός σε κρατάει ζωντανό.</small>
  </div>

  <div id="settings" hidden role="dialog">
    <h3 data-i18n="Ρυθμίσεις">Ρυθμίσεις</h3>
    <p class="lab" data-i18n="Μέγεθος γραμμάτων">Μέγεθος γραμμάτων</p>
    <div id="tsRow">
      <button data-ts="1" style="font-size:calc(var(--u)*7)">Α</button>
      <button data-ts="1.3" style="font-size:calc(var(--u)*9)">Α</button>
      <button data-ts="1.6" style="font-size:calc(var(--u)*11)">Α</button>
      <button data-ts="2" style="font-size:calc(var(--u)*13)">Α</button>
    </div>
    <p class="lab" data-i18n="Γλώσσα">Γλώσσα</p>
    <div id="lgRow"><button data-lg="el" style="font-size:calc(var(--u)*6.4)">Ελληνικά</button><button data-lg="en" style="font-size:calc(var(--u)*6.4)">English</button></div>
    <p id="tsPrev" data-i18n="Έτσι θα φαίνονται τα κείμενα: «Περιπολικό 7, από Κέντρο.»">Έτσι θα φαίνονται τα κείμενα: «Περιπολικό 7, από Κέντρο.»</p>
    <div class="row">
      <button id="sSound">Ήχος: ναι</button>
      <button id="sFull" data-i18n="Πλήρης οθόνη">Πλήρης οθόνη</button>
      <button id="sClose" data-i18n="Κλείσιμο">Κλείσιμο</button>
    </div>
  </div>

  <div class="screen" id="end" hidden>
    <h2 id="endH"></h2>
    <div id="endT"></div>
    <div class="btns" id="endBtns">
      <button id="endR" data-i18n="Δοκίμασε ξανά">Δοκίμασε ξανά</button>
      <button id="endB" data-i18n="Στην αρχική">Στην αρχική</button>
    </div>
  </div>
</div>
</div>
<div id="rotate"><i></i><span data-i18n="Γύρισε το κινητό οριζόντια.">Γύρισε το κινητό οριζόντια.</span></div>

<script>
'use strict';
/* ============================================================
   ΠΕΡΙΠΟΛΙΚΟ 7 — police-procedure adventure, EGA style.
   All art, music and sound are generated in code.
   ============================================================ */
let LANG='el';
let lastHint='', lastLive=null;
const EN={"Σημειωματάριο": "Notebook", "Το σημειωματάριο υπηρεσίας. Κανονισμός: ό,τι δεν γράφεται, δεν έγινε.": "Your duty notebook. Regulation: if it isn't written down, it didn't happen.", "«Κλεμμένο κόκκινο κουπέ, ΑΚΤ-4471. Ύποπτος: Στέλιος Μπέκας. Δερμάτινο μπουφάν.»": "\"Stolen red coupé, AKT-4471. Suspect: Stelios Bekas. Leather jacket.\"", "«Οδός Λιμανιού: ΑΚΤ-4471 εντοπίστηκε.»": "\"Port Street: AKT-4471 located.\"", "Υπηρεσιακό όπλο": "Service pistol", "Στη θήκη του. Εκεί μένει, εκτός αν υπάρχει πραγματικός κίνδυνος.": "In its holster. That's where it stays, unless there is real danger.", "Κανονισμός: ποτέ οπλισμένος μέσα στα κρατητήρια.": "Regulation: never armed inside the holding area.", "Ασύρματος": "Radio", "Φορητός ασύρματος, κανάλι του Κέντρου. Διάλεξέ τον με το B και πάτα A για να καλέσεις.": "Handheld radio, Dispatch channel. Select it with B and press A to call.", "Χειροπέδες": "Handcuffs", "Ατσάλινες. Κλειδί στη ζώνη.": "Steel. Key on your belt.", "Φακός": "Flashlight", "Βαρύς φακός μαγκλίτσα. Δυνατό φως.": "A heavy-duty flashlight. Strong beam.", "Κλειδιά περιπολικού": "Patrol car keys", "Περιπολικό 7. Ένα μπρελόκ με τον Άγιο Χριστόφορο.": "Patrol Car 7. A Saint Christopher keyring.", "Σακούλα με ρολόγια": "Bag of watches", "Πειστήριο. Δώδεκα καινούργια ρολόγια, με τις ετικέτες ακόμα πάνω.": "Evidence. Twelve brand-new watches, price tags still on.", "Πόντοι:": "Points:", "από": "of", "Προς την αίθουσα ενημέρωσης": "To the briefing room", "Δεν βγαίνεις στη βάρδια χωρίς εξοπλισμό. Το ντουλάπι σου είναι το νούμερο 7.": "You don't start a shift without your gear. Your locker is number 7.", "Ανακοίνωση": "Notice", "«ΥΠΕΝΘΥΜΙΣΗ: Επιθεώρηση οχήματος πριν από κάθε βάρδια. Όπλα στη θυρίδα πριν από τα κρατητήρια. Καμία εξαίρεση.»": "\"REMINDER: Vehicle inspection before every shift. Firearms in the lockbox before entering holding. No exceptions.\"", "Από κάτω, με μολύβι: «Και πλένετε τις κούπες σας.»": "Underneath, in pencil: \"And wash your mugs.\"", "Πάγκος": "Bench", "Ο πάγκος των αποδυτηρίων. Εδώ έχουν ειπωθεί περισσότερα ψέματα για ψάρεμα απ’ ό,τι σε όλο το λιμάνι.": "The locker-room bench. More fishing lies have been told here than in the whole harbour.", "Ντουλάπι 7": "Locker 7", "Άδειο. Μόνο μια φωτογραφία της ομάδας μπάσκετ του τμήματος, του 1984. Χάσαμε.": "Empty. Just a photo of the precinct basketball team, 1984. We lost.", "Ανοίγεις το ντουλάπι 7.": "You open locker 7.", "Περνάς τη ζώνη: όπλο στη θήκη, χειροπέδες, ασύρματος, φακός.": "You buckle on your duty belt: pistol holstered, handcuffs, radio, flashlight.", "Αστυφύλακας Άρης Μαυρίδης. Έτοιμος για την πρώτη σου βάρδια.": "Officer Aris Mavridis. Ready for your first shift.", "Βρύση": "Tap", "Πίνεις λίγο νερό. Έχει γεύση από χλώριο και από είκοσι χρόνια υπηρεσίας.": "You drink some water. It tastes of chlorine and twenty years of service.", "Ρολόι": "Clock", "Έξι και μισή το πρωί. Η βάρδια ξεκινάει στις επτά.": "Six thirty in the morning. Shift starts at seven.", "Προς τα αποδυτήρια": "To the locker room", "Κρατητήρια": "Holding cells", "Τα κρατητήρια. Δεν έχεις κάποιον να φέρεις εκεί. Ακόμα.": "The holding cells. You have nobody to bring there. Yet.", "Αρχιφύλακας Κανελλόπουλος": "Sergeant Kanellopoulos", "Αρχιφύλακας: «Καλημέρα, Μαυρίδη. Πρώτη μέρα. Μη μου τα κάνεις θάλασσα.»": "Sergeant: \"Morning, Mavridis. First day. Don't make a mess of it.\"", "Αρχιφύλακας: «Κλεμμένο χθες βράδυ: κόκκινο κουπέ, πινακίδα ΑΚΤ-4471.»": "Sergeant: \"Stolen last night: red coupé, plate AKT-4471.\"", "Αρχιφύλακας: «Ύποπτος ο Στέλιος Μπέκας, “ο Γάτος”. Δερμάτινο μπουφάν, μαύρα γυαλιά, κανένα χιούμορ.»": "Sergeant: \"Suspect is Stelios Bekas, 'the Cat'. Leather jacket, dark glasses, no sense of humour.\"", "Αρχιφύλακας: «Επιθεώρηση στο όχημα πριν φύγεις. Και στα κρατητήρια, το όπλο στη θυρίδα. Πάντα.»": "Sergeant: \"Inspect your vehicle before you leave. And in holding, your weapon goes in the lockbox. Always.\"", "Αρχιφύλακας: «Κλειδιά στον πίνακα. Περιπολικό 7. Άντε.»": "Sergeant: \"Keys are on the board. Patrol Car 7. Go.\"", "Αρχιφύλακας: «ΑΚΤ-4471. Μπέκας. Κανονισμός. Μη με κάνεις να επαναλαμβάνομαι.»": "Sergeant: \"AKT-4471. Bekas. Regulations. Don't make me repeat myself.\"", "Πίνακας": "Chalkboard", "Ένας χάρτης της Ακτής με κιμωλία. Ένας κύκλος στην οδό Λιμανιού.": "A chalk map of Akti. A circle around Port Street.", "Πίνακας κλειδιών": "Key board", "Τα κλειδιά του Περιπολικού 7 είναι ήδη στην τσέπη σου.": "The keys to Patrol Car 7 are already in your pocket.", "Αρχιφύλακας: «Μαυρίδη! Πρώτα ενημέρωση, μετά κλειδιά. Έτσι γίνεται εδώ μέσα.»": "Sergeant: \"Mavridis! Briefing first, then keys. That's how it works in here.\"", "Παίρνεις τα κλειδιά του Περιπολικού 7.": "You take the keys to Patrol Car 7.", "Μηχάνημα καφέ": "Coffee machine", "Ο καφές μηχανής του τμήματος.": "The precinct coffee machine.", "Έχει λύσει περισσότερες υποθέσεις από όλους σας. Και έχει προκαλέσει άλλες τόσες γαστρίτιδες.": "It has solved more cases than all of you. And caused just as many ulcers.", "Προς το πάρκινγκ": "To the garage", "Χωρίς κλειδιά, στο πάρκινγκ θα πας μόνο για να κοιτάξεις.": "Without keys, you'd only go to the garage to look.", "Πίσω λάστιχο": "Rear tyre", "Φουσκωμένο και καινούργιο.": "Inflated and brand new.", "Κάνεις τον γύρο του περιπολικού, όπως λέει ο κανονισμός.": "You walk around the patrol car, as regulations require.", "Φώτα εντάξει. Φάρος εντάξει.": "Lights OK. Light bar OK.", "Το πίσω αριστερό λάστιχο όμως είναι μισοξεφούσκωτο. Μέσα του, ένα καρφί.": "But the rear left tyre is half flat. There's a nail in it.", "Μισοξεφούσκωτο. Με αυτό δεν πας πουθενά. Μίλα στον μηχανικό.": "Half flat. You're going nowhere on that. Talk to the mechanic.", "Περιπολικό 7": "Patrol Car 7", "Ελέγχεις τα φώτα με τον φακό. Δουλεύουν όλα.": "You check the lights with the flashlight. All working.", "Μήτσος, ο μηχανικός": "Mitsos, the mechanic", "Μήτσος: «Τα περιπολικά τα προσέχω σαν παιδιά μου. Τα παιδιά μου όχι τόσο.»": "Mitsos: \"I look after these cars like my own kids. My kids, not so much.\"", "Λες στον Μήτσο για το λάστιχο.": "You tell Mitsos about the tyre.", "Μήτσος: «Καρφί; Καλά που το είδες. Θα σου έσκαγε στην πρώτη στροφή.»": "Mitsos: \"A nail? Good thing you spotted it. It would've blown on the first bend.\"", "Πέντε λεπτά και πολλές βρισιές αργότερα, το λάστιχο είναι καινούργιο.": "Five minutes and a lot of swearing later, the tyre is new.", "Μήτσος: «Το Επτά είναι έτοιμο. Νομίζω. Το έλεγξες;»": "Mitsos: \"Seven's ready. I think. Did you check it?\"", "Πάγκος εργαλείων": "Workbench", "Κλειδιά, κατσαβίδια και ένα ημερολόγιο του 1986 που κανείς δεν τόλμησε να κατεβάσει.": "Spanners, screwdrivers and a 1986 calendar nobody has dared to take down.", "Κλειδωμένο. Τα κλειδιά είναι στον πίνακα της αίθουσας ενημέρωσης.": "Locked. The keys are on the board in the briefing room.", "Με ξεφούσκωτο λάστιχο δεν φεύγεις. Μίλα στον Μήτσο.": "You're not leaving on a flat tyre. Talk to Mitsos.", "Η βάρδια τελείωσε. Ώρα για αναφορά, όχι για βόλτες.": "The shift is over. Time for paperwork, not joyrides.", "Περιπολικό 7: πού πας;": "Patrol Car 7: where to?", "Περιπολία στην πόλη": "Patrol the city", "Βάζεις μπρος. Βγαίνεις από το πάρκινγκ. Η πόλη ξυπνάει.": "You start the engine. You pull out of the garage. The city is waking up.", "Ασύρματος: «Περιπολικό 7, από Κέντρο.»": "Radio: \"Patrol Car 7, this is Dispatch.\"", "Ασύρματος: «Κόκκινο κουπέ, πιθανώς το ΑΚΤ-4471, εντοπίστηκε στην οδό Λιμανιού, έξω από το καφέ “Γλάρος”. Ελέγξτε.»": "Radio: \"Red coupé, possibly AKT-4471, spotted on Port Street outside the 'Seagull' café. Check it out.\"", "Εσύ: «Ελήφθη, Κέντρο. Κατευθύνομαι.»": "You: \"Copy, Dispatch. On my way.\"", "Μένω ακόμα εδώ": "Stay here a little longer", "Δεν τελείωσες εδώ. Μια κλεμμένη πινακίδα δεν βρίσκεται μόνη της.": "You're not done here. A stolen plate doesn't find itself.", "Πριν τον βάλεις στο περιπολικό:": "Before putting him in the car:", "Τον ενημερώνω για τον λόγο της σύλληψης και τα δικαιώματά του.": "I inform him of the reason for arrest and his rights.", "Τον βάζω κατευθείαν μέσα. Βιάζομαι.": "I put him straight in. I'm in a hurry.", "Κάτι σε σταματάει. Η φωνή του εκπαιδευτή σου από τη Σχολή: «Ενημέρωση δικαιωμάτων, Μαυρίδη. Πάντα.»": "Something stops you. Your instructor's voice from the Academy: \"Rights, Mavridis. Always.\"", "Βάζεις τον Μπέκα στο πίσω κάθισμα, με το χέρι πάνω από το κεφάλι του για να μη χτυπήσει.": "You put Bekas in the back seat, hand over his head so he doesn't bump it.", "Ασύρματος: «Περιπολικό 7, Κέντρο. Ένας συλληφθείς. Επιστρέφω στο τμήμα.»": "Radio: \"Patrol Car 7 to Dispatch. One in custody. Returning to the station.\"", "Κόκκινο κουπέ": "Red coupé", "Ένα κόκκινο κουπέ, παρκαρισμένο πάνω στη διάβαση. Θράσος.": "A red coupé, parked on the pedestrian crossing. The nerve.", "Πινακίδα ΑΚΤ-4471.": "Plate AKT-4471.", "Πρώτα σημειώνεις. Μετά συμπεραίνεις.": "Note it down first. Draw conclusions later.", "Τη σημείωσες ήδη.": "You've already noted it.", "Σημειώνεις την πινακίδα: ΑΚΤ-4471.": "You note down the plate: AKT-4471.", "Ταιριάζει με την ενημέρωση του αρχιφύλακα. Επόμενο βήμα κατά τον κανονισμό: ενημέρωση του Κέντρου.": "It matches the sergeant's briefing. Next step by the book: inform Dispatch.", "Δεν υπάρχει τίποτε άλλο μέσα.": "There's nothing else inside.", "Φωτίζεις μέσα από το τζάμι. Κάτω από το κάθισμα, μια σακούλα.": "You shine the light through the window. Under the seat, a bag.", "Η πόρτα είναι ξεκλείδωτη. Δώδεκα ρολόγια, με τις ετικέτες ακόμα πάνω. Πειστήριο.": "The door is unlocked. Twelve watches, price tags still on. Evidence.", "Άντρας με δερμάτινο": "Man in leather jacket", "Φοράει ήδη χειροπέδες.": "He's already cuffed.", "Χωρίς έλεγχο στοιχείων και λόγο σύλληψης; Δεν είσαι σε ταινία.": "Without an ID check and a reason for arrest? This isn't a movie.", "Μπέκας: «Εντάξει, εντάξει. Χωρίς φασαρίες.»": "Bekas: \"Alright, alright. No fuss.\"", "Του περνάς χειροπέδες. Τον ελέγχεις για όπλα. Τίποτα, εκτός από ένα πακέτο τσίχλες.": "You cuff him. You pat him down for weapons. Nothing but a packet of chewing gum.", "Σημειώνεις την περιγραφή του. Δερμάτινο, γυαλιά, κανένα χιούμορ. Ταιριάζει.": "You note down his description. Leather, glasses, no sense of humour. It matches.", "Τραπεζάκι": "Café table", "Ένα άδειο τραπεζάκι. Και ένα φλιτζάνι καφέ με αποτύπωμα κραγιόν.": "An empty table. And a coffee cup with a lipstick mark.", "Περιστέρια": "Pigeons", "Τα περιστέρια της οδού Λιμανιού. Έχουν δει τα πάντα. Δεν μιλάνε σε μπάτσους.": "The pigeons of Port Street. They've seen everything. They don't talk to cops.", "Περίπτερο": "Kiosk", "Κυρία Ρούλα, περιπτερού: «Αστυφύλακα! Ο τύπος με το δερμάτινο βγήκε από το κόκκινο αμάξι πριν από δέκα λεπτά.»": "Mrs Roula, kiosk owner: \"Officer! The guy in the leather jacket got out of the red car ten minutes ago.\"", "Κυρία Ρούλα: «Κάθεται στον “Γλάρο” και πίνει φρέντο σαν να μην τρέχει τίποτα. Σιγά μην είναι δικό του το αμάξι.»": "Mrs Roula: \"He's sitting at the 'Seagull' drinking a freddo like nothing's wrong. As if that car were his.\"", "Σημειώνεις: μάρτυρας, κυρία Ρούλα, περίπτερο οδού Λιμανιού.": "You note: witness, Mrs Roula, Port Street kiosk.", "Κυρία Ρούλα: «Άντε, πιάσ’ τον, να ησυχάσει η γειτονιά!»": "Mrs Roula: \"Go on, catch him, so the neighbourhood can get some peace!\"", "Οδός Λιμανιού. Το κόκκινο κουπέ είναι εκεί, πάνω στη διάβαση.": "Port Street. The red coupé is there, parked on the crossing.", "Έξω από το καφέ «Γλάρος» κάθεται ένας άντρας με δερμάτινο μπουφάν.": "Outside the 'Seagull' café sits a man in a leather jacket.", "Τον ενημερώνεις για τον λόγο της σύλληψης και για τα δικαιώματά του: δικηγόρο, διερμηνέα, ενημέρωση συγγενή.": "You inform him of the reason for his arrest and of his rights: a lawyer, an interpreter, notifying a relative.", "Μπέκας: «Ναι, ναι. Τα ξέρω απ’ έξω. Καλύτερα από σένα.»": "Bekas: \"Yeah, yeah. I know them by heart. Better than you.\"", "Μπέκας: «Ο φρέντο μου έμεινε μισός. Αυτό να το γράψεις στην αναφορά.»": "Bekas: \"My freddo's still half full. Put that in your report.\"", "Ο Μπέκας σε κοιτάζει πάνω από τα γυαλιά του. Περιμένει να δει τι θα κάνεις. Ο κανονισμός λέει: χειροπέδες.": "Bekas looks at you over his glasses. Waiting to see what you'll do. Regulations say: handcuffs.", "Ο άντρας με το δερμάτινο σε κοιτάζει πάνω από το φλιτζάνι του.": "The man in the leather jacket looks at you over his cup.", "Πριν πλησιάσεις ύποπτο, ενημερώνεις το Κέντρο. Το λέει ο κανονισμός, και ο αρχιφύλακας θα στο θυμίζει ως τη σύνταξη.": "Before approaching a suspect, you inform Dispatch. It's in the regulations, and the sergeant will remind you until you retire.", "Πώς τον προσεγγίζεις;": "How do you approach him?", "«Καλημέρα. Έλεγχος στοιχείων, παρακαλώ.»": "\"Good morning. ID check, please.\"", "Σου δίνει την ταυτότητά του, αργά. «Στυλιανός Μπέκας».": "He hands you his ID card, slowly. \"Stylianos Bekas\".", "Πάνω στο τραπέζι, ένα κλειδί αυτοκινήτου με κόκκινο μπρελόκ.": "On the table, a car key on a red keyring.", "Εσύ: «Κύριε Μπέκα, είστε υπό σύλληψη για κλοπή οχήματος.»": "You: \"Mr Bekas, you are under arrest for vehicle theft.\"", "Μπέκας: «Πρωί πρωί; Ούτε τον φρέντο μου δεν τελείωσα.»": "Bekas: \"This early? I haven't even finished my freddo.\"", "«Ψηλά τα χέρια, κάθαρμα!»": "\"Hands up, scumbag!\"", "Τον κοιτάζεις επίμονα, σαν στις ταινίες.": "Stare at him intensely, like in the movies.", "Τον κοιτάζεις επίμονα.": "You stare at him intensely.", "Σε κοιτάζει κι αυτός επίμονα. Τελικά κάνει ένα μπαλόνι με την τσίχλα του.": "He stares back intensely. Eventually he blows a bubble with his gum.", "Αυτό δεν οδηγεί πουθενά.": "This is going nowhere.", "Έξοδος": "Exit", "Έχεις έναν συλληφθέντα δεμένο πάνω σου. Πρώτα τον παραδίδεις.": "You have a prisoner handcuffed to you. Hand him over first.", "Πρώτα η αναφορά. Μετά σπίτι.": "Report first. Then home.", "«ΑΠΑΓΟΡΕΥΕΤΑΙ Η ΕΙΣΟΔΟΣ ΜΕ ΟΠΛΟ ΠΕΡΑ ΑΠΟ ΤΗΝ ΚΙΤΡΙΝΗ ΓΡΑΜΜΗ.»": "\"NO FIREARMS BEYOND THE YELLOW LINE.\"", "Θυρίδα όπλων": "Weapons lockbox", "Το όπλο σου είναι κλειδωμένο στη θυρίδα. Το κλειδί στην τσέπη σου.": "Your pistol is locked in the lockbox. The key is in your pocket.", "Θυρίδες για τα όπλα. Κανονισμός: κανείς οπλισμένος πέρα από την κίτρινη γραμμή.": "Lockboxes for weapons. Regulation: nobody goes armed past the yellow line.", "Βγάζεις το όπλο από τη θήκη, το βάζεις στη θυρίδα και κλειδώνεις.": "You take the pistol out of its holster, put it in the lockbox and lock it.", "Κανονισμός. Ο αρχιφύλακας θα ήταν περήφανος. Δεν θα στο έλεγε ποτέ, αλλά θα ήταν.": "Regulations. The sergeant would be proud. He'd never say so, but he would.", "Αστυφύλακας Γιαννάκης": "Officer Giannakis", "Γιαννάκης: «Καλή δουλειά, συνάδελφε. Για πρώτη μέρα, όχι κι άσχημα.»": "Giannakis: \"Good work, colleague. Not bad for a first day.\"", "Παραδίδεις τον Μπέκα στον Γιαννάκη. Αφαιρείτε τις χειροπέδες και καταγράφετε τα προσωπικά του αντικείμενα.": "You hand Bekas over to Giannakis. You remove the cuffs and log his personal belongings.", "Ένα πακέτο τσίχλες. Ένα χτένι. Τρία ανέκδοτα που κανείς δεν ζήτησε.": "A packet of gum. A comb. Three jokes nobody asked for.", "Γιαννάκης: «Μέσα, Μπέκα. Και τώρα, συνάδελφε… η αναφορά.»": "Giannakis: \"In you go, Bekas. And now, colleague… the report.\"", "Γιαννάκης: «Η αναφορά, συνάδελφε. Στο σημειωματάριο, και μετά στη γραφομηχανή.»": "Giannakis: \"The report, colleague. In your notebook, then on the typewriter.\"", "Γιαννάκης: «Ησυχία σήμερα. Ελπίζω να μείνει έτσι.»": "Giannakis: \"Quiet today. I hope it stays that way.\"", "Γράφεις την αναφορά: ώρα, τόπος, πινακίδα, μάρτυρας, πειστήρια, σύλληψη, ενημέρωση δικαιωμάτων.": "You write the report: time, place, plate, witness, evidence, arrest, rights given.", "Γιαννάκης: «Καθαρή δουλειά. Πάρ’ τη στον αρχιφύλακα.»": "Giannakis: \"Clean work. Take it to the sergeant.\"", "Παραδίδεις τη σακούλα με τα ρολόγια ως πειστήριο. Ο Γιαννάκης την καταγράφει.": "You hand over the bag of watches as evidence. Giannakis logs it.", "Κελί": "Cell", "Ο Μπέκας κάθεται στον πάγκο και σφυρίζει. Φάλτσα.": "Bekas sits on the bench, whistling. Off-key.", "Ένα άδειο κελί. Μυρίζει χλωρίνη και κακές αποφάσεις.": "An empty cell. It smells of bleach and bad decisions.", "Δύο χιλιόμετρα μετά, στη Λεωφόρο Παραλίας, το πίσω λάστιχο σκάει.": "Two kilometres later, on Seafront Avenue, the rear tyre blows.", "Το Περιπολικό 7 καταλήγει, αργά και με αξιοπρέπεια, πάνω σε μια καντίνα με κουλούρια.": "Patrol Car 7 ends up, slowly and with dignity, in a pretzel cart.", "Κανονισμός: επιθεώρηση οχήματος πριν από κάθε βάρδια. Πάντα.": "Regulation: vehicle inspection before every shift. Always.", "Ο Μπέκας αναποδογυρίζει το τραπέζι και χάνεται στα στενά του λιμανιού.": "Bekas flips the table over and disappears into the harbour alleys.", "Η ψυχραιμία είναι το πρώτο εργαλείο του αστυνομικού. Ο αρχιφύλακας σε περιμένει με μια πολύ μεγάλη αναφορά.": "Composure is a police officer's first tool. The sergeant is waiting for you with a very long report.", "Τράβηξες το υπηρεσιακό όπλο χωρίς πραγματικό κίνδυνο.": "You drew your service pistol with no real danger present.", "Οι Εσωτερικές Υποθέσεις δεν έχουν χιούμορ. Ούτε ο αρχιφύλακας.": "Internal Affairs has no sense of humour. Neither does the sergeant.", "Κανονισμός: το όπλο είναι η τελευταία λύση, όχι η πρώτη.": "Regulation: the weapon is the last resort, not the first.", "Πέρασες την κίτρινη γραμμή με το όπλο στη θήκη.": "You crossed the yellow line with your pistol still holstered.", "Ο Μπέκας, παρά τις χειροπέδες, το άρπαξε σε μια στιγμή απροσεξίας. Ευτυχώς ο Γιαννάκης τον ακινητοποίησε πριν γίνει το κακό.": "Despite the handcuffs, Bekas grabbed it in a moment of carelessness. Luckily Giannakis pinned him down before anything worse happened.", "Κανονισμός: ποτέ οπλισμένος στα κρατητήρια. Ποτέ.": "Regulation: never armed in the holding area. Never.", "Τέλος καριέρας": "Career over", "Τέλος βάρδιας": "End of shift", "Βαθμολογία: υποδειγματικός αστυφύλακας.": "Rating: exe const A={ c:null, m:null, on:true,
  init(){ if(this.c){ if(this.c.state==='suspended') this.c.resume(); return; }
    try{ this.c=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    const c=this.c; this.m=c.createGain(); this.m.gain.value=this.on?.85:0; this.m.connect(c.destination);
    const b=c.createBuffer(1,c.sampleRate*3,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.nb=b;
    const s=c.createBufferSource(); s.buffer=b; s.loop=true; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=500; this.tg=c.createGain(); this.tg.gain.value=0;
    s.connect(f); f.connect(this.tg); this.tg.connect(this.m); s.start(); this.amb(); },
  amb(){ if(!this.c) return; this.tg.gain.setTargetAtTime(SC[S.scene].outdoor||S.mode==='title'?.03:0,this.c.currentTime,.5); },
  setOn(v){ this.on=v; if(this.m) this.m.gain.setTargetAtTime(v?.85:0,this.c.currentTime,.05); },
  tone(f,dur,o={}){ const c=this.c; if(!c) return; const t=c.currentTime+(o.at||0), osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'square'; osc.frequency.setValueAtTime(f,t); if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.05,t+(o.att||.004)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    osc.connect(g); g.connect(this.m); osc.start(t); osc.stop(t+dur+.05); },
  noise(dur,o={}){ const c=this.c; if(!c) return; const t=c.currentTime+(o.at||0), s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.nb; f.type=o.ft||'lowpass'; f.frequency.setValueAtTime(o.ff||1000,t); if(o.ff2) f.frequency.exponentialRampToValueAtTime(o.ff2,t+dur); f.Q.value=o.q||1;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.1,t+(o.att||.003)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.m); s.start(t,Math.random()*Math.max(0,2.8-dur)); s.stop(t+dur+.05); } };
const mf=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
  theme:{ step:.18, mel:[62,0,65,0,69,0,67,65,64,0,62,0,57,0,0,0,62,0,65,0,69,0,72,70,69,67,65,64,62,0,0,0],
          bass:[38,0,38,45,38,0,38,45,34,0,34,41,33,0,33,40,38,0,38,45,38,0,38,45,34,0,36,0,38,0,33,0] },
  quiet:{ step:.3, mel:[0,0,0,0,69,0,0,0,0,0,0,0,67,0,65,0], bass:[38,0,45,0,38,0,45,0,34,0,41,0,33,0,40,0] },
};
const MU={ song:null, i:0, next:0 };
function music(name){ MU.song=name?SONGS[name]:null; MU.i=0; MU.next=0; }
function musicTick(dt){ if(!MU.song||!A.c||!A.on) return; MU.next-=dt; if(MU.next>0) return; const s=MU.song; MU.next+=s.step; if(MU.next<-.3) MU.next=0;
  const i=MU.i%s.mel.length, m=s.mel[i], b=s.bass[i];
  if(m) A.tone(mf(m),s.step*1.7,{type:'square',vol:.02}); if(b) A.tone(mf(b),s.step*1.3,{type:'triangle',vol:.07}); MU.i++; }
function sfx(n){ if(!A.c||!A.on) return;
  switch(n){
    case 'step': A.noise(.04,{ft:'bandpass',ff:SC[S.scene].outdoor?1500:700,q:1.5,vol:.06}); break;
    case 'pick': A.tone(880,.08,{vol:.05}); A.tone(1320,.12,{vol:.05,at:.07}); break;
    case 'score': [67,72,76].forEach((m,i)=>A.tone(mf(m),.12,{vol:.05,at:i*.08})); break;
    case 'door': A.noise(.15,{ff:400,vol:.15}); A.tone(110,.15,{type:'triangle',vol:.1,at:.05}); break;
    case 'locker': A.noise(.12,{ft:'bandpass',ff:2500,q:4,vol:.18}); A.tone(300,.1,{vol:.04,at:.1}); break;
    case 'write': for(let i=0;i<6;i++) A.noise(.05,{ft:'highpass',ff:5000,vol:.05,at:i*.08}); break;
    case 'wrench': for(let i=0;i<4;i++) A.tone(1800+i*90,.05,{vol:.04,at:i*.15}); break;
    case 'cuffs': A.noise(.06,{ft:'highpass',ff:4000,vol:.2}); A.noise(.06,{ft:'highpass',ff:4000,vol:.2,at:.18}); break;
    case 'cell': A.noise(.3,{ft:'bandpass',ff:900,q:3,vol:.25}); A.tone(80,.3,{vol:.15,at:.2}); break;
    case 'engine': A.tone(55,1.2,{type:'sawtooth',f2:110,vol:.06,att:.2}); break;
    case 'siren': for(let i=0;i<3;i++){ A.tone(700,.35,{f2:1100,vol:.04,at:i*.7}); A.tone(1100,.35,{f2:700,vol:.04,at:i*.7+.35}); } break;
    case 'radio': A.noise(.3,{ft:'bandpass',ff:1800,q:2,vol:.08}); A.tone(1200,.06,{vol:.03,at:.3}); break;
    case 'over': [64,63,62,61].forEach((m,i)=>A.tone(mf(m-12),.4,{type:'triangle',vol:.1,at:i*.35})); break;
    case 'blip': A.tone(660,.04,{vol:.03}); break;
  } }

/* ---------- update ---------- */
function update(dt){
  for(let i=timers.length-1;i>=0;i--){ timers[i].t-=dt; if(timers[i].t<=0){ const f=timers[i].fn; timers.splice(i,1); f(); } }

  moreEl.style.visibility=D.active&&!D.opts&&D.shown>=D.text.length?'visible':'hidden';
  musicTick(dt);
  const s=SC[S.scene]; S.shk=Math.max(0,S.shk-dt); S.moving=false;
  if(S.mode==='play'&&!D.active&&!S.lock&&!S.trans&&$('settings').hidden){

  else { const tx=clamp(S.x-W/2,0,s.w-W); S.cam+=(tx-S.cam)*Math.min(1,dt*5); }
  let near=null, nd=1e9;
  if(S.mode==='play'&&!S.trans) for(const h of s.hs){ const d=Math.abs(S.x-h.x); if(d<=h.r&&d<nd){ nd=d; near=h; } }
  S.near=near;
  const hint=S.mode!=='play'||D.active?'':near?(S.sel?tr(near.n)+tr(' · A για χρήση'):tr(near.n)):'';
  if(hint!==lastHint){ $('hint').textContent=hint; lastHint=hint; }
  const live=!!(near||D.active); if(live!==lastLive){ $('bA').classList.toggle('live',live); lastLive=live; }
}

/* ---------- render ---------- */
function render(dt){
  const s=SC[S.scene], cam=Math.round(S.cam);
  const sx=S.shk>0?Math.round((Math.random()-.5)*2*S.shkA):0, sy=S.shk>0?Math.round((Math.random()-.5)*S.shkA):0;

  ctx.restore();

  ctx.save(); ctx.translate(-cam+sx,sy); if(s.fore) s.fore(ctx); drawPFX(ctx,dt||.016); ctx.restore();

  compositeP(dt||.016,s,cam);
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){ const dt=clamp((now-last)/1000,0,.05); last=now; T+=dt; update(dt); render(dt); requestAnimationFrame(loop); }
