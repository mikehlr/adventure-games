<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8fd06a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Η Κοκκινοσκουφίτσα v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#4a2c2a; --paper:#fff8ec; --red:#e0262f; --leaf:#5cb85c; --sun:#ffd34d; --sky:#9fdcff; --wood:#b07a4a; --bg:#5a9e3e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#4a2c2a; --paper:#fff8ec; --bg:#5a9e3e; } }
:root[data-theme="dark"]{ --ink:#4a2c2a; --paper:#fff8ec; --bg:#5a9e3e; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;}
body{box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Comfortaa','Trebuchet MS',sans-serif;font-weight:700;color:var(--ink);}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;background:#000;--u:2px;--ts:1;border-radius:calc(var(--u)*4);}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px;}

.round{position:absolute;width:calc(var(--u)*24);height:calc(var(--u)*24);border-radius:50%;background:var(--paper);border:calc(var(--u)*1.2) solid var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 calc(var(--u)*1.5) 0 rgba(74,44,42,.35);}
.round svg{width:55%;height:55%;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.round:active{transform:translateY(2px);box-shadow:none;}
#bSet{left:calc(var(--u)*5);top:calc(var(--u)*5);}
#bSay{right:calc(var(--u)*5);top:calc(var(--u)*5);background:var(--sun);}
#stars{position:absolute;left:50%;top:calc(var(--u)*5);transform:translateX(-50%);background:var(--paper);border:calc(var(--u)*1.2) solid var(--ink);border-radius:99px;
  padding:calc(var(--u)*1.5) calc(var(--u)*6);font-size:calc(var(--u)*7);white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:calc(var(--u)*2);}
#stars i{font-style:normal;color:#f2b500;font-size:1.2em;line-height:1;}
#stars.pop{animation:pop .6s ease;}
@keyframes pop{30%{transform:translateX(-50%) scale(1.35);}}

#basket{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*3);display:flex;gap:calc(var(--u)*3);padding:calc(var(--u)*2.5) calc(var(--u)*4);
  background:#c98a4f;border:calc(var(--u)*1.2) solid var(--ink);border-radius:calc(var(--u)*6);box-shadow:inset 0 calc(var(--u)*-2) 0 #a86e3a;min-width:calc(var(--u)*30);min-height:calc(var(--u)*24);justify-content:center;}
#basket[hidden]{display:none;}
#basket:empty::before{content:'🧺';font-size:calc(var(--u)*14);line-height:calc(var(--u)*24);opacity:.6;}
.it{width:calc(var(--u)*26);height:calc(var(--u)*26);background:var(--paper);border:calc(var(--u)*1) solid var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*2);transition:transform .15s;}
.it canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
.it.on{background:var(--sun);transform:translateY(calc(var(--u)*-4)) scale(1.12);border-color:var(--red);}

#dlg{position:absolute;left:50%;top:calc(var(--u)*34);transform:translateX(-50%);width:min(94%,calc(74% + (var(--ts) - 1) * 40%));
  max-height:calc(100% - var(--u)*70);overflow-y:auto;background:var(--paper);border:calc(var(--u)*1.4) solid var(--ink);border-radius:calc(var(--u)*6);
  box-shadow:0 calc(var(--u)*2) 0 rgba(74,44,42,.35);padding:calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*6);text-align:center;}
#dlg[hidden]{display:none;}
#who{display:inline-block;margin:0 0 calc(var(--u)*2);padding:calc(var(--u)*1) calc(var(--u)*5);border-radius:99px;color:#fff;font-size:calc(var(--u)*5.6*var(--ts));}
#who:empty{display:none;}
#dlgText{margin:0;font-size:calc(var(--u)*8*var(--ts));line-height:1.4;min-height:1.4em;text-wrap:pretty;}
#dlgOpts{display:flex;flex-direction:column;gap:calc(var(--u)*3);margin-top:calc(var(--u)*5);}
#dlgOpts:empty{display:none;}
#dlgOpts button{background:#fff;border:calc(var(--u)*1.2) solid var(--ink);border-radius:calc(var(--u)*5);padding:calc(var(--u)*3) calc(var(--u)*5);font-size:calc(var(--u)*7.4*var(--ts));box-shadow:0 calc(var(--u)*1.5) 0 rgba(74,44,42,.3);}
#dlgOpts button:active{background:var(--sun);}
#more{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*2);font-size:calc(var(--u)*6);color:var(--red);animation:bob 1s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(3px);}}
#speak{position:absolute;left:calc(var(--u)*5);bottom:calc(var(--u)*2);font-size:calc(var(--u)*6);opacity:0;}
#speak.on{opacity:1;animation:wave .6s ease-in-out infinite;}
@keyframes wave{50%{transform:scale(1.25);}}

#sparkle{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:calc(var(--u)*13*var(--ts));color:var(--sun);-webkit-text-stroke:calc(var(--u)*.7) var(--ink);
  text-shadow:0 calc(var(--u)*2) 0 var(--ink);opacity:0;transform:scale(.6);transition:opacity .35s,transform .35s;pointer-events:none;}
#sparkle.show{opacity:1;transform:scale(1);}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*8);
  background:radial-gradient(ellipse at center,rgba(255,248,236,.0) 0%,rgba(255,248,236,.0) 30%,rgba(90,158,62,.55) 100%);}
.screen[hidden]{display:none;}
#title h1{margin:0;font-size:calc(var(--u)*22);line-height:1;color:var(--red);-webkit-text-stroke:calc(var(--u)*.8) #fff;
  text-shadow:0 calc(var(--u)*2.5) 0 var(--ink),0 0 calc(var(--u)*10) rgba(255,255,255,.8);}
#title p{margin:calc(var(--u)*3) 0 0;font-size:calc(var(--u)*7*var(--ts));color:#fff;text-shadow:0 calc(var(--u)*1) 0 var(--ink);}
#title nav{display:flex;gap:calc(var(--u)*4);margin-top:calc(var(--u)*8);flex-wrap:wrap;justify-content:center;}
#title nav button,#end button{background:var(--sun);border:calc(var(--u)*1.4) solid var(--ink);border-radius:99px;padding:calc(var(--u)*3) calc(var(--u)*10);
  font-size:calc(var(--u)*9*var(--ts));box-shadow:0 calc(var(--u)*2.5) 0 var(--ink);}
#title nav button.sec{background:var(--paper);font-size:calc(var(--u)*7*var(--ts));}
#title nav button:active,#end button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
#title nav button[hidden]{display:none;}
#end{background:linear-gradient(#ffe9b8,#ffc9d6);}
#end h2{margin:0 0 calc(var(--u)*4);font-size:calc(var(--u)*16);color:var(--red);-webkit-text-stroke:calc(var(--u)*.6) #fff;text-shadow:0 calc(var(--u)*2) 0 var(--ink);}
#end .st{font-size:calc(var(--u)*14);color:#f2b500;letter-spacing:.05em;margin-bottom:calc(var(--u)*4);text-shadow:0 calc(var(--u)*1) 0 var(--ink);}
#end p{margin:0 0 calc(var(--u)*3);font-size:calc(var(--u)*7.4*var(--ts));line-height:1.45;max-width:80%;}
#end button{margin-top:calc(var(--u)*4);}

#settings{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:0 10%;gap:calc(var(--u)*3.5);z-index:5;overflow-y:auto;}
#settings[hidden]{display:none;}
#settings h3{margin:0;font-size:calc(var(--u)*12);color:var(--red);}
#settings .lab{margin:0;font-size:calc(var(--u)*6);opacity:.8;}
.row{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;}
.row button{flex:1;background:#fff;border:calc(var(--u)*1) solid var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*2.6) calc(var(--u)*3);font-size:calc(var(--u)*6.4);line-height:1.1;}
.row button[aria-pressed="true"]{background:var(--sun);border-color:var(--red);}
#voiceNote{margin:0;font-size:calc(var(--u)*5.2);opacity:.85;line-height:1.4;}
#voiceNote:empty{display:none;}

#rotate{position:fixed;inset:0;background:var(--bg);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-size:20px;text-align:center;padding:0 12%;z-index:9;}
#rotate i{display:block;width:34px;height:58px;border:3px solid #fff;border-radius:7px;animation:turn 2.4s ease-in-out infinite;}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){#more,#rotate i,#speak.on{animation:none;}}

[hidden]{display:none!important;}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="stars" hidden><i>★</i><span id="starN">0</span></div>
  <button class="round" id="bSet" aria-label="Ρυθμίσεις"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  <button class="round" id="bSay" aria-label="Πες το ξανά"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  <div id="basket" hidden></div>
  <div id="sparkle"></div>

  <div id="dlg" hidden><div id="who"></div><p id="dlgText"></p><div id="dlgOpts"></div><span id="speak">🔊</span><span id="more">▼</span></div>

  <div class="screen" id="title">
    <h1 data-i18n="Η Κοκκινοσκουφίτσα">Η Κοκκινοσκουφίτσα</h1>
    <p data-i18n="Ένα παραμύθι που παίζεις με τα δαχτυλάκια σου">Ένα παραμύθι που παίζεις με τα δαχτυλάκια σου</p>
    <nav>
      <button id="tNew" data-i18n="Παίξε!">Παίξε!</button>
      <button id="tCont" class="sec" hidden data-i18n="Συνέχεια">Συνέχεια</button>
      <button id="tSet" class="sec" data-i18n="Ρυθμίσεις">Ρυθμίσεις</button>
    </nav>
  </div>

  <div id="settings" hidden role="dialog">
    <h3 data-i18n="Ρυθμίσεις">Ρυθμίσεις</h3>
    <p class="lab" data-i18n="Φωνή που διαβάζει την ιστορία">Φωνή που διαβάζει την ιστορία</p>
    <div class="row" id="vRow"><button data-v="1" data-i18n="Ναι">Ναι</button><button data-v="0" data-i18n="Όχι">Όχι</button><button id="vTest" data-i18n="Δοκιμή φωνής">Δοκιμή φωνής</button></div>
    <p id="voiceNote"></p>
    <p class="lab" data-i18n="Μέγεθος γραμμάτων">Μέγεθος γραμμάτων</p>
    <div class="row" id="tsRow">
      <button data-ts="1" style="font-size:calc(var(--u)*7)">Α</button>
      <button data-ts="1.3" style="font-size:calc(var(--u)*9)">Α</button>
      <button data-ts="1.6" style="font-size:calc(var(--u)*11)">Α</button>
    </div>
    <p class="lab" data-i18n="Γλώσσα">Γλώσσα</p>
    <div class="row" id="lgRow"><button data-lg="el">Ελληνικά</button><button data-lg="en">English</button></div>
    <div class="row">
      <button id="sSound">Μουσική: ναι</button>
      <button id="sFull" data-i18n="Πλήρης οθόνη">Πλήρης οθόνη</button>
      <button id="sTitle" data-i18n="Στην αρχή">Στην αρχή</button>
      <button id="sClose" data-i18n="Κλείσιμο">Κλείσιμο</button>
    </div>
  </div>

  <div class="screen" id="end" hidden>
    <h2 data-i18n="Τέλος!">Τέλος!</h2>
    <div class="st" id="endStars"></div>
    <p data-i18n="Κι έζησαν αυτοί καλά κι εμείς καλύτερα!">Κι έζησαν αυτοί καλά κι εμείς καλύτερα!</p>
    <button id="endB" data-i18n="Ξανά από την αρχή">Ξανά από την αρχή</button>
  </div>
</div>
</div>
<div id="rotate"><i></i><span data-i18n="Γύρισε το κινητό οριζόντια.">Γύρισε το κινητό οριζόντια.</span></div>

<script>
'use strict';
/* ============================================================
   Η ΚΟΚΚΙΝΟΣΚΟΥΦΙΤΣΑ — a gentle, tap-to-play fairy tale.
   Read aloud with the device's text-to-speech voice.
   All art and music are generated in code.
   ============================================================ */
let LANG='el';

    const clean=text.replace(/[«»"“”]/g,'').replace(/…/g,', ').replace(/\s+/g,' ').trim();

    const u=new SpeechSynthesisUtterance(clean);

    u.onend=()=>fin(performance.now()-t0>clean.length*25); u.onerror=()=>fin(false); setTimeout(()=>fin(false),(clean.length*110)/p[1]+4000);

const A={ c:null, m:null, mg:null, on:true,
  init(){ if(this.c){ if(this.c.state==='suspended') this.c.resume(); return; }
    try{ this.c=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    const c=this.c; this.m=c.createGain(); this.m.gain.value=this.on?.8:0; this.m.connect(c.destination);
    this.mg=c.createGain(); this.mg.gain.value=1; this.mg.connect(this.m);
    const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.nb=b; },
  setOn(v){ this.on=v; if(this.m) this.m.gain.setTargetAtTime(v?.8:0,this.c.currentTime,.05); },
  tone(f,dur,o={}){ const c=this.c; if(!c) return; const t=c.currentTime+(o.at||0), osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'triangle'; osc.frequency.setValueAtTime(f,t); if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.05,t+(o.att||.01)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    osc.connect(g); g.connect(o.mus?this.mg:this.m); osc.start(t); osc.stop(t+dur+.05); },
  noise(dur,o={}){ const c=this.c; if(!c) return; const t=c.currentTime+(o.at||0), s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.nb; f.type=o.ft||'lowpass'; f.frequency.setValueAtTime(o.ff||1000,t); if(o.ff2) f.frequency.exponentialRampToValueAtTime(o.ff2,t+dur); f.Q.value=o.q||1;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.1,t+(o.att||.003)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.m); s.start(t,Math.random()*Math.max(0,1.8-dur)); s.stop(t+dur+.05); } };

const MU={ song:null, i:0, next:0 };
function music(name){ if(MU.name===name) return; MU.name=name; MU.song=name?SONGS[name]:null; MU.i=0; MU.next=0; }
function musicTick(dt){ if(!MU.song||!A.c||!A.on) return; MU.next-=dt; if(MU.next>0) return; const s=MU.song; MU.next+=s.step; if(MU.next<-.3) MU.next=0;
  const i=MU.i%s.mel.length, m=s.mel[i], b=s.bass[i];
  if(m) A.tone(mf(m),s.step*2.2,{type:'triangle',vol:.035,mus:1}); if(m&&i%4===0) A.tone(mf(m+12),.25,{type:'sine',vol:.012,mus:1});
  if(b) A.tone(mf(b),s.step*3,{type:'sine',vol:.06,mus:1}); MU.i++; }
function sfx(n){ if(!A.c||!A.on) return;
  switch(n){
    case 'step': A.tone(rand(200,260),.05,{type:'sine',vol:.03}); break;
    case 'star': [79,84,88,91].forEach((m,i)=>A.tone(mf(m),.25,{type:'sine',vol:.06,at:i*.07})); break;
    case 'pop': A.tone(500,.12,{type:'sine',f2:1100,vol:.08}); break;
    case 'yay': [72,76,79,84].forEach((m,i)=>A.tone(mf(m),.3,{type:'triangle',vol:.06,at:i*.1})); break;
    case 'meow': A.tone(700,.4,{type:'sine',f2:500,vol:.05,att:.08}); break;
    case 'wolf': A.tone(220,.9,{type:'sawtooth',f2:420,vol:.025,att:.2}); A.tone(420,.5,{type:'sine',f2:300,vol:.04,at:.7}); break;
    case 'knock': for(let i=0;i<3;i++) A.noise(.08,{ff:300,vol:.3,at:i*.22}); break;
    case 'whistle': A.tone(2000,.9,{type:'sine',f2:2300,vol:.06,att:.03}); break;
    case 'splash': A.noise(.5,{ft:'bandpass',ff:1500,q:.7,vol:.12}); break;
    case 'cluck': for(let i=0;i<3;i++) A.tone(800,.06,{type:'square',f2:500,vol:.03,at:i*.15}); break;
    case 'boing': A.tone(180,.35,{type:'sine',f2:520,vol:.07}); break;

/* ---------- hooks: intro before New game · mid at a key point · ending before the end screen ---------- */
function cineInstall(cfg){ const $$=id=>document.getElementById(id); let bypass=false;
  document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#tNew'); if(!b||bypass||CINE.busy()) return; e.stopImmediatePropagation(); e.preventDefault(); try{ if(typeof A!=='undefined'&&A.init) A.init(); }catch(_){}
    CINE.play(cfg.intro,()=>{ bypass=true; b.click(); bypass=false; },cfg.introMood); },true);
  setInterval(()=>{ if(CINE.busy()||typeof S==='undefined'||S.mode!=='play'||typeof F==='undefined'||!F||F.__cm) return; if(cfg.midWhen()){ F.__cm=1; CINE.play(cfg.mid,()=>{},cfg.midMood); } },300);
  const end=$$('end'); if(end) new MutationObserver(()=>{ if(end.hidden||end.dataset.cine==='1'||end.classList.contains('over')) return; end.dataset.cine='1'; end.style.visibility='hidden';
    CINE.play(cfg.ending(),()=>{ end.style.visibility=''; },cfg.endMood); }).observe(end,{attributes:true,attributeFilter:['hidden']});
  const tn=$$('tNew'); if(tn) tn.addEventListener('click',()=>{ if(end) end.dataset.cine='0'; }); }
