<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Studio · Ατάκες αντικειμένων · v6</title><style>@font-face{font-family:R;src:url('../assets/fonts/NotoSerif.ttf')}*{box-sizing:border-box}body{margin:0;background:#193b43;color:#f3e6ca;font:17px/1.6 R,serif}main{max-width:1300px;margin:45px auto;padding:0 30px}h1{font-size:36px;line-height:1.2}small{color:#bdcbc3}a{color:#efd196}nav{display:flex;justify-content:space-between;gap:20px}.controls{display:grid;grid-template-columns:1fr 1fr 2fr 1fr 1fr;gap:16px;margin:35px 0}label{display:grid;gap:8px;font-size:14px}select,button{font:inherit;padding:12px;border:1px solid #6b867e;border-radius:7px;background:#274d55;color:#fff2d6;width:100%}article{background:#fff4da;color:#263d40;padding:35px;border:2px solid #bba377;border-radius:14px;min-height:170px;font-size:27px;line-height:1.7}table{border-collapse:collapse;width:100%;font-size:15px;margin:30px 0}td,th{border-bottom:1px solid #5b7778;padding:16px;text-align:left;vertical-align:top}td:first-child{width:23%;color:#e2c18d}button{cursor:pointer;margin-top:20px;width:auto}#status{margin:15px 0}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}article{font-size:23px}}</style><main><nav><a href="index.html">← Review Studio</a><a href="../index.html">Παιχνίδι ↗</a></nav><h1>Τι γίνεται αν το χρησιμοποιήσω εδώ;</h1><small id="summary"></small><div class="controls"><label>Αντικείμενο<select id="item"></select></label><label>Σκηνή<select id="scene"></select></label><label>Στόχος<select id="target"></select></label><label>Γλώσσα<select id="language"><option value="el">Ελληνικά</option><option value="en">English</option></select></label><label>Παραλλαγή<select id="variant"><option value="0">Πρώτη</option><option value="1">Επανάληψη</option></select></label></div><article id="preview"></article><p id="status">Οι υπάρχουσες λύσεις γρίφων έχουν προτεραιότητα. Εδώ εξετάζονται οι ατάκες για τις υπόλοιπες χρήσεις.</p><h2>Το ίδιο αντικείμενο στους στόχους της σκηνής</h2><table><thead><tr><th>Στόχος</th><th>Κείμενο</th></tr></thead><tbody id="rows"></tbody></table><script src="item-responses.js"></script><script>
const el=id=>document.getElementById(id),R=LoukoumasItemResponses,names=['Πορτοφόλι','Κουπόνι','Φραπές','Αλυσίδα','Λακ','Γιαούρτι','Πρόσκληση','Κλειδί 23','Μολύβι','Μασημένη κασέτα','Κασέτα'];let catalog;const option=(value,text)=>{const o=document.createElement('option');o.value=value;o.textContent=text;return o};
function sceneTargets(){el('target').replaceChildren(...[...catalog.scenes[el('scene').value].hotspots.map(h=>option(h.id,h.n)),option('ground','Έδαφος / φόντο')]);draw()}
function draw(){const scene=el('scene').value,item=el('item').value,lang=el('language').value,n=+el('variant').value;el('preview').textContent=R.resolve(scene,el('target').value,item,lang,n);el('rows').replaceChildren();for(const target of el('target').options){const tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td');a.textContent=target.textContent;b.textContent=R.resolve(scene,target.value,item,lang,n);tr.append(a,b);el('rows').append(tr)}}
fetch('runtime.json').then(r=>r.json()).then(c=>{catalog=c;el('summary').textContent=Object.keys(R.data.responses).length+' χρήσεις · 2 παραλλαγές · Ελληνικά / English · build '+c.buildId;R.data.items.forEach((id,i)=>el('item').append(option(id,names[i])));Object.keys(c.scenes).forEach(id=>el('scene').append(option(id,{port:'Λιμάνι',square:'Πλατεία',beach:'Παραλία',lobby:'Ρεσεψιόν',room:'Δωμάτιο',disco:'Ντίσκο'}[id])));el('item').value='frappe';el('scene').onchange=sceneTargets;for(const id of ['item','target','language','variant'])el(id).onchange=draw;sceneTargets();el('target').value='cat';draw();window.ITEM_STUDIO={ready:true,data:R.data,draw};});
</script></main></html>
