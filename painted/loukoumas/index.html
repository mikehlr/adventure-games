τασίας. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "Gorilla guards the entrance with an admirable lack of imagination. The cassette goes back safely. You did not rescue it just to lose it now."]], "beach/club/wallet": [["Δεν είναι όλα προς πώληση. Ειδικά με τα δικά σου οικονομικά. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "Not everything is for sale. Especially on your budget. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "Zefyr has its own entry rules. The wallet returns to your pocket. The drachmas breathe again."]], "beach/club/voucher": [["Διαμονή κέρδισες, όχι γενική άδεια για πειράματα. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "You won a stay, not a general licence to experiment. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "Zefyr has its own entry rules. You fold the voucher again. The raffle had no instructions for this."]], "beach/club/frappe": [["Ψάχνεις θέση για το ποτήρι και τελικά προτιμάς το χέρι σου. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "You consider a spot for the cup, then decide your hand is safer. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "Zefyr has its own entry rules. You keep the cup upright. The foam is your only stable plan."]], "beach/club/chain": [["Δεν χρειάζεται να ντύσεις όλο το νησί για βραδινή έξοδο. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "You need not dress the whole island for a night out. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "Zefyr has its own entry rules. The chain goes back into place. Your neck had begun to worry."]], "beach/club/hairspray": [["Δεν χρειάζεται λακ για να μείνει στη θέση του. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "It needs no hairspray to stay put. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "Zefyr has its own entry rules. The cap stays shut. One parting per customer."]], "beach/club/yogurt": [["Δεν απλώνεις γιαούρτι στην περιουσία των άλλων. Ούτε για δοκιμή. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "You do not spread yogurt on other people’s property. Not even as an experiment. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "Zefyr has its own entry rules. The tub remains intact. Mum would approve of the economy."]], "beach/club/invitation": [["Η πρόσκληση ισχύει για το Ζεφύρ, όχι για όλο το Αιγαίο. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "The invitation is for Zefyr, not the whole Aegean. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "Zefyr has its own entry rules. You put the invitation away. “Admits one” keeps staring back."]], "beach/club/key": [["Το 23 στο κλειδί δεν είναι γενική άδεια εισόδου. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "The 23 on the key is not a universal entry permit. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "Zefyr has its own entry rules. 23 remains 23. The dolphin offers no comment."]], "beach/club/pencil": [["Δεν προσθέτεις την υπογραφή σου σε ξένη περιουσία. Το Ζεφύρ έχει δικούς του κανόνες εισόδου.", "You do not add your signature to somebody else’s property. Zefyr has its own entry rules."], ["Το Ζεφύρ έχει δικούς του κανόνες εισόδου. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "Zefyr has its own entry rules. The pencil survives another irrelevant assignment."]], "beach/club/tape_jam": [["Δεν χρειάζεσαι άλλο σημείο να σκαλώσ ds no further ceremony. The pencil survives another irrelevant assignment."]], "lobby/door/tape_jam": [["Δεν χρειάζεσαι άλλο σημείο να σκαλώσει η ξετυλιγμένη ταινία. Η έξοδος της ρεσεψιόν δεν χρειάζεται άλλη τελετή.", "You do not need another place for the loose tape to snag. Reception’s exit needs no further ceremony."], ["Η έξοδος της ρεσεψιόν δεν χρειάζεται άλλη τελετή. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "Reception’s exit needs no further ceremony. The tape stays protected. It has already been out quite enough."]], "lobby/door/tape": [["Δεν την αφήνεις εκτεθειμένη. Η μουσική σου έχει ήδη ταλαιπωρηθεί. Η έξοδος της ρεσεψιόν δεν χρειάζεται άλλη τελετή.", "You do not leave it lying around. Your music has been through enough. Reception’s exit needs no further ceremony."], ["Η έξοδος της ρεσεψιόν δεν χρειάζεται άλλη τελετή. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "Reception’s exit needs no further ceremony. The cassette goes back safely. You did not rescue it just to lose it now."]], "lobby/plant/wallet": [["Δεν είναι όλα προς πώληση. Ειδικά με τα δικά σου οικονομικά. Ο φοίνικας της ρεσεψιόν έχει δει χειρότερους πελάτες.", "Not everything is for sale. Especially on your budget. The reception palm has seen worse guests."], ["Ο φοίνικας της ρεσεψιόν έχει δει χειρότερους πελάτες. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The reception palm has seen worse guests. The wallet returns to your pocket. The drachmas breathe again."]], "lobby/plant/voucher": [["Διαμονή κέρδισες, όχι γενική άδεια για πειράματα. Ο φοίνικας της ρεσεψιόν έχει δει χειρότερους πελάτες.", "You won a stay, not a general licence to experiment. The reception palm has seen worse guests."], ["Ο φοίνικας της ρεσεψιόν έχει δει χειρότερους πελάτες. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The reception palm has seen worse guests. You fold the voucher again. The raffle had no instructions for this."]], "lobby/plant/  The foam is your only stable plan."]], "room/balcony/chain": [["Δεν χρειάζεται να ντύσεις όλο το νησί για βραδινή έξοδο. Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες.", "You need not dress the whole island for a night out. The balcony offers a view, not a workshop."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The balcony offers a view, not a workshop. The chain goes back into place. Your neck had begun to worry."]], "room/balcony/hairspray": [["Δεν χρειάζεται λακ για να μείνει στη θέση του. Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες.", "It needs no hairspray to stay put. The balcony offers a view, not a workshop."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The balcony offers a view, not a workshop. The cap stays shut. One parting per customer."]], "room/balcony/yogurt": [["Δεν απλώνεις γιαούρτι στην περιουσία των άλλων. Ούτε για δοκιμή. Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες.", "You do not spread yogurt on other people’s property. Not even as an experiment. The balcony offers a view, not a workshop."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The balcony offers a view, not a workshop. The tub remains intact. Mum would approve of the economy."]], "room/balcony/invitation": [["Η πρόσκληση ισχύει για το Ζεφύρ, όχι για όλο το Αιγαίο. Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες.", "The invitation is for Zefyr, not the whole Aegean. The balcony offers a view, not a workshop."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The balcony offers a view, not a workshop. You put the invitation away. “Admits one” keeps staring back."]], "room/balcony/key": [["Το δελφίνι στο μπρελόκ απολαμβάνει τη θέα από ασφαλή απόσταση. Το ίδιο και το κλειδί.", "The dolphin keyring enjoys the view from a safe distance. So does the key."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "The balcony offers a view, not a workshop. 23 remains 23. The dolphin offers no comment."]], "room/balcony/pencil": [["Δεν προσθέτεις την υπογραφή σου σε ξένη περιουσία. Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες.", "You do not add your signature to somebody else’s property. The balcony offers a view, not a workshop."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "The balcony offers a view, not a workshop. The pencil survives another irrelevant assignment."]], "room/balcony/tape_jam": [["Δεν χρειάζεσαι άλλο σημείο να σκαλώσει η ξετυλιγμένη ταινία. Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες.", "You do not need another place for the loose tape to snag. The balcony offers a view, not a workshop."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "The balcony offers a view, not a workshop. The tape stays protected. It has already been out quite enough."]], "room/balcony/tape": [["Δεν την αφήνεις εκτεθειμένη. Η μουσική σου έχει ήδη ταλαιπωρηθεί. Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες.", "You do not leave it lying around. Your music has been through enough. The balcony offers a view, not a workshop."], ["Το μπαλκόνι προσφέρει θέα, όχι χώρο για πατέντες. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "The balcony offers a view, not a workshop. The cassette goes back safely. You did not rescue it just to lose it now."]], "disco/speakers/wallet": [["Δραχμές έχεις, μπαταρίες όχι. Το πορτοφόλι δεν δίνει ρεύμα. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "You have drachmas, not batteries. The wallet supplies no electricity. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The speakers have enough volume without your help. The wallet returns to your pocket. The drachmas breathe again."]], "disco/speakers/voucher": [["Δεν υπάρχει υποδοχή «κέρδισα σε λαχνό». Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "There is no “I won a raffle” slot. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The speakers have enough volume without your help. You fold the voucher again. The raffle had no instructions for this."]], "disco/speakers/frappe": [["Ούτε στα ηχεία ούτε στην κονσόλα ακουμπάμε καφέ. Ακόμη κι ο Τάκης ξέρει αυτόν τον κανόνα.", "No coffee on speakers or consoles. Even Takis knows that rule."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "The speakers have enough volume without your help. You keep the cup upright. The foam is your only stable plan."]], "disco/speakers/chain": [["Δεν είναι ανταλλακτική αλυσίδα. Το «χρυσή» δεν είναι τεχνική προδιαγραφή. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "It is not a replacement chain. “Gold” is not a technical specification. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The speakers have enough volume without your help. The chain goes back into place. Your neck had begun to worry."]], "disco/speakers/hairspray": [["Η λακ δεν είναι σπρέι τεχνικής συντήρησης. Το αφήνεις ήσυχο. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "Hairspray is not a maintenance spray. You leave it alone. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The speakers have enough volume without your help. The cap stays shut. One parting per customer."]], "disco/speakers/yogurt": [["Το στραγγιστό δεν είναι λιπαντικό ούτε μονωτικό υλικό. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "Strained yogurt is neither lubricant nor insulation. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The speakers have enough volume without your help. The tub remains intact. Mum would approve of the economy."]], "disco/speakers/invitation": [["Αυτή είναι η πρόσκληση. Τη μουσική και τις μεταφορές τις αναλαμβάνουν άλλοι. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "This is the invitation. Music and transport are somebody else’s job. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The speakers have enough volume without your help. You put the invitation away. “Admits one” keeps staring back."]], "disco/speakers/key": [["Το κλειδί είναι για το δωμάτιό σου, όχι εργαλείο επισκευών. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "The key is for your room, not electrical repairs. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "The speakers have enough volume without your help. 23 remains 23. The dolphin offers no comment."]], "disco/speakers/pencil": [["Το μολύβι δεν είναι κατσαβίδι. Για κασέτες, το συζητάμε. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "The pencil is not a screwdriver. Cassettes are another matter. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "The speakers have enough volume without your help. The pencil survives another irrelevant assignment."]], "disco/speakers/tape_jam": [["Πρώτα φτιάχνεις την κασέτα. Μετά ανησυχείς για το μηχάνημα. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "First fix the cassette. Then worry about the machine. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "The speakers have enough volume without your help. The tape stays protected. It has already been out quite enough."]], "disco/speakers/tape": [["Χρειάζεται το σωστό κασετόφωνο. Το να την κρατάς κοντά δεν αρκεί. Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου.", "It needs the right tape deck. Merely holding it nearby will not do. The speakers have enough volume without your help."], ["Τα ηχεία έχουν αρκετή ένταση χωρίς τη βοήθειά σου. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "The speakers have enough volume without your help. The cassette goes back safely. You did not rescue it just to lose it now."]], "disco/crowd/wallet": [["Η φωτογραφία της μαμάς δεν μετράει ως συστατική επιστολή. Ο κόσμος ήρθε να χορέψει, όχι να δει απογραφή.", "Mum’s photo does not count as a letter of recommendation. The crowd came to dance, not watch stocktaking."], ["Ο κόσμος ήρθε να χορέψει, όχι να δει απογραφή. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The crowd came to dance, not watch stocktaking. The wallet returns to your pocket. The drachmas breathe again."]], "disco/crowd/voucher": [["Το κουπόνι γράφει «ένα άτομο». Δεν γίνεται κοινωνική λέσχη. Ο κόσμος ήρθε να χορέψει, όχι να δει απογραφή.", "The voucher says “one person”. It does not make a social club. The crowd came to dance, not watch stocktaking."], ["Ο κόσμος ήρθε να χορέψει, όχι να δει απογραφή. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The crowd came to dance, not watch stocktaking. You fold the voucher again. The raffle had no instructions for this."]], "disco/crowd/frappe": [["Κρατάς τον φραπέ. Η διπλωματία δεν γίνεται με μισολιωμένο καλαμάκι. Ο κόσμ /* Optional local music. Missing files retain the original synthesised soundtrack. */
globalThis.AdventureMusic={create({tracks,base,fade=2}){
 const entries=new Map(),positions={},listeners=[];let wanted=null,enabled=true,duck=false,unlocked=false,last=performance.now();
 function ensure(id){let e=entries.get(id);if(e)return e;const track=tracks.find(t=>t.id===id);if(!track)return null;const audio=new Audio();audio.loop=true;audio.preload='auto';audio.volume=0;e={id,audio,status:'loading',volume:0,pending:false,retry:0};entries.set(id,e);audio.addEventListener('canplay',()=>{e.status='ready';});audio.addEventListener('error',()=>{e.status='missing';e.pending=false;e.retry=performance.now()+30000;});audio.addEventListener('pause',()=>{e.pending=false;});audio.src=new URL(track.file,base).href;audio.load();return e;}
 function retryMissing(){for(const e of entries.values())if(e.status==='missing'){e.status='loading';e.audio.src=new URL(tracks.find(t=>t.id===e.id).file,base).href+'?v='+Date.now();e.audio.load();}}
 function unlock(){unlocked=true;}
 for(const name of ['pointerdown','keydown']){const fn=()=>unlock();window.addEventListener(name,fn,true);listeners.push([name,fn]);}window.addEventListener('focus',retryMissing);
 function update(id,on,talking=false,immediate=false){wanted=id;enabled=on;duck=talking;const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;const selected=on&&id?ensure(id):null;
  if(selected?.status==='missing'&&now>=selected.retry)retryMissing();
  if(selected?.status==='ready'&&unlocked&&selected.audio.paused&&!selected.pending){selected.pending=true;selected.audio.play().then(()=>{selected.pending=false;}).catch(err=>{selected.pending=false;if(err.name==='NotAllowedError')unlocked=false;else if(err.name!=='AbortError'){selected.status='missing';selected.retry=now+30000;}});}
  for(const e of entries.values()){const active=enabled&&e===selected&&e.status==='ready'&&!e.audio.paused,target=active?(duck?.24:.46):0;e.volume=immediate||!enabled?target:e.volume+Math.max(-dt/fade*.46,Math.min(dt/fade*.46,target-e.volume));e.audio.volume=Math.max(0,Math.min(1,e.volume));if(target===0&&e.volume<.001){e.volume=0;e.audio.volume=0;e.audio.pause();}positions[e.id]=e.audio.currentTime;}
 }
 return {update,unlock,retry:retryMissing,get externalActive(){return [...entries.values()].some(e=>!e.audio.paused&&e.status==='ready');},get state(){return {wanted,enabled,duck,unlocked,tracks:[...entries.values()].map(e=>({id:e.id,status:e.status,paused:e.audio.paused,time:e.audio.currentTime,volume:e.audio.volume,loop:e.audio.loop,src:e.audio.src}))};},destroy(){for(const e of entries.values())e.audio.pause();for(const[n,fn]of listeners)window.removeEventListener(n,fn,true);window.removeEventListener('focus',retryMissing);}};
}};
