<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b1d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ο Λουκουμάς στο Αλμυρίκι · HD Remake v6</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#2b1d3a; --paper:#fffbe8; --pink:#e0338a; --sun:#ffd23f; --sea:#1f74d0; --line:rgba(43,29,58,.9); --bg:#2b1d3a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#2b1d3a; --paper:#fffbe8; --bg:#2b1d3a; } }
:root[data-theme="dark"]{ --ink:#2b1d3a; --paper:#fffbe8; --bg:#2b1d3a; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;}
body{box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Comfortaa','Trebuchet MS','Verdana',sans-serif;font-weight:700;color:var(--ink);}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;background:#000;--u:2px;--ts:1;}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px;}

#score{position:absolute;left:50%;top:calc(var(--u)*5);transform:translateX(-50%);background:var(--ink);color:var(--sun);
  padding:calc(var(--u)*1.6) calc(var(--u)*6);border-radius:99px;font-size:calc(var(--u)*5.6*var(--ts));white-space:nowrap;pointer-events:none;}
#score.bump{animation:bump .5s ease;}
@keyframes bump{30%{transform:translateX(-50%) scale(1.25);background:var(--pink);color:#fff;}}

#dlg{position:absolute;left:50%;top:calc(var(--u)*18);transform:translateX(-50%);width:min(94%,calc(68% + (var(--ts) - 1) * 46%));
  max-height:calc(100% - var(--u)*56);overflow-y:auto;background:var(--paper);border:calc(var(--u)*1.2) solid var(--ink);
  box-shadow:0 0 0 calc(var(--u)*1.2) var(--pink),calc(var(--u)*2) calc(var(--u)*3) 0 calc(var(--u)*1.2) rgba(43,29,58,.45);
  padding:calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*6);text-align:center;border-radius:calc(var(--u)*2);}
#dlg[hidden]{display:none;}
#dlg:not([hidden]){animation:dlgIn .18s ease-out;}
@keyframes dlgIn{from{opacity:0;transform:translateX(-50%) translateY(calc(var(--u)*-4)) scale(.96);}}
#dlgText{margin:0;font-size:calc(var(--u)*7*var(--ts));line-height:1.45;min-height:1.45em;text-wrap:pretty;}
#dlgOpts{display:flex;flex-direction:column;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*5);}
#dlgOpts:empty{display:none;}
#dlgOpts button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) calc(var(--u)*4);font-size:calc(var(--u)*6.4*var(--ts));}
#dlgOpts button:active{background:var(--sun);}
#dlg.pt{display:flex;align-items:center;gap:calc(var(--u)*6);text-align:left;width:min(96%,calc(82% + (var(--ts) - 1) * 36%));padding-left:calc(var(--u)*5);}
#pt{display:none;flex:none;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6);}
#dlg.pt #pt{display:flex;}
#ptc{width:calc(var(--u)*42);height:calc(var(--u)*42);image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--u)*1) solid var(--ink);border-radius:calc(var(--u)*1.5);box-shadow:0 0 0 calc(var(--u)*.9) var(--pink);background:#fff;}
#ptn{font-size:calc(var(--u)*5*var(--ts));background:var(--ink);color:var(--sun);border-radius:99px;padding:calc(var(--u)*.6) calc(var(--u)*3.4);white-space:nowrap;max-width:calc(var(--u)*56);overflow:hidden;text-overflow:ellipsis;}
#dlgBody{flex:1;min-width:0;}
#more{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1.5);font-size:calc(var(--u)*5);color:var(--pink);animation:bob 1s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(2px);}}

#whisper{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:calc(var(--u)*12*var(--ts));color:var(--sun);
  -webkit-text-stroke:calc(var(--u)*.6) var(--ink);text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--pink);opacity:0;transition:opacity .4s, transform .4s;transform:scale(.8);pointer-events:none;}
#whisper.show{opacity:1;transform:scale(1);}

#hint{position:absolute;left:50%;bottom:calc(var(--u)*6);transform:translateX(-50%);max-width:calc(44% + (var(--ts) - 1) * 10%);text-align:center;
  font-size:calc(var(--u)*6*var(--ts));background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.4) calc(var(--u)*5);
  pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hint:empty{display:none;}
#tip{position:absolute;left:50%;bottom:calc(var(--u)*20);transform:translateX(-50%);width:min(80%,calc(52% + (var(--ts) - 1) * 40%));text-align:center;
  font-size:calc(var(--u)*5.6*var(--ts));color:#fff;text-shadow:0 0 calc(var(--u)*2) var(--ink),0 0 calc(var(--u)*1) var(--ink);pointer-events:none;transition:opacity .6s;opacity:0;}
#tip.show{opacity:1;}

.ctl{position:absolute;width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;background:rgba(255,251,232,.78);
  border:calc(var(--u)*1) solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;
  box-shadow:calc(var(--u)*1) calc(var(--u)*1.5) 0 rgba(43,29,58,.5);}
.ctl svg{width:44%;height:44%;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.ctl.held{background:var(--sun);transform:translateY(1px);}
.ctl b{font-size:calc(var(--u)*12);line-height:1;}
#bL{left:calc(var(--u)*6);bottom:calc(var(--u)*6);}
#bR{left:calc(var(--u)*40);bottom:calc(var(--u)*6);}
#bA{right:calc(var(--u)*6);bottom:calc(var(--u)*6);width:calc(var(--u)*34);height:calc(var(--u)*34);background:rgba(255,210,63,.7);}
#bA.live{background:var(--sun);}
#bB{right:calc(var(--u)*44);bottom:calc(var(--u)*24);width:calc(var(--u)*26);height:calc(var(--u)*26);background:rgba(224,51,138,.75);color:#fff;}
#bB b{font-size:calc(var(--u)*10);}
#bInv{right:calc(var(--u)*6);top:calc(var(--u)*5);width:calc(var(--u)*24);height:calc(var(--u)*24);}
#bMenu{left:calc(var(--u)*6);top:calc(var(--u)*5);width:calc(var(--u)*22);height:calc(var(--u)*22);}
#sel{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*46);max-width:42%;display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:calc(var(--u)*1.6) calc(var(--u)*5) calc(var(--u)*1.6) calc(var(--u)*2);font-size:calc(var(--u)*6*var(--ts));white-space:nowrap;
  background:var(--paper);border:calc(var(--u)*.9) solid var(--pink);border-radius:calc(var(--u)*3);}
#sel[hidden]{display:none;}
#sel canvas{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none;image-rendering:pixelated;}
#sel span{overflow:hidden;text-overflow:ellipsis;}
#sel.pop{animation:pop .25s ease;}
@keyframes pop{0%{transform:scale(.8)}100%{transform:none}}

#inv{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*7) calc(var(--u)*36) calc(var(--u)*6);background:var(--paper);
  border-bottom:calc(var(--u)*1.2) solid var(--ink);box-shadow:0 calc(var(--u)*1.2) 0 var(--pink);}
#inv[hidden]{display:none;}
#slots{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center;min-height:calc(var(--u)*22);}
.slot{width:calc(var(--u)*22);height:calc(var(--u)*22);padding:calc(var(--u)*3);background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);}
.slot.on{background:var(--sun);border-color:var(--pink);}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
#invBar{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5);margin-top:calc(var(--u)*4);flex-wrap:wrap;}
#invCap{font-size:calc(var(--u)*6.2*var(--ts));min-height:1.3em;text-align:center;}
#invBar button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.5) calc(var(--u)*6);font-size:calc(var(--u)*5.8*var(--ts));}
#invBar button:disabled{opacity:.35;}

#menu{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*30);display:flex;flex-direction:column;gap:calc(var(--u)*2);}
#menu[hidden]{display:none;}
#menu button{background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) calc(var(--u)*7);font-size:calc(var(--u)*6.2*var(--ts));text-align:left;}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 calc(var(--u)*16) calc(var(--u)*12);
  background:linear-gradient(90deg,rgba(43,29,58,.72) 0%,rgba(43,29,58,.3) 55%,rgba(43,29,58,0) 80%);color:#fff;}
.screen[hidden]{display:none;}
#title h1{margin:0;font-weight:700;font-size:calc(var(--u)*20);line-height:1;color:var(--sun);
  -webkit-text-stroke:calc(var(--u)*.7) var(--ink);text-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--pink);letter-spacing:-.01em;}
#title h1 b{font-weight:700;display:inline-block;}
#title h1 .v2{display:inline-block;vertical-align:top;margin-left:calc(var(--u)*3);font-style:normal;font-size:calc(var(--u)*7);background:var(--pink);color:#fff;-webkit-text-stroke:0;text-shadow:none;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*4);transform:rotate(-8deg);}
#title h1 span{display:block;font-size:calc(var(--u)*9);color:#fff;-webkit-text-stroke:0;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink);margin-top:calc(var(--u)*3);}
#title nav{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*3);margin-top:calc(var(--u)*8);}
#title nav button{background:var(--paper);color:var(--ink);border:calc(var(--u)*.9) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2) calc(var(--u)*9);
  font-size:calc(var(--u)*7.4*var(--ts));box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--pink);}
#title nav button:active{transform:translate(1px,1px);box-shadow:none;}
#title nav button[hidden]{display:none;}
#title small{font-size:calc(var(--u)*5*var(--ts));margin-top:calc(var(--u)*6);opacity:.9;}
#end{background:linear-gradient(#ff8a3d,#e0338a 60%,#6b2a8a);justify-content:center;align-items:center;text-align:center;padding:calc(var(--u)*10) calc(16% - (var(--ts) - 1) * 16%);overflow-y:auto;}
#end h2{margin:0 0 calc(var(--u)*6);font-size:calc(var(--u)*18);color:var(--sun);-webkit-text-stroke:calc(var(--u)*.7) var(--ink);text-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--ink);}
#end p{font-size:calc(var(--u)*7*var(--ts));line-height:1.5;margin:0 0 calc(var(--u)*3.5);opacity:0;animation:rise 1.4s ease forwards;text-shadow:0 calc(var(--u)*.6) 0 rgba(43,29,58,.6);}
#end button{margin-top:calc(var(--u)*5);background:var(--paper);color:var(--ink);border:calc(var(--u)*.9) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2) calc(var(--u)*9);
  font-size:calc(var(--u)*6.6*var(--ts));opacity:0;animation:rise 1.4s ease forwards;}
@keyframes rise{to{opacity:1;}}

#settings{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:0 12%;gap:calc(var(--u)*4);z-index:5;}
#settings[hidden]{display:none;}
#settings h3{margin:0;font-size:calc(var(--u)*13);color:var(--pink);}
#settings .lab{margin:0;font-size:calc(var(--u)*6);opacity:.75;}
#tsRow,#lgRow,#ptRow,#fxRow{display:flex;gap:calc(var(--u)*3);}
#tsRow button,#lgRow button,#ptRow button,#fxRow button{flex:1;background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) 0;line-height:1;}
#tsRow button[aria-pressed="true"],#lgRow button[aria-pressed="true"],#ptRow button[aria-pressed="true"],#fxRow button[aria-pressed="true"]{background:var(--sun);border-color:var(--pink);}
#tsPrev{margin:0;font-size:calc(var(--u)*7*var(--ts));line-height:1.4;min-height:2.8em;}
#settings .row{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;}
#settings .row button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2.5) calc(var(--u)*8);font-size:calc(var(--u)*6.4);}

#rotate{position:fixed;inset:0;background:var(--bg);color:var(--sun);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  font-size:20px;text-align:center;padding:0 12%;z-index:9;}
#rotate i{display:block;width:34px;height:58px;border:3px solid var(--sun);border-radius:7px;animation:turn 2.4s ease-in-out infinite;}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){#more,#rotate i{animation:none;}}

[hidden]{display:none!important;}
</style>
<style>
#vbar{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*24);display:flex;align-items:center;gap:calc(var(--u)*2.5);padding:0 calc(var(--u)*4);
  background:linear-gradient(#4a3a6a,#2b1d3a);border-bottom:calc(var(--u)*1) solid var(--sun);box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.35);z-index:2;}
#vbar[hidden]{display:none;}
.vb{width:calc(var(--u)*24);height:calc(var(--u)*20);flex:none;background:#5a4a7a;border:calc(var(--u)*.8) solid #140a24;border-radius:calc(var(--u)*2);
  box-shadow:inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.18),inset 0 calc(var(--u)*-1) 0 rgba(0,0,0,.3);padding:calc(var(--u)*1.6) calc(var(--u)*3);display:flex;align-items:center;justify-content:center;}
.vb canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
.vb.on{background:var(--sun);box-shadow:inset 0 calc(var(--u)*-1) 0 rgba(0,0,0,.25),0 0 0 calc(var(--u)*.8) #fff;}
.vb:disabled{opacity:.35;}
.vb:active{transform:translateY(1px);}
#vbar .sep{width:calc(var(--u)*.8);height:calc(var(--u)*16);background:rgba(255,255,255,.18);flex:none;}
#score{flex:1;text-align:center;color:var(--sun);font-size:calc(var(--u)*6.2*var(--ts));white-space:nowrap;position:static;transform:none;background:none;padding:0;}
#score.bump{animation:sbump .6s ease;}
@keyframes sbump{30%{color:#fff;transform:scale(1.2);}}
#hover{position:absolute;transform:translate(-50%,calc(var(--u)*10));background:rgba(43,29,58,.88);color:var(--sun);font-size:calc(var(--u)*5.4*var(--ts));padding:calc(var(--u)*1) calc(var(--u)*4);border-radius:99px;pointer-events:none;white-space:nowrap;z-index:1;}
#hover[hidden]{display:none;}
#hint{position:absolute;left:50%;top:calc(var(--u)*28);bottom:auto;transform:translateX(-50%);background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.2) calc(var(--u)*5);
  font-size:calc(var(--u)*5.6*var(--ts));opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:none;}
#hint.show{opacity:1;}
#cv{cursor:none;}
@media (hover:none){#cv{cursor:auto;}}
#dlg{top:calc(var(--u)*34);}
#inv{top:calc(var(--u)*24);}
#menu{top:calc(var(--u)*28);left:auto;right:calc(var(--u)*4);}
#tip{bottom:calc(var(--u)*8);}
#title h1 .v2{display:inline-block;vertical-align:top;margin-left:calc(var(--u)*3);font-style:normal;font-size:calc(var(--u)*6);background:var(--pink);color:#fff;-webkit-text-stroke:0;text-shadow:none;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*4);transform:rotate(-8deg);}
#title h1 b{display:inline-block;}
</style>




<style id="gfxcss">
/* settings panel: scrollable on small screens (content centred only when it fits) */
#settings{overflow-y:auto!important;justify-content:flex-start!important;padding-top:calc(var(--u)*8)!important;padding-bottom:calc(var(--u)*10)!important;touch-action:pan-y!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
#settings>*{flex-shrink:0;} #settings>:first-child{margin-top:auto!important;} #settings>:last-child{margin-bottom:auto!important;}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="hover" hidden></div>
  <div id="whisper"></div>
  <div id="hint"></div>
  <div id="tip"></div>
  <div id="vbar" hidden>
    <button class="vb on" data-v="walk" data-i18n-label="Περπάτα" aria-label="Περπάτα"><canvas width="16" height="16" data-icon="walk"></canvas></button>
    <button class="vb" data-v="look" data-i18n-label="Κοίτα" aria-label="Κοίτα"><canvas width="16" height="16" data-icon="look"></canvas></button>
    <button class="vb" data-v="hand" data-i18n-label="Πάρε / Χρησιμοποίησε" aria-label="Πάρε / Χρησιμοποίησε"><canvas width="16" height="16" data-icon="hand"></canvas></button>
    <button class="vb" data-v="talk" data-i18n-label="Μίλα" aria-label="Μίλα"><canvas width="16" height="16" data-icon="talk"></canvas></button>
    <button class="vb" data-v="item" id="vItemB" disabled data-i18n-label="Χρησιμοποίησε αντικείμενο" aria-label="Χρησιμοποίησε αντικείμενο"><canvas width="16" height="16" id="vItem"></canvas></button>
    <span class="sep"></span>
    <div id="score"></div>
    <button class="vb" id="bInv" data-i18n-label="Αντικείμενα" aria-label="Αντικείμενα"><canvas width="16" height="16" data-icon="bag"></canvas></button>
    <button class="vb" id="bMenu" data-i18n-label="Μενού" aria-label="Μενού"><canvas width="16" height="16" data-icon="menu"></canvas></button>
  </div>

  <div id="menu" hidden>
    <button id="mSet" data-i18n="Ρυθμίσεις">Ρυθμίσεις</button>
    <button id="mTitle" data-i18n="Στην αρχική">Στην αρχική</button>
  </div>

  <div id="inv" hidden>
    <div id="slots"></div>
    <div id="invBar">
      <div id="invCap"></div>
      <button id="bExam" disabled data-i18n="Εξέταση">Εξέταση</button>
      <button id="bClose" data-i18n="Κλείσιμο">Κλείσιμο</button>
    </div>
  </div>

  <div id="dlg" hidden><div id="pt"><canvas id="ptc" width="42" height="42"></canvas><span id="ptn"></span></div><div id="dlgBody"><p id="dlgText"></p><div id="dlgOpts"></div></div><span id="more">▼</span></div>

  <div class="screen" id="title">
    <h1><b data-i18n="Ο Λουκουμάς">Ο Λουκουμάς</b><em class="v2">point &amp; click</em><span data-i18n="στο Αλμυρίκι">στο Αλμυρίκι</span></h1>
    <nav>
      <button id="tNew" data-i18n="Νέο παιχνίδι">Νέο παιχνίδι</button>
      <button id="tCont" hidden data-i18n="Συνέχεια">Συνέχεια</button>
      <button id="tSet" data-i18n="Ρυθμίσεις">Ρυθμίσεις</button>
    </nav>
    <small data-i18n="Ποντίκι ή δάχτυλο: διάλεξε ενέργεια από τη μπάρα και πάτα πάνω στην εικόνα.">Ποντίκι ή δάχτυλο: διάλεξε ενέργεια από τη μπάρα και πάτα πάνω στην εικόνα.</small>
  </div>

  <div id="settings" hidden role="dialog">

νο. Πάτα δεύτερο για να τα συνδυάσεις.": "Pick an item. Tap a second one to combine them.", "Δεν βγαίνει νόημα.": "That makes no sense.", "Όχι, δεν πάει εκεί.": "Nope, that doesn't go there.", "Ο Τάκης το σκέφτεται. Ο Τάκης αποφασίζει: όχι.": "Takis considers it. Takis decides: no.", "Ούτε καν.": "Not even close.", "Δεν υπάρχει τίποτα εδώ για να το χρησιμοποιήσεις. (B για άδεια χέρια)": "There's nothing here to use it on. (B for empty hands)", "Καλοκαίρι του 1988. Το νησί Αλμυρίκι.": "Summer 1988. The island of Almyriki.", "Ο Τάκης Λουκουμάς, 41 ετών, λογιστής στην Εφορία Πειραιά.": "Takis Loukoumas, 41, accountant at the Piraeus Tax Office.", "Η Σούλα τον παράτησε για έναν γυμναστή αεροβικής.": "Soula dumped him for an aerobics instructor.", "Ο Τάκης κέρδισε σε λαχνό ένα σαββατοκύριακο στο Αλμυρίκι.": "Takis won a weekend on Almyriki in a raffle.", "Απόψε θα γίνει άλλος άνθρωπος. Ή τουλάχιστον θα προσπαθήσει.": "Tonight he'll become a new man. Or at least he'll try.", "Βέλη για κίνηση. A εξετάζει ή χρησιμοποιεί. B αλλάζει το αντικείμενο που κρατάς. Στην τσάντα συνδυάζεις.": "Arrows to move. A examines or uses. B switches the item you're holding. Combine items in the bag.", " · A για χρήση": " · A to use", "Ρυθμίσεις": "Settings", "Στην αρχική": "Back to title", "Εξέταση": "Examine", "Κλείσιμο": "Close", "Νέο παιχνίδι": "New game", "Συνέχεια": "Continue", "Καλοκαίρι 1988. Ένας λογιστής, ένα νησί, μία ευκαιρία.": "Summer 1988. One accountant, one island, one chance.", "Μέγεθος γραμμάτων": "Text size", "Γλώσσα": "Language", "Έτσι θα φαίνονται τα κείμενα: «Ένας φραπές, μέτριος με γάλα!»": "This is how text will look: \"A frappé, medium sweet with milk!\"", "Πλήρης οθόνη": "Full screen", "Από την αρχή": "Start over", "Γύρισε το κινητό οριζόντια.": "Turn your phone sideways.", "Φωνάζεις «Γεια σου, καπετάνιε!». Ο καπετάνιος σού κάνει ένα άσεμνο νόημα.": "You shout \"Hello, captain!\". The captain makes a rude gesture at you.", "Η γάτα σού ρίχνει ένα βλέμμα που λέει «μην τολμήσεις».": "The cat gives you a look that says \"don't you dare\".", "Το περίπτερο του Μανώλη. Πουλάει τα πάντα, από τσίχλες μέχρι μπαταρίες.": "Manolis's kiosk. It sells everything, from chewing gum to batteries.", "Κάθεσαι για λίγο. Η Σούλα σε κυνηγάει ακόμα και εδώ. Σηκώνεσαι.": "You sit down for a moment. Soula haunts you even here. You get up.", "Κιβώτια": "Crates", "Κιβώτια με ντομάτες από την Κρήτη. Πιο κόκκινες από τον DJ Σάκη. Θα το καταλάβεις.": "Crates of tomatoes from Crete. Redder than DJ Sakis. You'll see.", "Είναι βαριά. Η μέση σου διαμαρτύρεται από την ανάμνηση και μόνο.": "They're heavy. Your back complains at the mere memory.", "Σωσίβιο": "Lifebuoy", "Ένα σωσίβιο. Αν πέσεις στη θάλασσα, θα σε σώσει. Από την ντροπή, όχι.": "A lifebuoy. If you fall in the sea, it will save you. From embarrassment, no.", "Το αφήνεις στη θέση του. Ποτέ δεν ξέρεις.": "You leave it where it is. You never know.", "Σουβλατζίδικο «Ο Μπάμπης». Η μυρωδιά φτάνει ως το λιμάνι.": "Souvlaki shop \"Babis'\". The smell reaches all the way to the harbour.", "Μπάμπης": "Babis", "Ο Μπάμπης. Φαλακρός, ιδρωμένος και ευτυχισμένος.": "Babis. Bald, sweaty and happy.", "Το κουρείο του κυρ-Θανάση. Μια καρέκλα, ένας καθρέφτης και πενήντα χρόνια κουτσομπολιό.": "Mr Thanasis's barber shop. One chair, one mirror and fifty years of gossip.", "Κυρ-Θανάσης": "Mr Thanasis", "Ο κυρ-Θανάσης, ο κουρέας. Χτενίζει το μουστάκι του με το δάχτυλο.": "Mr Thanasis, the barber. He combs his moustache with one finger.", "Βρύση": "Fountain", "Μια μαρμάρινη βρύση με ένα δελφίνι. Φτύνει νερό με μεγάλη αυτοπεποίθηση.": "A marble fountain with a dolphin. It spits water with great confidence.", "Ρίχνεις μια δραχμή για γούρι. Α, όχι. Δεν έχεις δραχμή να πετάς.": "You toss a drachma for luck. Oh, wait. You don't have drachmas to throw away.", "Τουριστικά «Η Λίτσα». Μπλουζάκια, αλυσίδες και γλάστρες με σχήμα Παρθενώνα.": "Souvenirs \"Litsa's\". T-shirts, chains and flowerpots shaped like the Parthenon.", "Λίτσα": "Litsa", "Η κυρία Λίτσα. Το μαλλί της έχει δικό του ταχυδρομικό κώδικα.": "Mrs Litsa. Her hair has its own postcode.", "Κάρτες": "Postcards", "Καρτ ποστάλ: ηλιοβασιλέματα, γαϊδουράκια και ένας παπάς πάνω σε μηχανάκι.": "Postcards: sunsets, donkeys and a priest on a moped.", "Ξενοδοχείο «Παράδεισος». Ροζ σαν τσιχλόφουσκα. Τρία αστέρια, από τα οποία τα δύο είναι ζωγραφιστά.": "Hotel \"Paradise\". Pink as bubblegum. Three stars, two of them painted on.", "Πόρτα ξενοδοχείου": "Hotel door", "Η γυάλινη πόρτα του ξενοδοχείου.": "The hotel's glass door.", "Ο DJ Σάκης ξαπλωμένος στην ξαπλώστρα. Αχνίζει.": "DJ Sakis lying on the sunbed. He's steaming.", "Κυρία: «Μη μου κρύβεις τον ήλιο, νεαρέ.»": "Lady: \"Don't block my sun, young man.\"", "Είναι η πρώτη φορά εδώ και χρόνια που σε λένε «νεαρέ».": "It's the first time in years anyone has called you \"young man\".", "Βουτάς το δάχτυλο του ποδιού. Κρύα. Αύριο.": "You dip a toe in. Cold. Tomorrow.", "Η Δανάη. Ηλιοκαμένη, γελαστή και εντελώς εκτός κατηγορίας σου.": "Danae. Sun-tanned, smiling and completely out of your league.", "Ένα παιδάκι με κόκκινο καπέλο χτίζει κάστρο.": "A kid in a red cap is building a sandcastle.", "Κάστρο": "Sandcastle", "Ένα κάστρο με τρεις πύργους. Καλύτερη αρχιτεκτονική από την Εφορία.": "A castle with three towers. Better architecture than the Tax Office.", "Το παιδάκι σε κοιτάζει με τρόμο. Αφήνεις το κάστρο ήσυχο.": "The kid looks at you in terror. You leave the castle alone.", "Ο Γορίλας. Δύο μέτρα μπάρμαν, πόρτα και τοίχος μαζί.": "The Gorilla. Two metres of bouncer, door and wall in one.", "Το Ζεφύρ Beach Club. Τη μέρα καλύβα, τη νύχτα ναός της ντίσκο.": "The Zefyr Beach Club. A shack by day, a temple of disco by night.", "Η γυάλινη πόρτα προς την πλατεία. Ο ήλιος μπαίνει με θράσος.": "The glass door to the square. The sun comes in like it owns the place.", "Κλειδιά": "Keys", "Ο πίνακας με τα κλειδιά των δωματίων. Το 23 λείπει, γιατί είναι πλέον δικό σου.": "The board with the room keys. Number 23 is   ]}; }

<script id="hd">
function hj(r,a){ return (r()-.5)*a; }
function hpath(g,pts,close){ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); if(close!==false) g.closePath(); }
function hfill(g,pts,f){ hpath(g,pts); g.fillStyle=f; g.fill(); }
function hink(g,pts,w,c,close,r,wob){ g.save(); g.lineCap='round'; g.lineJoin='round'; g.strokeStyle=c; g.lineWidth=w; g.beginPath();
  pts.forEach((p,i)=>{ const x=p[0]+(r?hj(r,wob||.3):0), y=p[1]+(r?hj(r,wob||.3):0); i?g.lineTo(x,y):g.moveTo(x,y); }); if(close) g.closePath(); g.stroke(); g.restore(); }
function hlin(g,x0,y0,x1,y1,stops){ const gr=g.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
function hrad(g,x,y,r0,r1,stops){ const gr=g.createRadialGradient(x,y,r0,x,y,r1); stops.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
/* brush strokes clipped to a shape: the "hand painted" texture */
function hbrush(g,clip,box,cols,n,len,w,ang,alpha,seed){ const r=rng(seed||7); g.save(); if(clip){ hpath(g,clip); g.clip(); }
  g.lineCap='round'; for(let i=0;i<n;i++){ const x=box[0]+r()*box[2], y=box[1]+r()*box[3], a=ang+hj(r,.6), L=len*(.5+r());
    g.strokeStyle=cols[(r()*cols.length)|0]; g.globalAlpha=alpha*(.5+r()*.5); g.lineWidth=w*(.6+r()*.8);
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a)*L*.5+hj(r,w),y+Math.sin(a)*L*.5+hj(r,w),x+Math.cos(a)*L,y+Math.sin(a)*L); g.stroke(); }
  g.restore(); }
function hrrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r); g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); }
function hcol(base,d){ const m=base[0]==='#'?[parseInt(base.slice(1,3),16),parseInt(base.slice(3,5),16),parseInt(base.slice(5,7),16)]:base.match(/\d+/g).map(Number); return 'rgb('+Math.max(0,Math.min(255,m[0]+d))+','+Math.max(0,Math.min(255,m[1]+d))+','+Math.max(0,Math.min(255,m[2]+d))+')'; }
function hlimb(g,x0,y0,x1,y1,w0,w1,fill,ink){ const a=Math.atan2(y1-y0,x1-x0), nx=-Math.sin(a), ny=Math.cos(a);
  g.beginPath(); g.moveTo(x0+nx*w0/2,y0+ny*w0/2); g.lineTo(x1+nx*w1/2,y1+ny*w1/2); g.arc(x1,y1,w1/2,a+Math.PI/2,a-Math.PI/2,true); g.lineTo(x0-nx*w0/2,y0-ny*w0/2); g.arc(x0,y0,w0/2,a-Math.PI/2,a+Math.PI/2,true); g.closePath();
  g.fillStyle=fill; g.fill(); if(ink){ g.strokeStyle=ink; g.lineWidth=.35; g.stroke(); } }
function hshadow(g,x,y,rx,ry,a){ g.fillStyle=hrad(g,x,y,0,rx,[[0,'rgba(0,0,0,'+(a||.45)+')'],[1,'rgba(0,0,0,0)']]); g.save(); g.translate(x,y); g.scale(1,ry/rx); g.translate(-x,-y); g.beginPath(); g.arc(x,y,rx,0,7); g.fill(); g.restore(); }

/* =====================================================================
   Ο Λουκουμάς στο Αλμυρίκι — HD "hand-painted" renderer
   Painted with vector brushes in world units (the 2.5D layout, 320×180 logical),
   drawn at the output resolution, so hotspots, walk areas and logic stay identical.
   Palette: the game's own — ink #2b1d3a, sun #ffd23f, pink #e0338a, sea #1f74d0, paper #fffbe8.
   ===================================================================== */
const HDK=6;                        /* cache pixels per world unit */
const HDA={};                       /* per-scene painters: bg (cached) · dyn · props · fg */
const HDCACHE={};
const INK='rgba(43,29,58,.86)', INK2='rgba(43,29,58,.55)';
let HDON=true;

/* soft painted cloud */
function hcloud(g,x,y,s,seed){ const r=rng(seed);
  const puffs=[[0,0,7],[8,-4,9],[17,-1,7.5],[25,1,5.5],[-7,2,5],[12,2,8]];
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='rgba(120,150,210,.28)'; g.beginPath(); g.ellipse(9,6.5,22,3.4,0,0,7); g.fill();
  for(const [px,py,pr] of puffs){ g.fillStyle=hrad(g,px-pr*.3,py-pr*.4,pr*.1,pr*1.05,[[0,'#ffffff'],[.6,'#f4f8ff'],[1,'rgba(200,220,250,.0)']]); g.beginPath(); g.arc(px,py,pr,0,7); g.fill(); }
  g.fillStyle=hlin(g,0,-2,0,8,[[0,'rgba(255,255,255,0)'],[1,'rgba(150,175,225,.45)']]); g.beginPath(); g.ellipse(9,4,21,4.2,0,0,7); g.fill();
  hbrush(g,null,[-10,-10,40,14],['rgba(255,255,255,.7)','rgba(225,235,255,.6)'],26,4,.7,0,.35,seed*7);
  g.restore(); }

/* ---------- distant islands, chapel, lighthouse ---------- */
function hdIslands(g,w){
  /* far ridge */
  g.beginPath(); g.moveTo(0,62); for(let x=0;x<=w;x+=2){ const h=9+5*Math.sin(x*.021)+3*Math.sin(x*.057+1); g.lineTo(x,62-h); } g.lineTo(w,62); g.closePath();
  g.fillStyle=hlin(g,0,46,0,62,[[0,'#a9c4e6'],[1,'#c6dcf2']]); g.fill();
  hbrush(g,null,[0,46,w,16],['rgba(255,255,255,.25)','rgba(140,170,215,.3)'],160,6,.5,0,.4,11);
  /* near ridge with terraces */
  g.beginPath(); g.moveTo(0,62); for(let x=0;x<=w;x+=2){ const h=5+3*Math.sin(x*.035+2)+1.6*Math.sin(x*.11); g.lineTo(x,62-h); } g.lineTo(w,62); g.closePath();
  g.fillStyle=hlin(g,0,52,0,62,[[0,'#8fb0d8'],[1,'#a8c4e4']]); g.fill();
  /* white village and a blue-domed chapel on the far shore */
  const r=rng(41); for(let i=0;i<16;i++){ const x=300+i*7+r()*4, y=58-Math.abs(Math.sin(i*.7))*3-r()*2, ww=3+r()*3, hh=2+r()*2;
    g.fillStyle='#f4f6fb'; g.fillRect(x,y-hh,ww,hh); g.fillStyle='rgba(120,150,200,.55)'; g.fillRect(x+ww-.8,y-hh,.8,hh); if(r()<.5){ g.fillStyle='#4a78c8'; g.fillRect(x+.8,y-hh+.6,.7,.8); } }
  g.fillStyle='#f6f8fc'; g.fillRect(356,51.5,6,4.5); g.fillStyle='#2f6fd6'; g.beginPath(); g.arc(359,51.6,2.6,Math.PI,0); g.fill(); g.fillStyle='#f6f8fc'; g.fillRect(358.7,47.8,.6,1.4);
  /* haze over the horizon */
  g.fillStyle=hlin(g,0,52,0,62,[[0,'rgba(230,242,255,0)'],[1,'rgba(230,242,255,.55)']]); g.fillRect(0,52,w,10);
  /* lighthouse islet */
  hfill(g,[[462,61],[466,55],[471,53],[478,54.5],[486,53],[492,56],[497,61]],hlin(g,0,53,0,61,[[0,'#b08a5a'],[1,'#7a5a3a']]));
  hbrush(g,[[462,61],[466,55],[471,53],[478,54.5],[486,53],[492,56],[497,61]],[462,52,36,10],['#c8a070','#6a4a2a','#9a7448'],40,2.4,.4,.3,.5,77);
  /* tower */
  const tx=477; hfill(g,[[tx-.2,58],[tx+6.2,58],[tx+5.4,37],[tx+.6,37]],hlin(g,tx,0,tx+6,0,[[0,'#e4e8f0'],[.45,'#ffffff'],[1,'#c8cfe0']]));
  for(const by of [41,49]) hfill(g,[[tx+.4+(by-37)*.038,by],[tx+5.6-(by-37)*.038,by],[tx+5.5-(by+3-37)*.038,by+3],[tx+.5+(by+3-37)*.038,by+3]],'#e8463a');
  g.fillStyle='#2b1d3a'; g.fillRect(tx-.4,35.4,6.8,1.6); g.fillStyle='#ffe066'; g.fillRect(tx+1.2,33,3.6,2.6); g.fillStyle='#2b1d3a'; g.beginPath(); g.moveTo(tx+.6,33); g.lineTo(tx+3,30.6); g.lineTo(tx+5.4,33); g.fill();
  hink(g,[[tx+.6,37],[tx-.2,58]],.3,INK2,false); hink(g,[[tx+5.4,37],[tx+6.2,58]],.3,INK2,false);
  g.fillStyle='rgba(43,29,58,.5)'; g.fillRect(tx+2.4,53,1.4,4.6); }

/* ---------- the sea ---------- */
function hdSea(g,w){ const r=rng(13);
  g.fillStyle=hlin(g,0,60,0,100,[[0,'#8fd2fa'],[.15,'#5cb6f2'],[.5,'#3a98e6'],[.85,'#2580d6'],[1,'#1d6ec8']]); g.fillRect(0,60,w,40);
  /* long painted swells */
  for(let i=0;i<320;i++){ const y=61+Math.pow(r(),1.4)*37, d=(y-60)/40, x=r()*w, L=3+d*16+r()*6;
    g.strokeStyle=r()<.55?'rgba(170,225,255,'+(.35+r()*.35)+')':'rgba(20,80,170,'+(.25+r()*.3)+')'; g.lineWidth=.25+d*.7; g.lineCap='round';
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+L/2,y-.4-d*.6,x+L,y); g.stroke(); }
  /* sun path on the water (sun sits at screen x≈262 — painted as a broad shimmer) */
  g.fillStyle=hrad(g,262,62,0,70,[[0,'rgba(255,250,220,.35)'],[1,'rgba(255,250,220,0)']]); g.fillRect(190,60,150,40); }

/* ---------- the ferry «Αγία Θάλασσα» ---------- */
const FERRY_HULL=[[6,56],[166,56],[182,68],[172,98],[12,98]];
function hdFerry(g){ const r=rng(5);
  /* shadow cast on the water */
  g.fillStyle='rgba(15,50,120,.35)'; g.beginPath(); g.moveTo(12,98); g.lineTo(172,98); g.lineTo(166,100); g.lineTo(16,100); g.fill();
  /* superstructure */
  g.fillStyle=hlin(g,0,32,0,56,[[0,'#ffffff'],[.7,'#f2f3f8'],[1,'#d8dbe8']]); hrrect(g,22,32,116,24,1.2); g.fill(); hink(g,[[22,56],[22,33],[137,33],[138,56]],.45,INK2,false);
  for(let x=26;x<132;x+=8){ g.fillStyle=hlin(g,0,38,0,45,[[0,'#2a4a8a'],[1,'#13285a']]); hrrect(g,x,38,5,7,.8); g.fill(); g.fillStyle='rgba(170,215,255,.75)'; g.fillRect(x+.6,38.6,1.6,2.2); }
  g.fillStyle='#2a5fd6'; g.fillRect(22,50,116,2); g.fillStyle='rgba(43,29,58,.25)'; g.fillRect(22,55,116,1);
  /* bridge deck */
  g.fillStyle=hlin(g,0,18,0,32,[[0,'#ffffff'],[1,'#e2e5ee']]); hrrect(g,114,18,26,14,1.4); g.fill(); hink(g,[[114,32],[114,19],[140,19],[140,32]],.4,INK2,false);
  g.fillStyle='#132a5a'; hfill(g,[[116,21],[139,21],[140,26],[116,26]],'#132a5a'); g.fillStyle='rgba(150,205,255,.6)'; g.fillRect(118,21.6,4,1.2); g.fillRect(126,21.6,4,1.2);
  /* mast + bunting */
  g.strokeStyle='#4a4a5a'; g.lineWidth=.7; g.beginPath(); g.moveTo(127,18); g.lineTo(127,3); g.moveTo(124,7); g.lineTo(130,7); g.stroke();
  const bcol=['#e8463a','#ffd23f','#2a5fd6','#ffffff','#2f9a3a','#e0338a'];
  g.strokeStyle='rgba(43,29,58,.6)'; g.lineWidth=.25; g.beginPath(); g.moveTo(127,3.5); g.quadraticCurveTo(156,30,179,63); g.stroke(); g.beginPath(); g.moveTo(127,3.5); g.quadraticCurveTo(70,10,10,40); g.stroke();
  for(let i=1;i<18;i++){ const t=i/18, x=(1-t)*(1-t)*127+2*(1-t)*t*156+t*t*179, y=(1-t)*(1-t)*3.5+2*(1-t)*t*30+t*t*63; g.fillStyle=bcol[i%6]; g.beginPath(); g.moveTo(x-1,y); g.lineTo(x+1,y); g.lineTo(x,y+2.2); g.fill(); }
  for(let i=1;i<20;i++){ const t=i/20, x=(1-t)*(1-t)*127+2*(1-t)*t*70+t*t*10, y=(1-t)*(1-t)*3.5+2*(1-t)*t*10+t*t*40; g.fillStyle=bcol[(i+3)%6]; g.beginPath(); g.moveTo(x-1,y); g.lineTo(x+1,y); g.lineTo(x,y+2.2); g.fill(); }
  /* funnel */
  hfill(g,[[80,28],[93,28],[91.5,7],[81,7]],hlin(g,80,0,93,0,[[0,'#1a4ab8'],[.45,'#3a78ee'],[1,'#163c94']]));
  g.fillStyle='#ffffff'; hfill(g,[[80.6,16],[92.4,16],[92.2,13],[80.8,13]],'#ffffff'); g.fillStyle='#e8463a'; g.fillRect(81,8,10.4,1.4);
  g.fillStyle='#2b1d3a'; g.beginPath(); g.ellipse(86.3,7,5.3,1,0,0,7); g.fill(); hink(g,[[80,28],[81,7]],.35,INK2,false); hink(g,[[93,28],[91.5,7]],.35,INK2,false);
  /* top railing */
  g.strokeStyle='#9aa0b8'; g.lineWidth=.35; g.beginPath(); g.moveTo(22,28.4); g.lineTo(140,28.4); g.moveTo(22,30.2); g.lineTo(140,30.2); for(let x=22;x<=140;x+=3){ g.moveTo(x,28.4); g.lineTo(x,32); } g.stroke();
  /* lifeboats on davits */
  for(const x of [28,58,96]){ g.strokeStyle='#5a5a6a'; g.lineWidth=.6; g.beginPath(); g.moveTo(x+1,32); g.quadraticCurveTo(x-1,22,x+3,22); g.moveTo(x+17,32); g.quadraticCurveTo(x+19,22,x+15,22); g.stroke();
    g.fillStyle=hlin(g,0,24,0,31,[[0,'#ffa04a'],[.5,'#ff7a1a'],[1,'#c8501a']]); g.beginPath(); g.moveTo(x,25); g.lineTo(x+18,25); g.quadraticCurveTo(x+17,31,x+9,31); g.quadraticCurveTo(x+1,31,x,25); g.fill();
    g.fillStyle='#ffffff'; g.fillRect(x+1,25,16,1.4); hink(g,[[x,25],[x+18,25]],.3,INK); }
  /* hull */
  g.save(); hpath(g,FERRY_HULL); g.fillStyle=hlin(g,0,56,0,98,[[0,'#ffffff'],[.55,'#f4f5fa'],[1,'#c8cede']]); g.fill(); g.clip();

κλους.", "Strained yogurt is neither lubricant nor insulation. The barber pole stripes keep going round."], ["Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The barber pole stripes keep going round. The tub remains intact. Mum would approve of the economy."]], "square/pole/invitation": [["Αυτή είναι η πρόσκληση. Τη μουσική και τις μεταφορές τις αναλαμβάνουν άλλοι. Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους.", "This is the invitation. Music and transport are somebody else’s job. The barber pole stripes keep going round."], ["Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The barber pole stripes keep going round. You put the invitation away. “Admits one” keeps staring back."]], "square/pole/key": [["Το κλειδί είναι για το δωμάτιό σου, όχι εργαλείο επισκευών. Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους.", "The key is for your room, not electrical repairs. The barber pole stripes keep going round."], ["Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "The barber pole stripes keep going round. 23 remains 23. The dolphin offers no comment."]], "square/pole/pencil": [["Το μολύβι δεν είναι κατσαβίδι. Για κασέτες, το συζητάμε. Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους.", "The pencil is not a screwdriver. Cassettes are another matter. The barber pole stripes keep going round."], ["Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "The barber pole stripes keep going round. The pencil survives another irrelevant assignment."]], "square/pole/tape_jam": [["Πρώτα φτιάχνεις την κασέτα. Μετά ανησυχείς για το μηχάνημα. Οι ρίγες του κουρείου συνεχίζουν να κάνουν κύκλους.", "First fix the cassette. Then worry about the machine. The barber pole stripes keep going round."], ["Οι ρίγες του κουρείου συνεχίζουν να κάνου ht. The foam is your only stable plan."]], "square/barber/chain": [["Δεν χρειάζεται να ντύσεις όλο το νησί για βραδινή έξοδο. Το κουρείο δεν έχει τιμοκατάλογο για πειράματα.", "You need not dress the whole island for a night out. The barber shop has no price list for experiments."], ["Το κουρείο δεν έχει τιμοκατάλογο για πειράματα. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The barber shop has no price list for experiments. The chain goes back into place. Your neck had begun to worry."]], "square/barber/hairspray": [["Δεν χρειάζεται λακ για να μείνει στη θέση του. Το κουρείο δεν έχει τιμοκατάλογο για πειράματα.", "It needs no hairspray to stay put. The barber shop has no price list for experiments."], ["Το κουρείο δεν έχει τιμοκατάλογο για πειράματα. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The barber shop has no price list for experiments. The cap stays shut. One parting per customer."]], "square/barber/yogurt": [["Δεν απλώνεις γιαούρτι στην περιουσία των άλλων. Ούτε για δοκιμή. Το κουρείο δεν έχει τιμοκατάλογο για πειράματα.", "You do not spread yogurt on other people’s property. Not even as an experiment. The barber shop has no price list for experiments."], ["Το κουρείο δεν έχει τιμοκατάλογο για πειράματα. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The barber shop has no price list for experiments. The tub remains intact. Mum would approve of the economy."]], "square/barber/invitation": [["Η πρόσκληση ισχύει για το Ζεφύρ, όχι για όλο το Αιγαίο. Το κουρείο δεν έχει τιμοκατάλογο για πειράματα.", "The invitation is for Zefyr, not the whole Aegean. The barber shop has no price list for experiments."], ["Το κουρείο δεν έχει τιμοκατάλογο για πειράματα. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The barber shop has no price list for experiments. You put the invitation away. “Admits one” keeps staring back."]], "square/barber/key": [["Το 23 στο κλειδί δεν είναι γενική άδεια εισόδο batteries. The wallet supplies no electricity. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The parked red scooter is not yours. The wallet returns to your pocket. The drachmas breathe again."]], "square/moped/voucher": [["Δεν υπάρχει υποδοχή «κέρδισα σε λαχνό». Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "There is no “I won a raffle” slot. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The parked red scooter is not yours. You fold the voucher again. The raffle had no instructions for this."]], "square/moped/frappe": [["Φραπές για καύσιμο; Μόνο ο Τάκης λειτουργεί με αυτό. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "Frappé as fuel? Only Takis runs on that. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "The parked red scooter is not yours. You keep the cup upright. The foam is your only stable plan."]], "square/moped/chain": [["Δεν είναι ανταλλακτική αλυσίδα. Το «χρυσή» δεν είναι τεχνική προδιαγραφή. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "It is not a replacement chain. “Gold” is not a technical specification. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The parked red scooter is not yours. The chain goes back into place. Your neck had begun to worry."]], "square/moped/hairspray": [["Η λακ δεν είναι σπρέι τεχνικής συντήρησης. Το αφήνεις ήσυχο. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "Hairspray is not a maintenance spray. You leave it alone. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The parked red scooter is not yours. The cap stays shut. One parting per customer."]], "square/moped/yogurt": [["Το στραγγιστό δεν είναι λιπαντικό ούτε μονωτικό υλικό. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "Strained yogurt is neither lubricant nor insulation. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The parked red scooter is not yours. The tub remains intact. Mum would approve of the economy."]], "square/moped/invitation": [["Αυτή είναι η πρόσκληση. Τη μουσική και τις μεταφορές τις αναλαμβάνουν άλλοι. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "This is the invitation. Music and transport are somebody else’s job. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The parked red scooter is not yours. You put the invitation away. “Admits one” keeps staring back."]], "square/moped/key": [["Το κλειδί γράφει 23. Το μηχανάκι δεν γράφει «δωμάτιο». Αρκετά πειράματα.", "The key says 23. The scooter does not say “room”. Enough experiments."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "The parked red scooter is not yours. 23 remains 23. The dolphin offers no comment."]], "square/moped/pencil": [["Το μολύβι δεν είναι κατσαβίδι. Για κασέτες, το συζητάμε. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "The pencil is not a screwdriver. Cassettes are another matter. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "The parked red scooter is not yours. The pencil survives another irrelevant assignment."]], "square/moped/tape_jam": [["Πρώτα φτιάχνεις την κασέτα. Μετά ανησυχείς για το μηχάνημα. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "First fix the cassette. Then worry about the machine. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "The parked red scooter is not yours. The tape stays protected. It has already been out quite enough."]], "square/moped/tape": [["Χρειάζεται το σωστό κασετόφωνο. Το να την κρατάς κοντά δεν αρκεί. Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου.", "It needs the right tape deck. Merely holding it nearby will not do. The parked red scooter is not yours."], ["Το παρκαρισμένο κόκκινο μηχανάκι δεν είναι δικό σου. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "The parked red scooter is not yours. The cassette goes back safely. You did not rescue it just to lose it now."]], "square/fountain/wallet": [["Το πορτοφόλι μένει στεγνό. Τα οικονομικά σου βουλιάζουν ήδη αρκετά. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "The wallet stays dry. Your finances are sinking quite enough already. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The square’s fountain jets already have their own programme. The wallet returns to your pocket. The drachmas breathe again."]], "square/fountain/voucher": [["Δεν περιλαμβάνει θαλάσσια σπορ. Ούτε αδιάβροχη εκτύπωση. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "It includes neither water sports nor waterproof printing. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The square’s fountain jets already have their own programme. You fold the voucher again. The raffle had no instructions for this."]], "square/fountain/frappe": [["Σκέφτεσαι φραπέ με τρεχούμενο νερό. Αποφασίζεις ότι ο Μανώλης ήξερε την αναλογία καλύτερα.", "You consider a frappé with running water. Manolis probably knew the proportions better."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "The square’s fountain jets already have their own programme. You keep the cup upright. The foam is your only stable plan."]], "square/fountain/chain": [["Δεν είναι συντριβάνι ευχών. Και η πλαστική αλυσίδα θα έκανε πολύ φτηνό όνειρο.", "It is not a wishing fountain. A plastic chain would make a very cheap wish."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The square’s fountain jets already have their own programme. The chain goes back into place. Your neck had begun to worry."]], "square/fountain/hairspray": [["Δεν θα κάνεις το νερό να κρατήσει χτένισμα. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "You cannot give water a permanent hairstyle. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The square’s fountain jets already have their own programme. The cap stays shut. One parting per customer."]], "square/fountain/yogurt": [["Η μεγαλύτερη μερίδα αριάνι του Αιγαίου μπορεί να περιμένει. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "The Aegean’s largest serving of ayran can wait. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The square’s fountain jets already have their own programme. The tub remains intact. Mum would approve of the economy."]], "square/fountain/invitation": [["Το Beach Club έχει το «Beach» στο όνομα, όχι αδιάβροχες προσκλήσεις. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "The Beach Club has “Beach” in its name, not waterproof invitations. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The square’s fountain jets already have their own programme. You put the invitation away. “Admits one” keeps staring back."]], "square/fountain/key": [["Το ξύλινο δελφίνι δεν χρειάζεται απελευθέρωση στο φυσικό του περιβάλλον. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "The wooden dolphin does not need releasing into the wild. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "The square’s fountain jets already have their own programme. 23 remains 23. The dolphin offers no comment."]], "square/fountain/pencil": [["Το μολύβι δεν είναι βυθόμετρο. Δεν ψάχνεις πόσο βαθιά έπεσε η αξιοπρέπειά σου.", "The pencil is not a depth gauge. You are not measuring how far your dignity has sunk."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "The square’s fountain jets already have their own programme. The pencil survives another irrelevant assignment."]], "square/fountain/tape_jam": [["Δεν ξεπλένεται έτσι η μουσική. Η ταινία μένει στεγνή. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "You cannot rinse music clean that way. The tape stays dry. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "The square’s fountain jets already have their own programme. The tape stays protected. It has already been out quite enough."]], "square/fountain/tape": [["Το επόμενο σουξέ δεν θα είναι υποβρύχιο. Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους.", "The next hit is not going to be underwater. The square’s fountain jets already have their own programme."], ["Οι πίδακες της πλατείας έχουν ήδη το πρόγραμμά τους. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "The square’s fountain jets already have their own programme. The cassette goes back safely. You did not rescue it just to lose it now."]], "square/shop/wallet": [["Δεν είναι όλα προς πώληση. Ειδικά με τα δικά σου οικονομικά. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "Not everything is for sale. Especially on your budget. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "Litsa’s souvenir shop already has enough curiosities. The wallet returns to your pocket. The drachmas breathe again."]], "square/shop/voucher": [["Διαμονή κέρδισες, όχι γενική άδεια για πειράματα. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "You won a stay, not a general licence to experiment. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "Litsa’s souvenir shop already has enough curiosities. You fold the voucher again. The raffle had no instructions for this."]], "square/shop/frappe": [["Ψάχνεις θέση για το ποτήρι και τελικά προτιμάς το χέρι σου. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "You consider a spot for the cup, then decide your hand is safer. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "Litsa’s souvenir shop already has enough curiosities. You keep the cup upright. The foam is your only stable plan."]], "square/shop/chain": [["Δεν χρειάζεται να ντύσεις όλο το νησί για βραδινή έξοδο. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "You need not dress the whole island for a night out. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "Litsa’s souvenir shop already has enough curiosities. The chain goes back into place. Your neck had begun to worry."]], "square/shop/hairspray": [["Δεν χρειάζεται λακ για να μείνει στη θέση του. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "It needs no hairspray to stay put. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "Litsa’s souvenir shop already has enough curiosities. The cap stays shut. One parting per customer."]], "square/shop/yogurt": [["Δεν απλώνεις γιαούρτι στην περιουσία των άλλων. Ούτε για δοκιμή. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "You do not spread yogurt on other people’s property. Not even as an experiment. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "Litsa’s souvenir shop already has enough curiosities. The tub remains intact. Mum would approve of the economy."]], "square/shop/invitation": [["Η πρόσκληση ισχύει για το Ζεφύρ, όχι για όλο το Αιγαίο. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "The invitation is for Zefyr, not the whole Aegean. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "Litsa’s souvenir shop already has enough curiosities. You put the invitation away. “Admits one” keeps staring back."]], "square/shop/key": [["Το 23 στο κλειδί δεν είναι γενική άδεια εισόδου. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "The 23 on the key is not a universal entry permit. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "Litsa’s souvenir shop already has enough curiosities. 23 remains 23. The dolphin offers no comment."]], "square/shop/pencil": [["Δεν προσθέτεις την υπογραφή σου σε ξένη περιουσία. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "You do not add your signature to somebody else’s property. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "Litsa’s souvenir shop already has enough curiosities. The pencil survives another irrelevant assignment."]], "square/shop/tape_jam": [["Δεν χρειάζεσαι άλλο σημείο να σκαλώσει η ξετυλιγμένη ταινία. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "You do not need another place for the loose tape to snag. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "Litsa’s souvenir shop already has enough curiosities. The tape stays protected. It has already been out quite enough."]], "square/shop/tape": [["Δεν την αφήνεις εκτεθειμένη. Η μουσική σου έχει ήδη ταλαιπωρηθεί. Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα.", "You do not leave it lying around. Your music has been through enough. Litsa’s souvenir shop already has enough curiosities."], ["Τα τουριστικά της Λίτσας έχουν ήδη αρκετά αξιοπερίεργα. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "Litsa’s souvenir shop already has enough curiosities. The cassette goes back safely. You did not rescue it just to lose it now."]], "square/litsa/wallet": [["Η φωτογραφία της μαμάς δεν μετράει ως συστατική επιστολή. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "Mum’s photo does not count as a letter of recommendation. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "Litsa expects a proper conversation, not another inventory check. The wallet returns to your pocket. The drachmas breathe again."]], "square/litsa/voucher": [["Το κουπόνι γράφει «ένα άτομο». Δεν γίνεται κοινωνική λέσχη. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "The voucher says “one person”. It does not make a social club. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "Litsa expects a proper conversation, not another inventory check. You fold the voucher again. The raffle had no instructions for this."]], "square/litsa/frappe": [["Κρατάς τον φραπέ. Η διπλωματία δεν γίνεται με μισολιωμένο καλαμάκι. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "You keep the frappé. Diplomacy needs more than a soggy straw. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "Litsa expects a proper conversation, not another inventory check. You keep the cup upright. The foam is your only stable plan."]], "square/litsa/chain": [["Η αλυσίδα γυαλίζει. Η συζήτηση δεν αγοράζεται με πλαστικά καράτια. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "The chain gleams. Conversation is not bought with plastic carats. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "Litsa expects a proper conversation, not another inventory check. The chain goes back into place. Your neck had begun to worry."]], "square/litsa/hairspray": [["Δεν ψεκάζεις κόσμο χωρίς να ρωτήσεις. Το δικό σου μαλλί είναι η δουλειά σου. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "You do not spray people without asking. Your own hair is your business. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "Litsa expects a proper conversation, not another inventory check. The cap stays shut. One parting per customer."]], "square/litsa/yogurt": [["Το γιαούρτι δεν είναι λύση για κάθε άνθρωπο που συναντάς. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "Yogurt is not a solution to every person you meet. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "Litsa expects a proper conversation, not another inventory check. The tub remains intact. Mum would approve of the economy."]], "square/litsa/invitation": [["Η πρόσκληση γράφει «είσοδος για έναν». Το θυμάσαι την τελευταία στιγμή. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "The invitation says “admits one”. You remember just in time. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "Litsa expects a proper conversation, not another inventory check. You put the invitation away. “Admits one” keeps staring back."]], "square/litsa/key": [["Δεν δίνεις σε όποιον περνάει το κλειδί του δωματίου σου. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "You do not hand your room key to everyone you meet. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "Litsa expects a proper conversation, not another inventory check. 23 remains 23. The dolphin offers no comment."]], "square/litsa/pencil": [["Το μολύβι δεν είναι μικρόφωνο. Ούτε ο κόσμος περιμένει αυτόγραφο. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "The pencil is not a microphone. Nobody is waiting for an autograph either. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "Litsa expects a proper conversation, not another inventory check. The pencil survives another irrelevant assignment."]], "square/litsa/tape_jam": [["Δεν δείχνεις τη μασημένη κασέτα σαν να είναι επαγγελματική κάρτα. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "You do not present a chewed cassette as a business card. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "Litsa expects a proper conversation, not another inventory check. The tape stays protected. It has already been out quite enough."]], "square/litsa/tape": [["Η κασέτα δεν είναι δώρο γνωριμίας. Έχεις δουλέψει για να παίζει. Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων.", "The cassette is not a getting-to-know-you gift. You worked to make it play. Litsa expects a proper conversation, not another inventory check."], ["Η Λίτσα περιμένει κανονική κουβέντα, όχι άλλη απογραφή αντικειμένων. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "Litsa expects a proper conversation, not another inventory check. The cassette goes back safely. You did not rescue it just to lose it now."]], "square/stand/wallet": [["Το πορτοφόλι δεν διορθώνει ό,τι γράφουν τα χαρτιά. Ο Τάκης το δοκιμάζει χρόνια. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "A wallet cannot fix what the paperwork says. Takis has tried for years. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The postcards show the work of better photographers than you. The wallet returns to your pocket. The drachmas breathe again."]], "square/stand/voucher": [["Δύο χαρτιά μαζί δεν γίνονται αυτόματα έγκυρο έγγραφο. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "Two pieces of paper do not automatically make a valid document. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The postcards show the work of better photographers than you. You fold the voucher again. The raffle had no instructions for this."]], "square/stand/frappe": [["Ο αφρός δεν είναι σφραγίδα. Και ο καφές αφήνει πιο πολλά ίχνη από εσένα. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "Foam is not an official stamp. Coffee leaves more evidence than you do. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "The postcards show the work of better photographers than you. You keep the cup upright. The foam is your only stable plan."]], "square/stand/chain": [["Δεκατέσσερα καράτια πλαστικό δεν κάνουν επίσημη σφραγίδα. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "Fourteen plastic carats do not make an official seal. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The postcards show the work of better photographers than you. The chain goes back into place. Your neck had begun to worry."]], "square/stand/hairspray": [["Το «Γίγας Κράτημα» δεν σημαίνει ότι θα μείνουν όρθια τα χαρτιά. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "“Mega Hold” does not mean paperwork will stand up by itself. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The postcards show the work of better photographers than you. The cap stays shut. One parting per customer."]], "square/stand/yogurt": [["Το γιαούρτι δεν είναι κόλλα. Και το χαρτί δεν είναι κουτάλι. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "Yogurt is not glue. Paper is not a spoon. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The postcards show the work of better photographers than you. The tub remains intact. Mum would approve of the economy."]], "square/stand/invitation": [["Αν ενώσεις αρκετά χαρτιά, θα έχεις φάκελο. Όχι σχέδιο. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "Join enough papers together and you have a folder. Not a plan. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The postcards show the work of better photographers than you. You put the invitation away. “Admits one” keeps staring back."]], "square/stand/key": [["Το δελφίνι στο μπρελόκ δεν διαβάζει ψιλά γράμματα. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "The dolphin keyring cannot read fine print. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "The postcards show the work of better photographers than you. 23 remains 23. The dolphin offers no comment."]], "square/stand/pencil": [["Δεν γράφεις «περνάω υπέροχα» σε ξένη καρτ ποστάλ. Πρώτα χρειάζεται να το πιστέψεις.", "You do not write “having a wonderful time” on somebody else’s postcard. First you need to believe it."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "The postcards show the work of better photographers than you. The pencil survives another irrelevant assignment."]], "square/stand/tape_jam": [["Η ταινία που κρέμεται δεν είναι κορδέλα συσκευασίας. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "The loose tape is not gift ribbon. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "The postcards show the work of better photographers than you. The tape stays protected. It has already been out quite enough."]], "square/stand/tape": [["Η κασέτα αποθηκεύει μουσική, όχι έντυπα δικαιολογητικά. Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα.", "The cassette stores music, not supporting paperwork. The postcards show the work of better photographers than you."], ["Οι καρτ ποστάλ δείχνουν καλύτερους φωτογράφους από εσένα. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "The postcards show the work of better photographers than you. The cassette goes back safely. You did not rescue it just to lose it now."]], "square/booth/wallet": [["Δραχμές έχεις, μπαταρίες όχι. Το πορτοφόλι δεν δίνει ρεύμα. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "You have drachmas, not batteries. The wallet supplies no electricity. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The telephone booth will not relay this idea to Mum. The wallet returns to your pocket. The drachmas breathe again."]], "square/booth/voucher": [["Δεν υπάρχει υποδοχή «κέρδισα σε λαχνό». Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "There is no “I won a raffle” slot. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The telephone booth will not relay this idea to Mum. You fold the voucher again. The raffle had no instructions for this."]], "square/booth/frappe": [["Η μαμά δεν μπορεί να πιει φραπέ από το τηλέφωνο. Κι αν μπορούσε, θα σου έλεγε ότι τον έκανες νερουλό.", "Mum cannot drink frappé over the phone. If she could, she would say you made it watery."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "The telephone booth will not relay this idea to Mum. You keep the cup upright. The foam is your only stable plan."]], "square/booth/chain": [["Δεν είναι ανταλλακτική αλυσίδα. Το «χρυσή» δεν είναι τεχνική προδιαγραφή. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "It is not a replacement chain. “Gold” is not a technical specification. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The telephone booth will not relay this idea to Mum. The chain goes back into place. Your neck had begun to worry."]], "square/booth/hairspray": [["Η λακ δεν είναι σπρέι τεχνικής συντήρησης. Το αφήνεις ήσυχο. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "Hairspray is not a maintenance spray. You leave it alone. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The telephone booth will not relay this idea to Mum. The cap stays shut. One parting per customer."]], "square/booth/yogurt": [["Το στραγγιστό δεν είναι λιπαντικό ούτε μονωτικό υλικό. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "Strained yogurt is neither lubricant nor insulation. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The telephone booth will not relay this idea to Mum. The tub remains intact. Mum would approve of the economy."]], "square/booth/invitation": [["Αυτή είναι η πρόσκληση. Τη μουσική και τις μεταφορές τις αναλαμβάνουν άλλοι. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "This is the invitation. Music and transport are somebody else’s job. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Ξαναφυλάς την πρόσκληση. Το «για έναν» συνεχίζει να σε κοιτάζει.", "The telephone booth will not relay this idea to Mum. You put the invitation away. “Admits one” keeps staring back."]], "square/booth/key": [["Το κλειδί είναι για το δωμάτιό σου, όχι εργαλείο επισκευών. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "The key is for your room, not electrical repairs. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Το 23 παραμένει 23. Το δελφίνι δεν σχολιάζει.", "The telephone booth will not relay this idea to Mum. 23 remains 23. The dolphin offers no comment."]], "square/booth/pencil": [["Το μολύβι δεν είναι κατσαβίδι. Για κασέτες, το συζητάμε. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "The pencil is not a screwdriver. Cassettes are another matter. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Το μολύβι σώζεται από άλλη μία άσχετη εργασία.", "The telephone booth will not relay this idea to Mum. The pencil survives another irrelevant assignment."]], "square/booth/tape_jam": [["Πρώτα φτιάχνεις την κασέτα. Μετά ανησυχείς για το μηχάνημα. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "First fix the cassette. Then worry about the machine. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Η ταινία μένει προστατευμένη. Έχει ήδη βγει αρκετά έξω.", "The telephone booth will not relay this idea to Mum. The tape stays protected. It has already been out quite enough."]], "square/booth/tape": [["Χρειάζεται το σωστό κασετόφωνο. Το να την κρατάς κοντά δεν αρκεί. Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά.", "It needs the right tape deck. Merely holding it nearby will not do. The telephone booth will not relay this idea to Mum."], ["Ο τηλεφωνικός θάλαμος δεν θα μεταδώσει την ιδέα σου στη μαμά. Η κασέτα επιστρέφει ασφαλής. Δεν την έσωσες για να τη χάσεις τώρα.", "The telephone booth will not relay this idea to Mum. The cassette goes back safely. You did not rescue it just to lose it now."]], "square/hotel/wallet": [["Δεν είναι όλα προς πώληση. Ειδικά με τα δικά σου οικονομικά. Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα.", "Not everything is for sale. Especially on your budget. The Paradise sign does not promise miracles."], ["Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα. Το πορτοφόλι επιστρέφει στην τσέπη. Οι δραχμές ανασαίνουν.", "The Paradise sign does not promise miracles. The wallet returns to your pocket. The drachmas breathe again."]], "square/hotel/voucher": [["Διαμονή κέρδισες, όχι γενική άδεια για πειράματα. Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα.", "You won a stay, not a general licence to experiment. The Paradise sign does not promise miracles."], ["Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα. Διπλώνεις πάλι το κουπόνι. Ο λαχνός δεν είχε οδηγίες γι’ αυτό.", "The Paradise sign does not promise miracles. You fold the voucher again. The raffle had no instructions for this."]], "square/hotel/frappe": [["Ψάχνεις θέση για το ποτήρι και τελικά προτιμάς το χέρι σου. Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα.", "You consider a spot for the cup, then decide your hand is safer. The Paradise sign does not promise miracles."], ["Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα. Κρατάς το ποτήρι όρθιο. Ο αφρός είναι το μόνο σταθερό σου σχέδιο.", "The Paradise sign does not promise miracles. You keep the cup upright. The foam is your only stable plan."]], "square/hotel/chain": [["Δεν χρειάζεται να ντύσεις όλο το νησί για βραδινή έξοδο. Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα.", "You need not dress the whole island for a night out. The Paradise sign does not promise miracles."], ["Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα. Η αλυσίδα ξαναπαίρνει τη θέση της. Ο λαιμός σου είχε ανησυχήσει.", "The Paradise sign does not promise miracles. The chain goes back into place. Your neck had begun to worry."]], "square/hotel/hairspray": [["Δεν χρειάζεται λακ για να μείνει στη θέση του. Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα.", "It needs no hairspray to stay put. The Paradise sign does not promise miracles."], ["Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα. Το καπάκι μένει κλειστό. Μία χωρίστρα ανά πελάτη.", "The Paradise sign does not promise miracles. The cap stays shut. One parting per customer."]], "square/hotel/yogurt": [["Δεν απλώνεις γιαούρτι στην περιουσία των άλλων. Ούτε για δοκιμή. Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα.", "You do not spread yogurt on other people’s property. Not even as an experiment. The Paradise sign does not promise miracles."], ["Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα. Το κεσεδάκι παραμένει άθικτο. Η μαμά θα ενέκρινε αυτή την οικονομία.", "The Paradise sign does not promise miracles. The tub remains intact. Mum would approve of the economy."]], "square/hotel/invitation": [["Η πρόσκληση ισχύει για το Ζεφύρ, όχι για όλο το Αιγαίο. Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύματα.", "The invitation is for Zefyr, not the whole Aegean. The Paradise sign does not promise miracles."], ["Η ταμπέλα «Παράδεισος» δεν υπόσχεται θαύμα
