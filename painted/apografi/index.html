<style>

  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Comfortaa','Trebuchet MS','Verdana',sans-serif;font-weight:700;color:var(--ink);}

  padding:calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*6);text-align:center;border-radius:calc(var(--u)*2);}

@keyframes dlgIn{from{opacity:0;transform:translateX(-50%) translateY(calc(var(--u)*-4)) scale(.96);}}

#ptc{width:calc(var(--u)*42);height:calc(var(--u)*42);image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--u)*1) solid var(--ink);border-radius:calc(var(--u)*1.5);box-shadow:0 0 0 calc(var(--u)*.9) var(--pink);background:#fff;}

#end h2{margin:0 0 calc(var(--u)*6);font-size:calc(var(--u)*18);color:var(--sun);-webkit-text-stroke:calc(var(--u)*.7) var(--ink);text-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--ink);}

#tsRow button[aria-pressed="true"],#lgRow button[aria-pressed="true"],#ptRow button[aria-pressed="true"],#fxRow button[aria-pressed="true"]{background:var(--sun);border-color:var(--pink);}

[hidden]{display:none!important;}

  background:linear-gradient(#4a3a6a,#2b1d3a);border-bottom:calc(var(--u)*1) solid var(--sun);box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.35);z-index:2;}

beg you: stop it again at 3:17.\"", "«Μην το αφήσεις να προχωρήσει χωρίς εκείνον. — Ευτέρπη»": "\"Don't let it go on without him. — Evterpi\"", "Ανάβω το κερί με το τελευταίο σπίρτο. Η φλόγα τρεμοπαίζει, αλλά κρατάει.": "I light the candle with the last match. The flame shivers, but it holds.", "Δένω τον μαγνήτη στην άκρη του σπάγκου. Σφιχτός κόμπος.": "I tie the magnet to the end of the string. A tight knot.", "Αυτοκίνητο": "Car", "Το Φιατάκι μου. Τα τζάμια θολώνουν από μέσα.": "My little Fiat. The windows are fogging up from the inside.", "Όχι ακόμα. Πρώτα η δουλειά.": "Not yet. Work first.", "Φανοστάτης": "Street lamp", "Η λάμπα τρεμοπαίζει. Σαν να ανασαίνει.": "The lamp flickers. As if it were breathing.", "Γραμματοκιβώτιο": "Mailbox", "Λογαριασμοί της ΔΕΗ, απλήρωτοι. Διαφημιστικά.": "Electricity bills, unpaid. Flyers.", "Και στο βάθος, μια παλιά κάρτα. Την κρατάω.": "And at the very back, an old card. I keep it.", "Μόνο λογαριασμοί. Κανείς δεν θα τους πληρώσει.": "Only bills. Nobody will ever pay them.", "Εξώπορτα": "Front door", "Κλειδωμένη.": "Locked.", "Το έγγραφο του δικαστηρίου λέει πως το κλειδί «βρίσκεται εντός του ακινήτου».": "The court order says the key \"is located on the premises\".", "Πολύ βοηθητικό.": "Very helpful.", "Το κλειδί γυρνάει με κόπο. Κάτι μέσα στην κλειδαριά τρίζει σαν κόκαλο.": "The key turns with effort. Something inside the lock creaks like bone.", "Γλάστρα": "Flowerpot", "Βασιλικός. Ξερός εδώ και χρόνια.": "Basil. Dead for years.", "Γλάστρα με γεράνι": "Geranium pot", "Ένα μαραμένο γεράνι. Του πήρα ό,τι είχε.": "A withered geranium. I took all it had.", "Ένα μαραμένο γεράνι. Το χώμα είναι σκληρό σαν πέτρα.": "A withered geranium. The soil is hard as stone.", "«Στο γεράνι.»": "\"In the geranium.\"", "Σκάβω με τα δάχτυλα. Το χώμα είναι παγωμένο.": "I dig with my fingers. The soil is ice cold.", "Ένα κλειδί. Σκουριασμένο.": "A key. Rusted.", "Άδεια γλάστρα": "Empty pot", "Άδεια. Μόνο βρόχινο νερό και ένα πεσμένο φύλλο.": "Empty. Just nd.", "Πόρτα του υπογείου": "Cellar door", "Σκαλοπάτια που χάνονται στο απόλυτο σκοτάδι.": "Steps vanishing into total darkness.", "Έχω ένα κερί. Χρειάζομαι κάτι για να το ανάψω.": "I have a candle. I need something to light it.", "Χωρίς φως δεν κατεβαίνω.": "I'm not going down without light.", "Πρέπει πρώτα να το ανάψω.": "I need to light it first.", "Ημερολόγιο τοίχου": "Wall calendar", "Ημερολόγιο τοίχου. Νοέμβριος 1967.": "A wall calendar. November 1967.", "Η 17η είναι κυκλωμένη με κόκκινο. Κανείς δεν γύρισε τη σελίδα από τότε.": "The 17th is circled in red. Nobody has turned the page since.", "Ψυγείο": "Fridge", "Το ψυγείο είναι αποσυνδεδεμένο. Δεν τολμώ να το ανοίξω.": "The fridge is unplugged. I don't dare open it.", "Στην πόρτα, ένας μαγνήτης-σουβενίρ. Τον παίρνω.": "On the door, a souvenir magnet. I take it.", "Δεν το ανοίγω. Όχι.": "I'm not opening it. No.", "Συρτάρια": "Drawers", "Κουτάλια, ένα σπασμένο ψαλίδι… και σπίρτα.": "Spoons, a broken pair of scissors… and matches.", "Τίποτε άλλο χρήσιμο.": "Nothing else useful.", "Νεροχύτης": "Sink", "Η βρύση στάζει. Ρυθμικά. Σαν να μετράει κάτι.": "The tap drips. Rhythmically. As if it were counting something.", "Τραπέζι": "Table", "Δύο φλιτζάνια, στρωμένα αντικριστά.": "Two cups, set facing each other.", "Το ένα δεν το έπιασε ποτέ κανείς. Έχει σκόνη μέσα.": "One was never touched. There's dust inside.", "Προς το χολ": "To the hallway", "Η κουζίνα. Πιο κρύα από τον δρόμο.": "The kitchen. Colder than the street.", "Ράφια": "Shelves", "Βάζα με γλυκό του κουταλιού. Δεκάδες.": "Jars of spoon sweets. Dozens of them.", "Όλα έχουν την ίδια ετικέτα, με το ίδιο χέρι: «Για τον Α., όταν γυρίσει».": "Every one has the same label, in the same hand: \"For A., when he comes back.\"", "Στέρνα": "Cistern", "Μαύρο νερό. Δεν βλέπω πια τον πάτο. Ή μήπως εκείνος δεν βλέπει εμένα;": "Black water. I can't see the bottom anymore. Or does it no longer see me?", "Μια παλιά στέρνα. Το νερό είναι ακίνητο σαν γυαλί.": "An old cistern. The water is still as glass.", "Κάτι μεταλλικό γυαλίζει στον πάτο. Πολύ βαθιά για το χέρι μου.": "Something metal glints at the bottom. Too deep for my hand.", "Κατεβάζω τον μαγνήτη αργά…": "I lower the magnet slowly…", "Κάτι τραβάει τον σπάγκο. Μια στιγμή μόνο. Πιο δυνατά απ’ όσο θα έπρεπε.": "Something pulls on the string. Just for a moment. Harder than it should.", "Ένα μικρό ορειχάλκινο κλειδί.": "A small brass key.", "Δεν φτάνει ως κάτω. Αν το συνδύαζα με κάτι…": "It won't reach the bottom. If I combined it with something…", "Μπαούλο": "Trunk", "Ανδρικά ρούχα, διπλωμένα με προσοχή. Ναφθαλίνη.": "Men's clothes, carefully folded. Mothballs.", "Από πάνω, ένα πηλήκιο σιδηροδρομικού.": "On top, a railwayman's cap.", "…Υπάρχει κανείς εδώ κάτω;": "…Is anyone down here?", "Μόνο η σταγόνα που πέφτει στη στέρνα.": "Only the drip falling into the cistern.", "Βιβλιοθήκη": "Bookcase", "Δρομολόγια του σιδηροδρόμου, δεμένα σε τόμους. Από το 1958 ως το 1967.": "Railway timetables, bound in volumes. From 1958 to 1967.", "Μετά το 1967, τίποτα.": "After 1967, nothing.", "Φωτογραφία": "Photograph", "Ένα ζευγάρι σε παραλία. Εκείνη γελάει. Εκείνος κοιτάζει το ρολόι του.": "A couple on a beach. She is laughing. He is looking at his watch.", "Από πίσω: «Ευτέρπη και Ανδρέας, Καβάλα 1966».": "On the back: \"Evterpi and Andreas, Kavala 1966\".", "Γραφείο": "Desk", "Ένα ημερολόγιο, ανοιχτό στην τελευταία σελίδα:": "A diary, open at the last page:", "«Το ρολόι σταμάτησε τη νύχτα που ο Ανδρέας πήρε το τρένο των 3:17.»": "\"The clock stopped the night Andreas took the 3:17 train.\"", "«Δεν θα το ξανακουρδίσω. Όσο ο χρόνος δεν προχωρά, δεν έχει φύγει.»": "\"I will never wind it again. As long as time stands still, he hasn't left.\"", "Στο συρτάρι, ένα κλειδί κουρδίσματος με μαύρη κορδέλα.": "In the drawer, a winding key on a black ribbon.", "Πρέπει να ελέγξω αν το ρολόι λειτουργεί. Αλλάζει την εκτίμηση.": "I have to check whether the clock works. It changes the valuation.", "«Όσο ο χρόνος δεν προχωρά, δεν έχει φύγει.»": "\"As long as time stands still, he hasn't left.\"", "Χάρτης": "Map", "Χάρτης του σιδηροδρομικού δικτύου. Μια διαδρομή είναι σημαδεμένη με κόκκινο μελάνι, ξανά και ξανά.": "A map of the railway network. One route is marked in red ink, over and over.", "Θεσσαλονίκη – Αθήνα. Μόνο το πήγαινε.": "Thessaloniki – Athens. One way only.", "Τα τζάμια τρέμουν σε κάθε βροντή. Κι εγώ λίγο.": "The panes shake with every thunderclap. So do I, a little.", "Πόρτα": "Door", "Τικ.": "Tick.", "Πού πας, Ανδρέα;": "Where are you going, Andreas?", "Το τρένο δεν περιμένει κανέναν.": "The train waits for no one.", "Μείνε. Μόνο απόψε.": "Stay. Just tonight.", "Εικονοστάσι": "Icon shelf", "Το εικονοστάσι. Το καντήλι είναι αναμμένο.": "The icon shelf. The oil lamp is lit.", "Η Ευτέρπη πέθανε πριν από τρεις εβδομάδες.": "Evterpi died three weeks ago.", "Ποιος το άναψε;": "Who lit it?", "Κρεβάτι": "Bed", "Στρωμένο για δύο. Το ένα μαξιλάρι είναι ακόμα βαθουλωμένο.": "Made up for two. One pillow still holds the shape of a head.", "Κουνιστή πολυθρόνα": "Rocking chair", "Κουνιέται. Δεν την αγγίζει κανείς.": "It's rocking. Nobody is touching it.", "Τη σταματάω με το χέρι. Είναι ζεστή.": "I stop it with my hand. It's warm.", "Κάτω από το μαξιλάρι, ένας φάκελος: «Σε όποιον έρθει να με μετρήσει».": "Under the cushion, an envelope: \"To whoever comes to count me.\"", "Ξανακουνιέται. Την αφήνω.": "It starts rocking again. I let it.", "Από εδώ φαίνεται η στάση του τρένου. Το φως της είναι ακόμα αναμμένο.": "From here you can see the railway stop. Its light is still on.", "Συρταριέρα": "Chest of drawers", "Ένα μουσικό κουτί. Παίζει έναν σκοπό που δεν ξέρω.": "A music box. It plays a tune I don't know.", "Κι όμως, τον θυμάμαι.": "And yet I remember it.", "Γραφειάκι": "Writing desk", "Εδώ θα συμπληρώσω την απογραφή. Χρειάζομαι το έντυπο.": "I'll fill in the inventory here. I need the form.", "Ένα μικρό γραφείο με λάμπα. Εδώ θα συμπληρώσω την απογραφή.": "A small desk with a lamp. I'll e clock was loaded onto a state van with two hundred and thirteen other items. It ticked the whole way.", "Τον Μάρτιο πήρα προαγωγή.": "In March I got a promotion.", "Ξυπνάω κάθε βράδυ στις 3:17 και ακούω ένα τικ-τακ στο χολ μου.": "Every night I wake at 3:17 and hear ticking in my hallway.", "Δεν έχω ρολόι στο χολ μου.": "There is no clock in my hallway.", "Δεύτερο τέλος · Τρεις και δεκαεφτά": "Second ending · Seventeen past three", "Άνοιξα το γυάλινο πορτάκι και σταμάτησα το εκκρεμές με δύο δάχτυλα. Γύρισα τους δείκτες πίσω: τρεις και δεκαεφτά.": "I opened the little glass door and stopped the pendulum with two fingers. I turned the hands back: seventeen past three.", "Η βροχή σταμάτησε. Από πάνω, η πολυθρόνα έτριξε μια τελευταία φορά, και ησύχασε.": "The rain stopped. Upstairs, the chair creaked one last time, and was still.", "Στο έντυπο έγραψα: «Εκκρεμές ρολόι, μη λειτουργικό. Άνευ αξίας.»": "On the form I wrote: \"Grandfather clock, not working. No value.\"", "Ήταν το μόνο ψέμα που έγραψα ποτέ σε απογραφή.": "It was the only lie I ever wrote on an inventory.", "Άδεια χέρια.": "Empty hands.", "Αυτά τα δύο δεν συνδυάζονται.": "These two don't go together.", "Διάλεξε ένα αντικείμενο.": "Pick an item.", "Διάλεξε ένα αντικείμενο. Πάτα δεύτερο για να τα συνδυάσεις.": "Pick an item. Tap a second one to combine them.", "Δεν βγαίνει νόημα.": "That makes no sense.", "Όχι, δεν ταιριάζει εδώ.": "No, that doesn't belong here.", "Δεν νομίζω.": "I don't think so.", "Αυτό δεν θα βοηθήσει.": "That won't help.", "Δεν υπάρχει τίποτα εδώ για να το χρησιμοποιήσω. (B για άδεια χέρια)": "There's nothing here to use it on. (B for empty hands)", "Ήχος: ": "Sound: ", "ναι": "on", "όχι": "off", "Θεσσαλονίκη, Νοέμβριος 1987.": "Thessaloniki, November 1987.", "Με λένε Λευτέρη Σταθάκη. Είμαι εκτιμητής του Πρωτοδικείου.": "My name is Lefteris Stathakis. I'm an appraiser for the Court of First Instance.", "Η δουλειά μου είναι να μετράω τι αφήνουν πίσω τους οι άνθρωποι.": "My job is to count function floorFill(g,pl,hz,vx,S1,S2,fn){

/* ---------- walk grid + A* pathfinding ---------- */
const CELL=4;
function buildGrid(s){ const gw=Math.ceil(s.w/CELL), gh=Math.ceil(H/CELL), m=new Uint8Array(gw*gh);

<script id="gfx">

   Each background is split automatically into FAR (sky and sea, found by flood-fill from the top row and from the sea band,
   so blue doors/windows/domes inside buildings are NOT taken) and NEAR (everything else). Every frame:
   far (45% parallax, palette-cycled sea, heat shimmer) → drifting clouds → boat → birds → near.
   HD post: soft bloom, horizon haze, indoor dust motes, optional CRT. A frame-time monitor lowers quality on its own. */
(()=>{
  const KEY='gfx-'+((typeof G!=='undefined'&&G.key)||document.title||'game').replace(/\s+/g,'-');
  const P=(()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
  const GX={on:P.on!==false, crt:!!P.crt, lvl:2, ft:[], st:{}};
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({on:GX.on,crt:GX.crt})); }catch(e){} };
  const L=a=>(typeof LANG!=='undefined'&&LANG==='en')?a[1]:a[0];

    const reg=new Uint8Array(w*h), dist=(i,c)=>Math.abs(d[i]-c[0])+Math.abs(d[i+1]-c[1])+Math.abs(d[i+2]-c[2]);

    return {src,out,far,fg,fid,base:new Uint8ClampedArray(fd),near:nc,bot,skyBot,seaTop,seaBot,sea,w,h,seaT:0,beach:/beach|παραλ/i.test(id),ct,
      clouds:[...Array(5)].map(()=>({x:rnd()*w,y:4+rnd()*Math.max(4,cy-8),s:.6+rnd()*.8,v:1+rnd()*2})),
      birds:[...Array(4)].map(()=>({x:rnd()*w,y:6+rnd()*Math.max(4,cy-6),v:(8+rnd()*10)*(rnd()<.5?-1:1),ph:rnd()*6})), boat:{x:rnd()*w,v:2.5}}; }

  function animSea(L2,t){ const fd=L2.fid.data, b=L2.base, s=L2.sea, n=s.length, span=L2.seaBot-L2.seaTop+1;
    for(let j=0;j<n;j+=3){ const i=s[j], x=s[j+1], y=s[j+2], dp=(y-L2.seaTop)/span, w=Math.sin(x*.11+y*.9-t*2.6)*Math.sin(x*.027+y*.2+t*1.1), k=1+w*.09*(1-dp*.5);

  const usesFlags=()=>{ if(GX._uf===undefined){ GX._uf=false; for(const k in SC) if(SC[k].outdoor!==undefined) GX._uf=true; } return GX._uf; };

   gate weave, exposure flicker, vertical scratches, dust and the odd hair caught in the gate
   ===================================================================== */

  for(let i=0;i<d.length;i+=4){ const v=(Math.random()+Math.random()+Math.random()-1.5); d[i]=d[i+1]=d[i+2]=v>0?235:0; d[i+3]=Math.min(255,Math.abs(v)*150); } g.putImageData(id,0,0); return c; });

const _postFilm=G.post;
G.post=function(s,cam,td,dt){ dt=dt||.016; if(FILM===0) return;
  _postFilm.apply(this,arguments); /* the original grain specks */
  if(FILM<2) return;
  const g=octx; g.save(); g.setTransform(OW/W,0,0,OW/W,0,0);

  if(Math.random()<dt*.5) FS.scr.push({x:20+Math.random()*280,t:0,max:.3+Math.random()*1.4,light:Math.random()<.7,w:.25+Math.random()*.35,y0:Math.random()<.5?0:Math.random()*120,y1:Math.random()<.6?180:60+Math.random()*120});

    g.fillStyle=q.light?'rgba(240,232,214,'+a+')':'rgba(0,0,0,'+a+')'; g.fillRect(q.x,q.y0,q.w,q.y1-q.y0); }

  if(!FS.hair&&Math.random()<dt*.04){ const e=Math.random()<.5; FS.hair={x:e?6+Math.random()*30:290-Math.random()*30,y:20+Math.random()*120,t:.6+Math.random()*1.2,a:Math.random()*6}; }
  if(FS.hair){ const q=FS.hair; q.t-=dt; if(q.t<=0) FS.hair=null; else { g.strokeStyle='rgba(0,0,0,.6)'; g.lineWidth=.3; g.beginPath(); g.moveTo(q.x,q.y); for(let k=1;k<6;k++) g.lineTo(q.x+Math.cos(q.a+k*.7)*k*2+(Math.random()-.5)*.2,q.y+Math.sin(q.a+k*.5)*k*2.4); g.stroke(); } }
