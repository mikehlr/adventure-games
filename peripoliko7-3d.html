<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#2b1d3a; --paper:#fffbe8; --pink:#e0338a; --sun:#ffd23f; --sea:#1f74d0; --line:rgba(43,29,58,.9); --bg:#2b1d3a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#2b1d3a; --paper:#fffbe8; --bg:#2b1d3a; } }
:root[data-theme="dark"]{ --ink:#2b1d3a; --paper:#fffbe8; --bg:#2b1d3a; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;}
body{box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Comfortaa','Trebuchet MS','Verdana',sans-serif;font-weight:700;color:var(--ink);}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;background:#000;--u:2px;--ts:1;}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px;}

#score{position:absolute;left:50%;top:calc(var(--u)*5);transform:translateX(-50%);background:var(--ink);color:var(--sun);
  padding:calc(var(--u)*1.6) calc(var(--u)*6);border-radius:99px;font-size:calc(var(--u)*5.6*var(--ts));white-space:nowrap;pointer-events:none;}
#score.bump{animation:bump .5s ease;}
@keyframes bump{30%{transform:translateX(-50%) scale(1.25);background:var(--pink);color:#fff;}}

#dlg{position:absolute;left:50%;top:calc(var(--u)*18);transform:translateX(-50%);width:min(94%,calc(68% + (var(--ts) - 1) * 46%));
  max-height:calc(100% - var(--u)*56);overflow-y:auto;background:var(--paper);border:calc(var(--u)*1.2) solid var(--ink);
  box-shadow:0 0 0 calc(var(--u)*1.2) var(--pink),calc(var(--u)*2) calc(var(--u)*3) 0 calc(var(--u)*1.2) rgba(43,29,58,.45);
  padding:calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*6);text-align:center;border-radius:calc(var(--u)*2);}
#dlg[hidden]{display:none;}
#dlg:not([hidden]){animation:dlgIn .18s ease-out;}
@keyframes dlgIn{from{opacity:0;transform:translateX(-50%) translateY(calc(var(--u)*-4)) scale(.96);}}
#dlgText{margin:0;font-size:calc(var(--u)*7*var(--ts));line-height:1.45;min-height:1.45em;text-wrap:pretty;}
#dlgOpts{display:flex;flex-direction:column;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*5);}
#dlgOpts:empty{display:none;}
#dlgOpts button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) calc(var(--u)*4);font-size:calc(var(--u)*6.4*var(--ts));}
#dlgOpts button:active{background:var(--sun);}
#dlg.pt{display:flex;align-items:center;gap:calc(var(--u)*6);text-align:left;width:min(96%,calc(82% + (var(--ts) - 1) * 36%));padding-left:calc(var(--u)*5);}
#pt{display:none;flex:none;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6);}
#dlg.pt #pt{display:flex;}
#ptc{width:calc(var(--u)*42);height:calc(var(--u)*42);image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--u)*1) solid var(--ink);border-radius:calc(var(--u)*1.5);box-shadow:0 0 0 calc(var(--u)*.9) var(--pink);background:#fff;}
#ptn{font-size:calc(var(--u)*5*var(--ts));background:var(--ink);color:var(--sun);border-radius:99px;padding:calc(var(--u)*.6) calc(var(--u)*3.4);white-space:nowrap;max-width:calc(var(--u)*56);overflow:hidden;text-overflow:ellipsis;}
#dlgBody{flex:1;min-width:0;}
#more{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1.5);font-size:calc(var(--u)*5);color:var(--pink);animation:bob 1s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(2px);}}

#whisper{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:calc(var(--u)*12*var(--ts));color:var(--sun);
  -webkit-text-stroke:calc(var(--u)*.6) var(--ink);text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--pink);opacity:0;transition:opacity .4s, transform .4s;transform:scale(.8);pointer-events:none;}
#whisper.show{opacity:1;transform:scale(1);}

#hint{position:absolute;left:50%;bottom:calc(var(--u)*6);transform:translateX(-50%);max-width:calc(44% + (var(--ts) - 1) * 10%);text-align:center;
  font-size:calc(var(--u)*6*var(--ts));background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.4) calc(var(--u)*5);
  pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hint:empty{display:none;}
#tip{position:absolute;left:50%;bottom:calc(var(--u)*20);transform:translateX(-50%);width:min(80%,calc(52% + (var(--ts) - 1) * 40%));text-align:center;
  font-size:calc(var(--u)*5.6*var(--ts));color:#fff;text-shadow:0 0 calc(var(--u)*2) var(--ink),0 0 calc(var(--u)*1) var(--ink);pointer-events:none;transition:opacity .6s;opacity:0;}
#tip.show{opacity:1;}

.ctl{position:absolute;width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;background:rgba(255,251,232,.78);
  border:calc(var(--u)*1) solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;
  box-shadow:calc(var(--u)*1) calc(var(--u)*1.5) 0 rgba(43,29,58,.5);}
.ctl svg{width:44%;height:44%;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.ctl.held{background:var(--sun);transform:translateY(1px);}
.ctl b{font-size:calc(var(--u)*12);line-height:1;}
#bL{left:calc(var(--u)*6);bottom:calc(var(--u)*6);}
#bR{left:calc(var(--u)*40);bottom:calc(var(--u)*6);}
#bA{right:calc(var(--u)*6);bottom:calc(var(--u)*6);width:calc(var(--u)*34);height:calc(var(--u)*34);background:rgba(255,210,63,.7);}
#bA.live{background:var(--sun);}
#bB{right:calc(var(--u)*44);bottom:calc(var(--u)*24);width:calc(var(--u)*26);height:calc(var(--u)*26);background:rgba(224,51,138,.75);color:#fff;}
#bB b{font-size:calc(var(--u)*10);}
#bInv{right:calc(var(--u)*6);top:calc(var(--u)*5);width:calc(var(--u)*24);height:calc(var(--u)*24);}
#bMenu{left:calc(var(--u)*6);top:calc(var(--u)*5);width:calc(var(--u)*22);height:calc(var(--u)*22);}
#sel{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*46);max-width:42%;display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:calc(var(--u)*1.6) calc(var(--u)*5) calc(var(--u)*1.6) calc(var(--u)*2);font-size:calc(var(--u)*6*var(--ts));white-space:nowrap;
  background:var(--paper);border:calc(var(--u)*.9) solid var(--pink);border-radius:calc(var(--u)*3);}
#sel[hidden]{display:none;}
#sel canvas{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none;image-rendering:pixelated;}
#sel span{overflow:hidden;text-overflow:ellipsis;}
#sel.pop{animation:pop .25s ease;}
@keyframes pop{0%{transform:scale(.8)}100%{transform:none}}

#inv{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*7) calc(var(--u)*36) calc(var(--u)*6);background:var(--paper);
  border-bottom:calc(var(--u)*1.2) solid var(--ink);box-shadow:0 calc(var(--u)*1.2) 0 var(--pink);}
#inv[hidden]{display:none;}
#slots{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center;min-height:calc(var(--u)*22);}
.slot{width:calc(var(--u)*22);height:calc(var(--u)*22);padding:calc(var(--u)*3);background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);}
.slot.on{background:var(--sun);border-color:var(--pink);}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
#invBar{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5);margin-top:calc(var(--u)*4);flex-wrap:wrap;}
#invCap{font-size:calc(var(--u)*6.2*var(--ts));min-height:1.3em;text-align:center;}
#invBar button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.5) calc(var(--u)*6);font-size:calc(var(--u)*5.8*var(--ts));}
#invBar button:disabled{opacity:.35;}

#menu{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*30);display:flex;flex-direction:column;gap:calc(var(--u)*2);}
#menu[hidden]{display:none;}
#menu button{background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) calc(var(--u)*7);font-size:calc(var(--u)*6.2*var(--ts));text-align:left;}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 calc(var(--u)*16) calc(var(--u)*12);
  background:linear-gradient(90deg,rgba(43,29,58,.72) 0%,rgba(43,29,58,.3) 55%,rgba(43,29,58,0) 80%);color:#fff;}
.screen[hidden]{display:none;}
#title h1{margin:0;font-weight:700;font-size:calc(var(--u)*20);line-height:1;color:var(--sun);
  -webkit-text-stroke:calc(var(--u)*.7) var(--ink);text-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--pink);letter-spacing:-.01em;}
#title h1 b{font-weight:700;display:inline-block;}
#title h1 .v2{display:inline-block;vertical-align:top;margin-left:calc(var(--u)*3);font-style:normal;font-size:calc(var(--u)*7);background:var(--pink);color:#fff;-webkit-text-stroke:0;text-shadow:none;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*4);transform:rotate(-8deg);}
#title h1 span{display:block;font-size:calc(var(--u)*9);color:#fff;-webkit-text-stroke:0;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink);margin-top:calc(var(--u)*3);}
#title nav{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*3);margin-top:calc(var(--u)*8);}
#title nav button{background:var(--paper);color:var(--ink);border:calc(var(--u)*.9) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2) calc(var(--u)*9);
  font-size:calc(var(--u)*7.4*var(--ts));box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--pink);}
#title nav button:active{transform:translate(1px,1px);box-shadow:none;}
#title nav button[hidden]{display:none;}
#title small{font-size:calc(var(--u)*5*var(--ts));margin-top:calc(var(--u)*6);opacity:.9;}
#end{background:linear-gradient(#ff8a3d,#e0338a 60%,#6b2a8a);justify-content:center;align-items:center;text-align:center;padding:calc(var(--u)*10) calc(16% - (var(--ts) - 1) * 16%);overflow-y:auto;}
#end h2{margin:0 0 calc(var(--u)*6);font-size:calc(var(--u)*18);color:var(--sun);-webkit-text-stroke:calc(var(--u)*.7) var(--ink);text-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--ink);}
#end p{font-size:calc(var(--u)*7*var(--ts));line-height:1.5;margin:0 0 calc(var(--u)*3.5);opacity:0;animation:rise 1.4s ease forwards;text-shadow:0 calc(var(--u)*.6) 0 rgba(43,29,58,.6);}
#end button{margin-top:calc(var(--u)*5);background:var(--paper);color:var(--ink);border:calc(var(--u)*.9) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2) calc(var(--u)*9);
  font-size:calc(var(--u)*6.6*var(--ts));opacity:0;animation:rise 1.4s ease forwards;}
@keyframes rise{to{opacity:1;}}

#settings{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:0 12%;gap:calc(var(--u)*4);z-index:5;}
#settings[hidden]{display:none;}
#settings h3{margin:0;font-size:calc(var(--u)*13);color:var(--pink);}
#settings .lab{margin:0;font-size:calc(var(--u)*6);opacity:.75;}
#tsRow,#lgRow,#ptRow,#fxRow{display:flex;gap:calc(var(--u)*3);}
#tsRow button,#lgRow button,#ptRow button,#fxRow button{flex:1;background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) 0;line-height:1;}
#tsRow button[aria-pressed="true"],#lgRow button[aria-pressed="true"],#ptRow button[aria-pressed="true"],#fxRow button[aria-pressed="true"]{background:var(--sun);border-color:var(--pink);}
#tsPrev{margin:0;font-size:calc(var(--u)*7*var(--ts));line-height:1.4;min-height:2.8em;}
#settings .row{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;}
#settings .row button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2.5) calc(var(--u)*8);font-size:calc(var(--u)*6.4);}

#rotate{position:fixed;inset:0;background:var(--bg);color:var(--sun);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  font-size:20px;text-align:center;padding:0 12%;z-index:9;}
#rotate i{display:block;width:34px;height:58px;border:3px solid var(--sun);border-radius:7px;animation:turn 2.4s ease-in-out infinite;}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){#more,#rotate i{animation:none;}}

[hidden]{display:none!important;}
</style>
<style>
#vbar{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*24);display:flex;align-items:center;gap:calc(var(--u)*2.5);padding:0 calc(var(--u)*4);
  background:linear-gradient(#4a3a6a,#2b1d3a);border-bottom:calc(var(--u)*1) solid var(--sun);box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.35);z-index:2;}
#vbar[hidden]{display:none;}
.vb{width:calc(var(--u)*24);height:calc(var(--u)*20);flex:none;background:#5a4a7a;border:calc(var(--u)*.8) solid #140a24;border-radius:calc(var(--u)*2);
  box-shadow:inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.18),inset 0 calc(var(--u)*-1) 0 rgba(0,0,0,.3);padding:calc(var(--u)*1.6) calc(var(--u)*3);display:flex;align-items:center;justify-content:center;}
.vb canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
.vb.on{background:var(--sun);box-shadow:inset 0 calc(var(--u)*-1) 0 rgba(0,0,0,.25),0 0 0 calc(var(--u)*.8) #fff;}
.vb:disabled{opacity:.35;}
.vb:active{transform:translateY(1px);}
#vbar .sep{width:calc(var(--u)*.8);height:calc(var(--u)*16);background:rgba(255,255,255,.18);flex:none;}
#score{flex:1;text-align:center;color:var(--sun);font-size:calc(var(--u)*6.2*var(--ts));white-space:nowrap;position:static;transform:none;background:none;padding:0;}
#score.bump{animation:sbump .6s ease;}
@keyframes sbump{30%{color:#fff;transform:scale(1.2);}}
#hover{position:absolute;transform:translate(-50%,calc(var(--u)*10));background:rgba(43,29,58,.88);color:var(--sun);font-size:calc(var(--u)*5.4*var(--ts));padding:calc(var(--u)*1) calc(var(--u)*4);border-radius:99px;pointer-events:none;white-space:nowrap;z-index:1;}
#hover[hidden]{display:none;}
#hint{position:absolute;left:50%;top:calc(var(--u)*28);bottom:auto;transform:translateX(-50%);background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.2) calc(var(--u)*5);
  font-size:calc(var(--u)*5.6*var(--ts));opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:none;}
#hint.show{opacity:1;}
#cv{cursor:none;}
@media (hover:none){#cv{cursor:auto;}}
#dlg{top:calc(var(--u)*34);}
#inv{top:calc(var(--u)*24);}
#menu{top:calc(var(--u)*28);left:auto;right:calc(var(--u)*4);}
#tip{bottom:calc(var(--u)*8);}
#title h1 .v2{display:inline-block;vertical-align:top;margin-left:calc(var(--u)*3);font-style:normal;font-size:calc(var(--u)*6);background:var(--pink);color:#fff;-webkit-text-stroke:0;text-shadow:none;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*4);transform:rotate(-8deg);}
#title h1 b{display:inline-block;}
</style>
<style>
#dlg.pt{}
#fxRow{display:flex;gap:calc(var(--u)*3);}
#fxRow button{flex:1;background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) 0;line-height:1;}
#fxRow button[aria-pressed="true"]{background:var(--sun);border-color:var(--pink);}

:root{--ink:#000000;--paper:#ffffff;--pink:#0000aa;--sun:#ffff55;}
body{font-family:'Fira Mono','Courier New',monospace;font-weight:500;}
#vbar{background:#0000aa;border-bottom:calc(var(--u)*.8) solid #ffff55;}
.vb{background:#aaaaaa;border-color:#000;border-radius:0;box-shadow:inset calc(var(--u)*-1) calc(var(--u)*-1) 0 rgba(0,0,0,.35);}
.vb.on{background:#ffff55;}
#score{color:#ffffff;}
#dlg{background:#fff;border:calc(var(--u)*1) solid #0000aa;box-shadow:inset 0 0 0 calc(var(--u)*1) #fff,inset 0 0 0 calc(var(--u)*1.8) #0000aa;border-radius:0;text-align:left;}
#dlgText{font-size:calc(var(--u)*6.4*var(--ts));}
#dlgOpts button{background:#aaaaaa;border:calc(var(--u)*.6) solid #000;border-radius:0;box-shadow:none;text-align:left;font-size:calc(var(--u)*6*var(--ts));}
#hint,#hover{background:#000;color:#fff;border:0;border-radius:0;}
#tip{background:rgba(0,0,170,.85);color:#fff;text-shadow:none;}

#invBar button,#menu button{border-radius:0;}
#settings{background:#aaaaaa;} #settings h3{color:#0000aa;}
#tsRow button,#lgRow button,#fxRow button,#settings .row button{border-radius:0;}
.screen{background:linear-gradient(90deg,rgba(0,0,170,.88) 0%,rgba(0,0,170,.45) 55%,rgba(0,0,170,0) 82%);color:#fff;}
#title h1{color:#ffff55;-webkit-text-stroke:0;text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #000;font-size:calc(var(--u)*20);}
#title h1 span{color:#55ffff;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #000;font-size:calc(var(--u)*7);}
#title h1 .v2{background:#aa0000;border-color:#000;border-radius:0;transform:none;}
#title nav button{background:#aaaaaa;color:#000;border:calc(var(--u)*.8) solid #000;border-radius:0;box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #000;}
#end{background:#0000aa;color:#fff;} #end.over{background:#aa0000;}
#end h2{color:#ffff55;-webkit-text-stroke:0;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #000;}
#end button{background:#aaaaaa;color:#000;border:calc(var(--u)*.8) solid #000;border-radius:0;box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #000;margin:calc(var(--u)*2);}
#end button[hidden]{display:none;}

</style>



<style id="gfxcss">
/* settings panel: scrollable on small screens (content centred only when it fits) */
#settings{overflow-y:auto!important;justify-content:flex-start!important;padding-top:calc(var(--u)*8)!important;padding-bottom:calc(var(--u)*10)!important;touch-action:pan-y!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
#settings>*{flex-shrink:0;} #settings>:first-child{margin-top:auto!important;} #settings>:last-child{margin-bottom:auto!important;}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="hover" hidden></div>
  <div id="whisper"></div>
  <div id="hint"></div>
  <div id="tip"></div>

let LANG='el';

const EN={"Σημειωματάριο": "Notebook", "Το σημειωματάριο υπηρεσίας. Κανονισμός: ό,τι δεν γράφεται, δεν έγινε.": "Your duty notebook. Regulation: if it isn't written down, it didn't happen.", "«Κλεμμένο κόκκινο κουπέ, ΑΚΤ-4471. Ύποπτος: Στέλιος Μπέκας. Δερμάτινο μπουφάν.»": "\"Stolen red coupé, AKT-4471. Suspect: Stelios Bekas. Leather jacket.\"", "«Οδός Λιμανιού: ΑΚΤ-4471 εντοπίστηκε.»": "\"Port Street: AKT-4471 located.\"", "Υπηρεσιακό όπλο": "Service pistol", "Στη θήκη του. Εκεί μένει, εκτός αν υπάρχει πραγματικός κίνδυνος.": "In its holster. That's where it stays, unless there is real danger.", "Κανονισμός: ποτέ οπλισμένος μέσα στα κρατητήρια.": "Regulation: never armed inside the holding area.", "Ασύρματος": "Radio", "Φορητός ασύρματος, κανάλι του Κέντρου. Διάλεξέ τον με το B και πάτα A για να καλέσεις.": "Handheld radio, Dispatch channel. Select it with B and press A to call.", "Χειροπέδες": "Handcuffs", "Ατσάλινες. Κλειδί στη ζώνη.": "Steel. Key on your belt.", "Φακός": "Flashlight", "Βαρύς φακός μαγκλίτσα. Δυνατό φως.": "A heavy-duty flashlight. Strong beam.", "Κλειδιά περιπολικού": "Patrol car keys", "Περιπολικό 7. Ένα μπρελόκ με τον Άγιο Χριστόφορο.": "Patrol Car 7. A Saint Christopher keyring.", "Σακούλα με ρολόγια": "Bag of watches", "Πειστήριο. Δώδεκα καινούργια ρολόγια, με τις ετικέτες ακόμα πάνω.": "Evidence. Twelve brand-new watches, price tags still on.", "Πόντοι:": "Points:", "από": "of", "Προς την αίθουσα ενημέρωσης": "To the briefing room", "Δεν βγαίνεις στη βάρδια χωρίς εξοπλισμό. Το ντουλάπι σου είναι το νούμερο 7.": "You don't start a shift without your gear. Your locker is number 7.", "Ανακοίνωση": "Notice", "«ΥΠΕΝΘΥΜΙΣΗ: Επιθεώρηση οχήματος πριν από κάθε βάρδια. Όπλα στη θυρίδα πριν από τα κρατητήρια. Καμία εξαίρεση.»": "\"REMINDER: Vehicle inspection before every shift. Firearms in the lockbox before entering holding. No exceptions.\"", "Από κάτω, με μολύβι: «Και πλένετε τις κούπες σας.»": "Underneath, in pencil: \"And wash your mugs.\"", "Πάγκος": "Bench", "Ο πάγκος των αποδυτηρίων. Εδώ έχουν ειπωθεί περισσότερα ψέματα για ψάρεμα απ’ ό,τι σε όλο το λιμάνι.": "The locker-room bench. More fishing lies have been told here than in the whole harbour.", "Ντουλάπι 7": "Locker 7", "Άδειο. Μόνο μια φωτογραφία της ομάδας μπάσκετ του τμήματος, του 1984. Χάσαμε.": "Empty. Just a photo of the precinct basketball team, 1984. We lost.", "Ανοίγεις το ντουλάπι 7.": "You open locker 7.", "Περνάς τη ζώνη: όπλο στη θήκη, χειροπέδες, ασύρματος, φακός.": "You buckle on your duty belt: pistol holstered, handcuffs, radio, flashlight.", "Αστυφύλακας Άρης Μαυρίδης. Έτοιμος για την πρώτη σου βάρδια.": "Officer Aris Mavridis. Ready for your first shift.", "Βρύση": "Tap", "Πίνεις λίγο νερό. Έχει γεύση από χλώριο και από είκοσι χρόνια υπηρεσίας.": "You drink some water. It tastes of chlorine and twenty years of service.", "Ρολόι": "Clock", "Έξι και μισή το πρωί. Η βάρδια ξεκινάει στις επτά.": "Six thirty in the morning. Shift starts at seven.", "Προς τα αποδυτήρια": "To the locker room", "Κρατητήρια": "Holding cells", "Τα κρατητήρια. Δεν έχεις κάποιον να φέρεις εκεί. Ακόμα.": "The holding cells. You have nobody to bring there. Yet.", "Αρχιφύλακας Κανελλόπουλος": "Sergeant Kanellopoulos", "Αρχιφύλακας: «Καλημέρα, Μαυρίδη. Πρώτη μέρα. Μη μου τα κάνεις θάλασσα.»": "Sergeant: \"Morning, Mavridis. First day. Don't make a mess of it.\"", "Αρχιφύλακας: «Κλεμμένο χθες βράδυ: κόκκινο κουπέ, πινακίδα ΑΚΤ-4471.»": "Sergeant: \"Stolen last night: red coupé, plate AKT-4471.\"", "Αρχιφύλακας: «Ύποπτος ο Στέλιος Μπέκας, “ο Γάτος”. Δερμάτινο μπουφάν, μαύρα γυαλιά, κανένα χιούμορ.»": "Sergeant: \"Suspect is Stelios Bekas, 'the Cat'. Leather jacket, dark glasses, no sense of humour.\"", "Αρχιφύλακας: «Επιθεώρηση στο όχημα πριν φύγεις. Και στα κρατητήρια, το όπλο στη θυρίδα. Πάντα.»": "Sergeant: \"Inspect your vehicle before you leave. And in holding, your weapon goes in the lockbox. Always.\"", "Αρχιφύλακας: «Κλειδιά στον πίνακα. Περιπολικό 7. Άντε.»": "Sergeant: \"Keys are on the board. Patrol Car 7. Go.\"", "Αρχιφύλακας: «ΑΚΤ-4471. Μπέκας. Κανονισμός. Μη με κάνεις να επαναλαμβάνομαι.»": "Sergeant: \"AKT-4471. Bekas. Regulations. Don't make me repeat myself.\"", "Πίνακας": "Chalkboard", "Ένας χάρτης της Ακτής με κιμωλία. Ένας κύκλος στην οδό Λιμανιού.": "A chalk map of Akti. A circle around Port Street.", "Πίνακας κλειδιών": "Key board", "Τα κλειδιά του Περιπολικού 7 είναι ήδη στην τσέπη σου.": "The keys to Patrol Car 7 are already in your pocket.", "Αρχιφύλακας: «Μαυρίδη! Πρώτα ενημέρωση, μετά κλειδιά. Έτσι γίνεται εδώ μέσα.»": "Sergeant: \"Mavridis! Briefing first, then keys. That's how it works in here.\"", "Παίρνεις τα κλειδιά του Περιπολικού 7.": "You take the keys to Patrol Car 7.", "Μηχάνημα καφέ": "Coffee machine", "Ο καφές μηχανής του τμήματος.": "The precinct coffee machine.", "Έχει λύσει περισσότερες υποθέσεις από όλους σας. Και έχει προκαλέσει άλλες τόσες γαστρίτιδες.": "It has solved more cases than all of you. And caused just as many ulcers.", "Προς το πάρκινγκ": "To the garage", "Χωρίς κλειδιά, στο πάρκινγκ θα πας μόνο για να κοιτάξεις.": "Without keys, you'd only go to the garage to look.", "Πίσω λάστιχο": "Rear tyre", "Φουσκωμένο και καινούργιο.": "Inflated and brand new.", "Κάνεις τον γύρο του περιπολικού, όπως λέει ο κανονισμός.": "You walk around the patrol car, as regulations require.", "Φώτα εντάξει. Φάρος εντάξει.": "Lights OK. Light bar OK.", "Το πίσω αριστερό λάστιχο όμως είναι μισοξεφούσκωτο. Μέσα του, ένα καρφί.": "But the rear left tyre is half flat. There's a nail in it.", "Μισοξεφούσκωτο. Με αυτό δεν πας πουθενά. Μίλα στον μηχανικό.": "Half flat. You're going nowhere on that. Talk to the mechanic.", "Περιπολικό 7": "Patrol Car 7", "Ελέγχεις τα φώτα με τον φακό. Δουλεύουν όλα.": "You check the lights with the flashlight. All working.", "Μήτσος, ο μηχανικός": "Mitsos, the mechanic", "Μήτσος: «Τα περιπολικά τα προσέχω σαν παιδιά μου. Τα παιδιά μου όχι τόσο.»": "Mitsos: \"I look after these cars like my own kids. My kids, not so much.\"", "Λες στον Μήτσο για το λάστιχο.": "You tell Mitsos about the tyre.", "Μήτσος: «Καρφί; Καλά που το είδες. Θα σου έσκαγε στην πρώτη στροφή.»": "Mitsos: \"A nail? Good thing you spotted it. It would've blown on the first bend.\"", "Πέντε λεπτά και πολλές βρισιές αργότερα, το λάστιχο είναι καινούργιο.": "Five minutes and a lot of swearing later, the tyre is new.", "Μήτσος: «Το Επτά είναι έτοιμο. Νομίζω. Το έλεγξες;»": "Mitsos: \"Seven's ready. I think. Did you check it?\"", "Πάγκος εργαλείων": "Workbench", "Κλειδιά, κατσαβίδια και ένα ημερολόγιο του 1986 που κανείς δεν τόλμησε να κατεβάσει.": "Spanners, screwdrivers and a 1986 calendar nobody has dared to take down.", "Κλειδωμένο. Τα κλειδιά είναι στον πίνακα της αίθουσας ενημέρωσης.": "Locked. The keys are on the board in the briefing room.", "Με ξεφούσκωτο λάστιχο δεν φεύγεις. Μίλα στον Μήτσο.": "You're not leaving on a flat tyre. Talk to Mitsos.", "Η βάρδια τελείωσε. Ώρα για αναφορά, όχι για βόλτες.": "The shift is over. Time for paperwork, not joyrides.", "Περιπολικό 7: πού πας;": "Patrol Car 7: where to?", "Περιπολία στην πόλη": "Patrol the city", "Βάζεις μπρος. Βγαίνεις από το πάρκινγκ. Η πόλη ξυπνάει.": "You start the engine. You pull out of the garage. The city is waking up.", "Ασύρματος: «Περιπολικό 7, από Κέντρο.»": "Radio: \"Patrol Car 7, this is Dispatch.\"", "Ασύρματος: «Κόκκινο κουπέ, πιθανώς το ΑΚΤ-4471, εντοπίστηκε στην οδό Λιμανιού, έξω από το καφέ “Γλάρος”. Ελέγξτε.»": "Radio: \"Red coupé, possibly AKT-4471, spotted on Port Street outside the 'Seagull' café. Check it out.\"", "Εσύ: «Ελήφθη, Κέντρο. Κατευθύνομαι.»": "You: \"Copy, Dispatch. On my way.\"", "Μένω ακόμα εδώ": "Stay here a little longer", "Δεν τελείωσες εδώ. Μια κλεμμένη πινακίδα δεν βρίσκεται μόνη της.": "You're not done here. A stolen plate doesn't find itself.", "Πριν τον βάλεις στο περιπολικό:": "Before putting him in the car:", "Τον ενημερώνω για τον λόγο της σύλληψης και τα δικαιώματά του.": "I inform him of the reason for arrest and his rights.", "Τον βάζω κατευθείαν μέσα. Βιάζομαι.": "I put him straight in. I'm in a hurry.", "Κάτι σε σταματάει. Η φωνή του εκπαιδευτή σου από τη Σχολή: «Ενημέρωση δικαιωμάτων, Μαυρίδη. Πάντα.»": "Something stops you. Your instructor's voice from the Academy: \"Rights, Mavridis. Always.\"", "Βάζεις τον Μπέκα στο πίσω κάθισμα, με το χέρι πάνω από το κεφάλι του για να μη χτυπήσει.": "You put Bekas in the back seat, hand over his head so he doesn't bump it.", "Ασύρματος: «Περιπολικό 7, Κέντρο. Ένας συλληφθείς. Επιστρέφω στο τμήμα.»": "Radio: \"Patrol Car 7 to Dispatch. One in custody. Returning to the station.\"", "Κόκκινο κουπέ": "Red coupé", "Ένα κόκκινο κουπέ, παρκαρισμένο πάνω στη διάβαση. Θράσος.": "A red coupé, parked on the pedestrian crossing. The nerve.", "Πινακίδα ΑΚΤ-4471.": "Plate AKT-4471.", "Πρώτα σημειώνεις. Μετά συμπεραίνεις.": "Note it down first. Draw conclusions later.", "Τη σημείωσες ήδη.": "You've already noted it.", "Σημειώνεις την πινακίδα: ΑΚΤ-4471.": "You note down the plate: AKT-4471.", "Ταιριάζει με την ενημέρωση του αρχιφύλακα. Επόμενο βήμα κατά τον κανονισμό: ενημέρωση του Κέντρου.": "It matches the sergeant's briefing. Next step by the book: inform Dispatch.", "Δεν υπάρχει τίποτε άλλο μέσα.": "There's nothing else inside.", "Φωτίζεις μέσα από το τζάμι. Κάτω από το κάθισμα, μια σακούλα.": "You shine the light through the window. Under the seat, a bag.", "Η πόρτα είναι ξεκλείδωτη. Δώδεκα ρολόγια, με τις ετικέτες ακόμα πάνω. Πειστήριο.": "The door is unlocked. Twelve watches, price tags still on. Evidence.", "Άντρας με δερμάτινο": "Man in leather jacket", "Φοράει ήδη χειροπέδες.": "He's already cuffed.", "Χωρίς έλεγχο στοιχείων και λόγο σύλληψης; Δεν είσαι σε ταινία.": "Without an ID check and a reason for arrest? This isn't a movie.", "Μπέκας: «Εντάξει, εντάξει. Χωρίς φασαρίες.»": "Bekas: \"Alright, alright. No fuss.\"", "Του περνάς χειροπέδες. Τον ελέγχεις για όπλα. Τίποτα, εκτός από ένα πακέτο τσίχλες.": "You cuff him. You pat him down for weapons. Nothing but a packet of chewing gum.", "Σημειώνεις την περιγραφή του. Δερμάτινο, γυαλιά, κανένα χιούμορ. Ταιριάζει.": "You note down his description. Leather, glasses, no sense of humour. It matches.", "Τραπεζάκι": "Café table", "Ένα άδειο τραπεζάκι. Και ένα φλιτζάνι καφέ με αποτύπωμα κραγιόν.": "An empty table. And a coffee cup with a lipstick mark.", "Περιστέρια": "Pigeons", "Τα περιστέρια της οδού Λιμανιού. Έχουν δει τα πάντα. Δεν μιλάνε σε μπάτσους.": "The pigeons of Port Street. They've seen everything. They don't talk to cops.", "Περίπτερο": "Kiosk", "Κυρία Ρούλα, περιπτερού: «Αστυφύλακα! Ο τύπος με το δερμάτινο βγήκε από το κόκκινο αμάξι πριν από δέκα λεπτά.»": "Mrs Roula, kiosk owner: \"Officer! The guy in the leather jacket got out of the red car ten minutes ago.\"", "Κυρία Ρούλα: «Κάθεται στον “Γλάρο” και πίνει φρέντο σαν να μην τρέχει τίποτα. Σιγά μην είναι δικό του το αμάξι.»": "Mrs Roula: \"He's sitting at the 'Seagull' drinking a freddo like nothing's wrong. As if that car were his.\"", "Σημειώνεις: μάρτυρας, κυρία Ρούλα, περίπτερο οδού Λιμανιού.": "You note: witness, Mrs Roula, Port Street kiosk.", "Κυρία Ρούλα: «Άντε, πιάσ’ τον, να ησυχάσει η γειτονιά!»": "Mrs Roula: \"Go on, catch him, so the neighbourhood can get some peace!\"", "Οδός Λιμανιού. Το κόκκινο κουπέ είναι εκεί, πάνω στη διάβαση.": "Port Street. The red coupé is there, parked on the crossing.", "Έξω από το καφέ «Γλάρος» κάθεται ένας άντρας με δερμάτινο μπουφάν.": "Outside the 'Seagull' café sits a man in a leather jacket.", "Τον ενημερώνεις για τον λόγο της σύλληψης και για τα δικαιώματά του: δικηγόρο, διερμηνέα, ενημέρωση συγγενή.": "You inform him of the reason for his arrest and of his rights: a lawyer, an interpreter, notifying a relative.", "Μπέκας: «Ναι, ναι. Τα ξέρω απ’ έξω. Καλύτερα από σένα.»": "Bekas: \"Yeah, yeah. I know them by heart. Better than you.\"", "Μπέκας: «Ο φρέντο μου έμεινε μισός. Αυτό να το γράψεις στην αναφορά.»": "Bekas: \"My freddo's still half full. Put that in your report.\"", "Ο Μπέκας σε κοιτάζει πάνω από τα γυαλιά του. Περιμένει να δει τι θα κάνεις. Ο κανονισμός λέει: χειροπέδες.": "Bekas looks at you over his glasses. Waiting to see what you'll do. Regulations say: handcuffs.", "Ο άντρας με το δερμάτινο σε κοιτάζει πάνω από το φλιτζάνι του.": "The man in the leather jacket looks at you over his cup.", "Πριν πλησιάσεις ύποπτο, ενημερώνεις το Κέντρο. Το λέει ο κανονισμός, και ο αρχιφύλακας θα στο θυμίζει ως τη σύνταξη.": "Before approaching a suspect, you inform Dispatch. It's in the regulations, and the sergeant will remind you until you retire.", "Πώς τον προσεγγίζεις;": "How do you approach him?", "«Καλημέρα. Έλεγχος στοιχείων, παρακαλώ.»": "\"Good morning. ID check, please.\"", "Σου δίνει την ταυτότητά του, αργά. «Στυλιανός Μπέκας».": "He hands you his ID card, slowly. \"Stylianos Bekas\".", "Πάνω στο τραπέζι, ένα κλειδί αυτοκινήτου με κόκκινο μπρελόκ.": "On the table, a car key on a red keyring.", "Εσύ: «Κύριε Μπέκα, είστε υπό σύλληψη για κλοπή οχήματος.»": "You: \"Mr Bekas, you are under arrest for vehicle theft.\"", "Μπέκας: «Πρωί πρωί; Ούτε τον φρέντο μου δεν τελείωσα.»": "Bekas: \"This early? I haven't even finished my freddo.\"", "«Ψηλά τα χέρια, κάθαρμα!»": "\"Hands up, scumbag!\"", "Τον κοιτάζεις επίμονα, σαν στις ταινίες.": "Stare at him intensely, like in the movies.", "Τον κοιτάζεις επίμονα.": "You stare at him intensely.", "Σε κοιτάζει κι αυτός επίμονα. Τελικά κάνει ένα μπαλόνι με την τσίχλα του.": "He stares back intensely. Eventually he blows a bubble with his gum.", "Αυτό δεν οδηγεί πουθενά.": "This is going nowhere.", "Έξοδος": "Exit", "Έχεις έναν συλληφθέντα δεμένο πάνω σου. Πρώτα τον παραδίδεις.": "You have a prisoner handcuffed to you. Hand him over first.", "Πρώτα η αναφορά. Μετά σπίτι.": "Report first. Then home.", "«ΑΠΑΓΟΡΕΥΕΤΑΙ Η ΕΙΣΟΔΟΣ ΜΕ ΟΠΛΟ ΠΕΡΑ ΑΠΟ ΤΗΝ ΚΙΤΡΙΝΗ ΓΡΑΜΜΗ.»": "\"NO FIREARMS BEYOND THE YELLOW LINE.\"", "Θυρίδα όπλων": "Weapons lockbox", "Το όπλο σου είναι κλειδωμένο στη θυρίδα. Το κλειδί στην τσέπη σου.": "Your pistol is locked in the lockbox. The key is in your pocket.", "Θυρίδες για τα όπλα. Κανονισμός: κανείς οπλισμένος πέρα από την κίτρινη γραμμή.": "Lockboxes for weapons. Regulation: nobody goes armed past the yellow line.", "Βγάζεις το όπλο από τη θήκη, το βάζεις στη θυρίδα και κλειδώνεις.": "You take the pistol out of its holster, put it in the lockbox and lock it.", "Κανονισμός. Ο αρχιφύλακας θα ήταν περήφανος. Δεν θα στο έλεγε ποτέ, αλλά θα ήταν.": "Regulations. The sergeant would be proud. He'd never say so, but he would.", "Αστυφύλακας Γιαννάκης": "Officer Giannakis", "Γιαννάκης: «Καλή δουλειά, συνάδελφε. Για πρώτη μέρα, όχι κι άσχημα.»": "Giannakis: \"Good work, colleague. Not bad for a first day.\"", "Παραδίδεις τον Μπέκα στον Γιαννάκη. Αφαιρείτε τις χειροπέδες και καταγράφετε τα προσωπικά του αντικείμενα.": "You hand Bekas over to Giannakis. You remove the cuffs and log his personal belongings.", "Ένα πακέτο τσίχλες. Ένα χτένι. Τρία ανέκδοτα που κανείς δεν ζήτησε.": "A packet of gum. A comb. Three jokes nobody asked for.", "Γιαννάκης: «Μέσα, Μπέκα. Και τώρα, συνάδελφε… η αναφορά.»": "Giannakis: \"In you go, Bekas. And now, colleague… the report.\"", "Γιαννάκης: «Η αναφορά, συνάδελφε. Στο σημειωματάριο, και μετά στη γραφομηχανή.»": "Giannakis: \"The report, colleague. In your notebook, then on the typewriter.\"", "Γιαννάκης: «Ησυχία σήμερα. Ελπίζω να μείνει έτσι.»": "Giannakis: \"Quiet today. I hope it stays that way.\"", "Γράφεις την αναφορά: ώρα, τόπος, πινακίδα, μάρτυρας, πειστήρια, σύλληψη, ενημέρωση δικαιωμάτων.": "You write the report: time, place, plate, witness, evidence, arrest, rights given.", "Γιαννάκης: «Καθαρή δουλειά. Πάρ’ τη στον αρχιφύλακα.»": "Giannakis: \"Clean work. Take it to the sergeant.\"", "Παραδίδεις τη σακούλα με τα ρολόγια ως πειστήριο. Ο Γιαννάκης την καταγράφει.": "You hand over the bag of watches as evidence. Giannakis logs it.", "Κελί": "Cell", "Ο Μπέκας κάθεται στον πάγκο και σφυρίζει. Φάλτσα.": "Bekas sits on the bench, whistling. Off-key.", "Ένα άδειο κελί. Μυρίζει χλωρίνη και κακές αποφάσεις.": "An empty cell. It smells of bleach and bad decisions.", "Δύο χιλιόμετρα μετά, στη Λεωφόρο Παραλίας, το πίσω λάστιχο σκάει.": "Two kilometres later, on Seafront Avenue, the rear tyre blows.", "Το Περιπολικό 7 καταλήγει, αργά και με αξιοπρέπεια, πάνω σε μια καντίνα με κουλούρια.": "Patrol Car 7 ends up, slowly and with dignity, in a pretzel cart.", "Κανονισμός: επιθεώρηση οχήματος πριν από κάθε βάρδια. Πάντα.": "Regulation: vehicle inspection before every shift. Always.", "Ο Μπέκας αναποδογυρίζει το τραπέζι και χάνεται στα στενά του λιμανιού.": "Bekas flips the table over and disappears into the harbour alleys.", "Η ψυχραιμία είναι το πρώτο εργαλείο του αστυνομικού. Ο αρχιφύλακας σε περιμένει με μια πολύ μεγάλη αναφορά.": "Composure is a police officer's first tool. The sergeant is waiting for you with a very long report.", "Τράβηξες το υπηρεσιακό όπλο χωρίς πραγματικό κίνδυνο.": "You drew your service pistol with no real danger present.", "Οι Εσωτερικές Υποθέσεις δεν έχουν χιούμορ. Ούτε ο αρχιφύλακας.": "Internal Affairs has no sense of humour. Neither does the sergeant.", "Κανονισμός: το όπλο είναι η τελευταία λύση, όχι η πρώτη.": "Regulation: the weapon is the last resort, not the first.", "Πέρασες την κίτρινη γραμμή με το όπλο στη θήκη.": "You crossed the yellow line with your pistol still holstered.", "Ο Μπέκας, παρά τις χειροπέδες, το άρπαξε σε μια στιγμή απροσεξίας. Ευτυχώς ο Γιαννάκης τον ακινητοποίησε πριν γίνει το κακό.": "Despite the handcuffs, Bekas grabbed it in a moment of carelessness. Luckily Giannakis pinned him down before anything worse happened.", "Κανονισμός: ποτέ οπλισμένος στα κρατητήρια. Ποτέ.": "Regulation: never armed in the holding area. Never.", "Τέλος καριέρας": "Career over", "Τέλος βάρδιας": "End of shift", "Βαθμολογία: υποδειγματικός αστυφύλακας.": "Rating: exemplary officer.", "Βαθμολογία: πολύ καλός αστυφύλακας.": "Rating: very good officer.", "Βαθμολογία: θα τα ξαναπούμε στην εκπαίδευση.": "Rating: see you back at the Academy.", "Αρχιφύλακας: «Μαυρίδη. Διάβασα την αναφορά.»": "Sergeant: \"Mavridis. I read your report.\"", "Αρχιφύλακας: «Κλεμμένο όχημα, μάρτυρας, πειστήρια, σύλληψη χωρίς φασαρία. Και όλα με τον κανονισμό.»": "Sergeant: \"Stolen vehicle, witness, evidence, an arrest with no fuss. And all by the book.\"", "Αρχιφύλακας: «…Μη συνηθίσεις. Αύριο στις επτά.»": "Sergeant: \"…Don't get used to it. Tomorrow at seven.\"", "Ασύρματος: «Περιπολικό 7, χωρίς λόγο δεν πιάνουμε τη συχνότητα. Τέλος.»": "Radio: \"Patrol Car 7, keep the channel clear unless you need it. Out.\"", "Ασύρματος: «Σε ακούμε, Επτά. Δεύτερο περιπολικό σε λίγα λεπτά. Συνέχισε με προσοχή.»": "Radio: \"We hear you, Seven. Second unit is a few minutes out. Proceed with caution.\"", "Εσύ: «Κέντρο, από Περιπολικό 7.»": "You: \"Dispatch, this is Patrol Car 7.\"", "Ασύρματος: «Λέγε, Επτά. Τι έχεις;»": "Radio: \"Go ahead, Seven. What have you got?\"", "Δεν έχεις τίποτα συγκεκριμένο ακόμα. Πρώτα επιβεβαίωσε την πινακίδα.": "You have nothing specific yet. Confirm the plate first.", "Εσύ: «Κέντρο, από Περιπολικό 7. Οδός Λιμανιού. Επιβεβαιώνω κόκκινο κουπέ, ΑΚΤ-4471. Πιθανός ύποπτος στο καφέ “Γλάρος”.»": "You: \"Dispatch, Patrol Car 7. Port Street. Confirming red coupé, AKT-4471. Possible suspect at the 'Seagull' café.\"", "Ασύρματος: «Ελήφθη, Επτά. Το όχημα είναι δηλωμένο κλεμμένο. Δεύτερο περιπολικό καθ’ οδόν. Προχώρα με προσοχή.»": "Radio: \"Copy, Seven. Vehicle is reported stolen. Second unit en route. Proceed with caution.\"", "Ήχος:": "Sound:", "ναι": "on", "όχι": "off", "Άδεια χέρια.": "Empty hands.", "Αυτά τα δύο δεν συνδυάζονται.": "These two don't go together.", "Διάλεξε ένα αντικείμενο.": "Pick an item.", "Αυτό δεν προβλέπεται από τον κανονισμό.": "That's not in the regulations.", "Όχι. Απλώς όχι.": "No. Just no.", "Δεν βγαίνει νόημα, αστυφύλακα.": "That makes no sense, officer.", "Δεν βγάζεις το όπλο χωρίς λόγο. Ποτέ.": "You don't draw your weapon without reason. Ever.", "Δεν υπάρχει τίποτα εδώ για να το χρησιμοποιήσεις. (B για άδεια χέρια)": "There's nothing here to use it on. (B for empty hands)", "Ακτή, 1989. Αστυνομικό Τμήμα Παραλίας.": "Akti, 1989. Seafront Police Station.", "Είσαι ο αστυφύλακας Άρης Μαυρίδης. Είκοσι τεσσάρων ετών, φρέσκος από τη Σχολή.": "You are Officer Aris Mavridis. Twenty-four, fresh out of the Academy.", "Πρώτη σου βάρδια. Ο αρχιφύλακας Κανελλόπουλος έχει ήδη αμφιβολίες.": "Your first shift. Sergeant Kanellopoulos already has his doubts.", "Κάνε τη δουλειά σωστά. Με τον κανονισμό. Βήμα βήμα.": "Do the job right. By the book. Step by step.", "Βέλη για κίνηση. A εξετάζει ή χρησιμοποιεί. B αλλάζει το αντικείμενο που κρατάς. Τσάντα για εξέταση.": "Arrows to move. A examines or uses. B switches the item you're holding. Bag to examine items.", " · A για χρήση": " · A to use", "Ρυθμίσεις": "Settings", "Στην αρχική": "Back to title", "Εξέταση": "Examine", "Κλείσιμο": "Close", "Πρώτη βάρδια στην Ακτή, 1989": "First shift in Akti, 1989", "Νέο παιχνίδι": "New game", "Συνέχεια": "Continue", "Ακολούθησε τον κανονισμό. Ο κανονισμός σε κρατάει ζωντανό.": "Follow the regulations. The regulations keep you alive.", "Μέγεθος γραμμάτων": "Text size", "Γλώσσα": "Language", "Έτσι θα φαίνονται τα κείμενα: «Περιπολικό 7, από Κέντρο.»": "This is how text will look: \"Patrol Car 7, this is Dispatch.\"", "Πλήρης οθόνη": "Full screen", "Δοκίμασε ξανά": "Try again", "Γύρισε το κινητό οριζόντια.": "Turn your phone sideways.", "Τίποτα που να ενδιαφέρει την υπηρεσία.": "Nothing of interest to the force.", "Αυτό δεν χρειάζεται να το πάρεις.": "You don't need to take that.", "Δεν απαντάει. Ο κανονισμός δεν προβλέπει συζήτηση με αντικείμενα.": "It doesn't answer. Regulations don't cover conversations with objects.", "Διάλεξε ενέργεια από τη μπάρα: πόδια, μάτι, χέρι, στόμα ή αντικείμενο. Μετά πάτα πάνω στην εικόνα. Με ποντίκι, το δεξί κλικ αλλάζει ενέργεια.": "Pick an action from the bar: feet, eye, hand, mouth or item. Then tap the picture. With a mouse, right-click changes the action.", "Η πόρτα προς την αίθουσα ενημέρωσης.": "The door to the briefing room.", "Το ντουλάπι σου. Νούμερο 7. Ακόμα μυρίζει καινούργια μπογιά.": "Your locker. Number 7. It still smells of fresh paint.", "Ντουλάπια": "Lockers", "Τα ντουλάπια των συναδέλφων. Σε ένα κάποιος έχει κολλήσει αυτοκόλλητο του Ολυμπιακού. Σε άλλο, του Παναθηναϊκού. Δίπλα δίπλα. Θαύμα.": "Your colleagues' lockers. One has an Olympiacos sticker. Another, a Panathinaikos one. Side by side. A miracle.", "Μια βρύση με πόσιμο νερό.": "A drinking-water tap.", "Η πόρτα για τα κρατητήρια. Από πάνω, μια κόκκινη πινακίδα.": "The door to the holding cells. A red sign hangs above it.", "Ο αρχιφύλακας Κανελλόπουλος. Τριάντα χρόνια στην υπηρεσία, και τα τριάντα με το ίδιο μουστάκι.": "Sergeant Kanellopoulos. Thirty years on the force, all thirty with the same moustache.", "Ο πίνακας με τα κλειδιά των περιπολικών.": "The board with the patrol car keys.", "Πατάς το κουμπί. Το μηχάνημα βήχει και σου δίνει κάτι καφέ. Δεν το πίνεις.": "You press the button. The machine coughs and gives you something brown. You don't drink it.", "Το πίσω λάστιχο του περιπολικού.": "The patrol car's rear tyre.", "Το Περιπολικό 7. Λευκό, με μπλε ρίγα και έναν φάρο που έχει δει πολλά.": "Patrol Car 7. White, with a blue stripe and a light bar that has seen a lot.", "Ο Μήτσος. Λάδια μέχρι τους αγκώνες, χαμόγελο μέχρι τα αυτιά.": "Mitsos. Oil up to his elbows, grin up to his ears.", "Το Περιπολικό 7, παρκαρισμένο με τον φάρο αναμμένο.": "Patrol Car 7, parked with its lights flashing.", "Ένας άντρας με δερμάτινο μπουφάν και μαύρα γυαλιά. Πίνει φρέντο σαν να μην τρέχει τίποτα.": "A man in a leather jacket and dark glasses. He's drinking a freddo as if nothing is wrong.", "Καφέ «Γλάρος»": "'Seagull' café", "Το καφέ «Γλάρος». Φρέντο, τοστ και κουτσομπολιό από τις έξι το πρωί.": "The 'Seagull' café. Freddo, toasties and gossip from six in the morning.", "Το περίπτερο της κυρίας Ρούλας. Εφημερίδες, τσιγάρα και πληροφορίες.": "Mrs Roula's kiosk. Newspapers, cigarettes and information.", "Ο αστυφύλακας Γιαννάκης, φύλακας των κρατητηρίων και της γραφομηχανής.": "Officer Giannakis, keeper of the cells and of the typewriter.", "Περπάτα": "Walk", "Κοίτα": "Look", "Πάρε / Χρησιμοποίησε": "Take / Use", "Μίλα": "Talk", "Χρησιμοποίησε αντικείμενο": "Use item", "Διάλεξε ένα αντικείμενο. Πάτα δεύτερο για να τα συνδυάσεις.": "Pick an item. Tap a second one to combine them.", "Αντικείμενα": "Items", "Μενού": "Menu", "Οπτικά εφέ": "Visual effects", "Πλήρη": "Full", "Ελαφριά": "Light"};

/* ---------- walk grid + A* pathfinding ---------- */
const CELL=4;
function buildGrid(s){ const gw=Math.ceil(s.w/CELL), gh=Math.ceil(H/CELL), m=new Uint8Array(gw*gh);
  for(let gy=0;gy<gh;gy++) for(let gx=0;gx<gw;gx++){ const x=gx*CELL+2, y=gy*CELL+2; let ok=inPoly(x,y,s.walk); if(ok) for(const b of s.block) if(x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]){ ok=false; break; } m[gy*gw+gx]=ok?1:0; }
  s.grid={gw,gh,m}; }
function walkable(s,x,y){ const G=s.grid, gx=Math.floor(x/CELL), gy=Math.floor(y/CELL); return gx>=0&&gy>=0&&gx<G.gw&&gy<G.gh&&G.m[gy*G.gw+gx]===1; }
function nearestCell(s,x,y){ const G=s.grid; const gx=clamp(Math.floor(x/CELL),0,G.gw-1), gy=clamp(Math.floor(y/CELL),0,G.gh-1); if(G.m[gy*G.gw+gx]) return [gx,gy];
  for(let r=1;r<70;r++){ let best=null, bd=1e9; for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; const cx=gx+dx, cy=gy+dy; if(cx<0||cy<0||cx>=G.gw||cy>=G.gh||!G.m[cy*G.gw+cx]) continue; const d=dx*dx*2.5+dy*dy; if(d<bd){ bd=d; best=[cx,cy]; } } if(best) return best; } return null; }
function los(s,a,b){ const d=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.ceil(d/2); for(let i=1;i<=n;i++){ const t=i/n; if(!walkable(s,a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)) return false; } return true; }
function findPath(s,sx,sy,tx,ty){
  const G=s.grid, gw=G.gw, st=nearestCell(s,sx,sy), en=nearestCell(s,tx,ty); if(!st||!en) return [];
  const N=gw*G.gh, sI=st[1]*gw+st[0], eI=en[1]*gw+en[0], gS=new Float32Array(N).fill(1e9), came=new Int32Array(N).fill(-1), closed=new Uint8Array(N), heap=[];
  const push=(i,f)=>{ heap.push([f,i]); let c=heap.length-1; while(c>0){ const p=(c-1)>>1; if(heap[p][0]<=heap[c][0]) break; [heap[p],heap[c]]=[heap[c],heap[p]]; c=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let c=0; for(;;){ const l=c*2+1, r=l+1; let m=c; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===c) break; [heap[m],heap[c]]=[heap[c],heap[m]]; c=m; } } return top; };
  const hf=i=>{ const dx=Math.abs(i%gw-en[0]), dy=Math.abs(((i/gw)|0)-en[1]); return Math.max(dx,dy)+.414*Math.min(dx,dy); };
  gS[sI]=0; push(sI,hf(sI));
  while(heap.length){ const [,i]=pop(); if(closed[i]) continue; if(i===eI) break; closed[i]=1; const x=i%gw, y=(i/gw)|0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=gw||ny>=G.gh) continue; const j=ny*gw+nx; if(!G.m[j]||closed[j]) continue;
      if(dx&&dy&&(!G.m[y*gw+nx]||!G.m[ny*gw+x])) continue; const c=gS[i]+(dx&&dy?1.414:1); if(c<gS[j]){ gS[j]=c; came[j]=i; push(j,c+hf(j)); } } }
  if(sI!==eI&&came[eI]<0) return [];
  const cells=[]; for(let i=eI;i!==sI&&i>=0;i=came[i]) cells.push(i); cells.reverse();
  const pts=cells.map(i=>[(i%gw)*CELL+2,((i/gw)|0)*CELL+2]); if(walkable(s,tx,ty)) pts.push([tx,ty]); if(!pts.length) return [];
  const out=[]; let cur=[sx,sy], k=0;
  while(k<pts.length){ let far=k; for(let m=pts.length-1;m>k;m--) if(los(s,cur,pts[m])){ far=m; break; } out.push(pts[far]); cur=pts[far]; k=far+1; }
  return out; }

const lc=document.createElement('canvas'); lc.width=W; lc.height=H; const lg=lc.getContext('2d');
function hdAdd(fn){ octx.save(); octx.globalCompositeOperation='lighter'; fn(); octx.restore(); }
function hdGlow(x,y,r,rgb,a){ if(r<=0) return; const g=octx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'rgba('+rgb+','+a+')'); g.addColorStop(1,'rgba('+rgb+',0)'); octx.fillStyle=g; octx.fillRect(x-r,y-r,r*2,r*2); }
function hdBeam(pts,rgb,a0,a1,y0,y1){ octx.beginPath(); pts.forEach(([x,y],i)=>i?octx.lineTo(x,y):octx.moveTo(x,y)); octx.closePath(); const g=octx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,'rgba('+rgb+','+a0+')'); g.addColorStop(1,'rgba('+rgb+','+a1+')'); octx.fillStyle=g; octx.fill(); }
function hdSun(sx,sy,warm){ const cg=Math.round(236-warm*70), cb=Math.round(190-warm*120);
  hdAdd(()=>{ hdGlow(sx,sy,90,'255,'+cg+','+cb,.45); octx.fillStyle='rgba(255,'+(250-warm*60)+','+(220-warm*120)+',.95)'; octx.beginPath(); octx.arc(sx,sy,6,0,7); octx.fill();
    if(FXFULL) for(let i=0;i<4;i++){ const a=2.0+i*.24+Math.sin(T*.3+i)*.03, len=260, w2=.035+.02*Math.sin(T*.5+i*2); octx.beginPath(); octx.moveTo(sx,sy); octx.lineTo(sx+Math.cos(a-w2)*len,sy+Math.sin(a-w2)*len); octx.lineTo(sx+Math.cos(a+w2)*len,sy+Math.sin(a+w2)*len); octx.closePath();
      const l2=octx.createLinearGradient(sx,sy,sx+Math.cos(a)*len,sy+Math.sin(a)*len); l2.addColorStop(0,'rgba(255,'+cg+','+cb+',.075)'); l2.addColorStop(1,'rgba(0,0,0,0)'); octx.fillStyle=l2; octx.fill(); } }); }
function hdGrade(mode,rgb,a){ octx.save(); octx.globalCompositeOperation=mode; octx.fillStyle='rgba('+rgb+','+a+')'; octx.fillRect(0,0,W,H); octx.restore(); }
function hdVignette(a,rgb){ const vg=octx.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,W*.7); vg.addColorStop(0,'rgba('+(rgb||'20,8,30')+',0)'); vg.addColorStop(1,'rgba('+(rgb||'20,8,30')+','+a+')'); octx.fillStyle=vg; octx.fillRect(0,0,W,H); }
const hdl=document.createElement('canvas'), hdg=hdl.getContext('2d');
function composite(dt,cam,lights,dark){
  const s=SC[S.scene], k=OW/W;
  octx.setTransform(1,0,0,1,0,0); octx.globalCompositeOperation='source-over'; octx.globalAlpha=1; octx.imageSmoothingEnabled=false; octx.drawImage(cv,0,0,OW,OH);
  if(dark>0){ if(hdl.width!==OW||hdl.height!==OH){ hdl.width=OW; hdl.height=OH; }
    hdg.setTransform(1,0,0,1,0,0); hdg.globalCompositeOperation='source-over'; hdg.clearRect(0,0,OW,OH); hdg.fillStyle='rgba('+(G.darkRGB||'4,3,8')+','+dark+')'; hdg.fillRect(0,0,OW,OH);
    hdg.setTransform(k,0,0,k,0,0); hdg.globalCompositeOperation='destination-out';
    for(const [x0,y,r,i] of lights){ const x=x0-cam; if(x<-r||x>W+r) continue; const g=hdg.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'rgba(0,0,0,'+i+')'); g.addColorStop(.4,'rgba(0,0,0,'+(i*.7)+')'); g.addColorStop(.75,'rgba(0,0,0,'+(i*.22)+')'); g.addColorStop(1,'rgba(0,0,0,0)'); hdg.fillStyle=g; hdg.fillRect(x-r,y-r,r*2,r*2); }

  octx.setTransform(k,0,0,k,0,0); octx.imageSmoothingEnabled=true;
  const td=G.tod?G.tod():0;

  if(G.grade) G.grade(s,td);
  for(let i=POP.length-1;i>=0;i--){ const p=POP[i]; p.t+=dt; if(p.t>1.4){ POP.splice(i,1); continue; } const x=p.x-cam, y=p.y-p.t*16;
    octx.save(); octx.globalAlpha=Math.min(1,(1.4-p.t)*2); octx.font=G.popFont||'700 10px sans-serif'; octx.textAlign='center'; octx.lineWidth=3; octx.strokeStyle=G.popStroke||'#2b1d3a'; octx.strokeText(p.txt,x,y); octx.fillStyle=G.popFill||'#ffd23f'; octx.fillText(p.txt,x,y); octx.restore(); }

    else { const cx=S.mode==='title'?W/2:clamp(S.x-cam,30,W-30), cy=S.y-30*scl(S.y), r=Math.max(0,(1-S.fade)*Math.hypot(W,H));

      if(r>2){ octx.beginPath(); octx.arc(cx,cy,r,0,Math.PI*2); octx.lineWidth=1.5; octx.strokeStyle=G.irisRim||'rgba(255,210,63,.8)'; octx.stroke(); } octx.restore(); } }
}

/* ---------- update ---------- */
function update(dt){
  for(let i=timers.length-1;i>=0;i--){ timers[i].t-=dt; if(timers[i].t<=0){ const f=timers[i].fn; timers.splice(i,1); f(); } }
  if(S.fadeDur){ S.fadeT+=dt; const k=Math.min(1,S.fadeT/S.fadeDur); S.fade=S.fadeFrom+(S.fadeTo-S.fadeFrom)*k; if(k>=1){ S.fadeDur=0; const cb=S.fadeCb; S.fadeCb=null; if(cb) cb(); } }
  if(G.dlgTick) G.dlgTick(dt); else if(D.active&&!D.opts&&D.shown<D.text.length){ const b=Math.floor(D.shown/4); D.shown=Math.min(D.text.length,D.shown+dt*55); dlgText.textContent=D.text.slice(0,Math.floor(D.shown)); if(Math.floor(D.shown/4)!==b) sfx('type'); }
  if(!G.dlgTick) moreEl.style.visibility=D.active&&!D.opts&&D.shown>=D.text.length?'visible':'hidden';
  if(typeof ptDraw==='function') ptDraw(); musicTick(dt); S.shk=Math.max(0,S.shk-dt);
  const s=SC[S.scene]; S.moving=false;
  if(S.mode==='play'&&S.path.length&&(!D.active||S.dance)&&!S.trans&&!S.frozen){
    const [tx,ty]=S.path[0], dx=tx-S.x, dy=ty-S.y, nx=dx, ny=dy/.62, L=Math.hypot(nx,ny), step=(G.speed||54)*scl(S.y)*dt;
    if(L<=step){ S.x=tx; S.y=ty; S.path.shift(); if(!S.path.length){ const cb=S.onArrive; S.onArrive=null; if(cb) cb(); } }
    else { S.x+=nx/L*step; S.y+=ny/L*step*.62; S.moving=true; }
    if(Math.abs(dx)>Math.abs(dy)*1.1){ S.dir='side'; S.face=dx>0?1:-1; } else if(Math.abs(dy)>.5) S.dir=dy>0?'front':'back';
    const b=Math.floor(S.phase/Math.PI); S.phase+=dt*10; if(Math.floor(S.phase/Math.PI)!==b){ sfx('step'); const c=(G.dust||{})[S.scene]; if(c&&FXFULL) puff(S.x,S.y,c,2); } }
  if(S.mode==='play'&&G.update) G.update(dt,s);
  if(S.mode==='title') S.cam=clamp((s.w-W)/2+Math.sin(T*.1)*((s.w-W)/2),0,s.w-W);
  else { const tx=clamp(S.x-W/2,0,s.w-W); S.cam+=(tx-S.cam)*Math.min(1,dt*4); }
}

/* ---------- render ---------- */
function render(dt){
  const s=SC[S.scene], cam=Math.round(S.cam), sx=S.shk>0?Math.round((Math.random()-.5)*2*S.shkA):0, sy=S.shk>0?Math.round((Math.random()-.5)*S.shkA):0;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.translate(-cam+sx,sy);
  ctx.drawImage(s.img,0,0); if(s.anim) s.anim(ctx,dt);
  const L=s.props().slice();
  if(S.mode!=='title'&&!S.hidePlayer){ const k=scl(S.y); L.push({y:S.y,draw(g){ actor(g,G.playerFn(),S.x,S.y,k,S.dir==='side'&&S.face<0,!!s.night); }}); }
  if(G.extra) G.extra(L,s);
  L.sort((a,b)=>a.y-b.y); for(const p of L) p.draw(ctx);
  for(let i=PFX.length-1;i>=0;i--){ const p=PFX[i]; p.t+=dt; if(p.t>=p.max){ PFX.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g!==undefined?p.g:14)*dt; ctx.globalAlpha=(1-p.t/p.max)*.8; const r=Math.round(p.r*(1+p.t)); R(ctx,p.x-r/2,p.y-r/2,r,r,p.c); ctx.globalAlpha=1; }

  rnd(seed){ let s=seed>>>0||1; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); },

function CS_loukoumas(){ return { introMood:'sunny', midMood:'sunny', endMood:'sunny', midWhen:()=>S.scene==='disco',

  ],
  mid:[

    {d:5,cap:['Στη ντισκοτέκ, οι μπάλες-καθρέφτες γύρισαν. Ήρθε η ώρα.','At the disco, the mirror balls began to spin. It was time.'],low(g,t){ C.R(g,0,0,320,180,'#140a24'); for(let i=0;i<8;i++) for(let j=0;j<5;j++) C.R(g,40+i*30,110+j*14,28,12,['#e0338a','#3a7ad8','#ffd23f','#3fae4a'][(i+j+Math.floor(t*4))%4]); C.disc(g,160,30,12,'#c8c8d8'); },hd(o,t){ for(let i=0;i<6;i++){ const a=t*1.5+i; C.glow(o,160+Math.cos(a)*120,90+Math.sin(a*1.3)*50,30,['255,80,200','80,180,255','255,230,80'][i%3],.35); } C.glow(o,160,30,24,'255,255,255',.5); }},

    {d:6,cap:['Ο Τάκης κέρδισε τον διαγωνισμό. Και κάτι πολύ πιο σημαντικό.','Takis won the contest. And something far more important.'],low(g,t){ C.R(g,0,0,320,180,'#140a24'); for(let i=0;i<8;i++) for(let j=0;j<4;j++) C.R(g,40+i*30,124+j*14,28,12,['#e0338a','#3a7ad8','#ffd23f','#3fae4a'][(i+j+Math.floor(t*4))%4]); const b=Math.sin(t*6)*3; C.fig(g,145,124+b,50,'#2b1d3a',{head:'#eab58c',hair:'#2a1a12'}); C.fig(g,175,124-b,46,'#e0338a',{head:'#f0c8a0',hair:'#ffd23f',long:true}); },hd(o,t){ C.glow(o,160,30,30,'255,255,255',.4); C.glow(o,160,90,60,'255,120,200',.25); C.title(o,CINE.L(['Τέλος','The End']),40,16,'#ffd23f',Math.min(1,t/3)); }},

function CS_peripoliko(){ return { introMood:'police', midMood:'police', endMood:'police', midWhen:()=>S.scene==='street',
  intro:[
    {d:6,cap:['Ακτή, 1989. Πέντε και μισή το πρωί.','Akti, 1989. Half past five in the morning.'],low(g,t,p){ C.sky(g,0,120,['#1a2a5a','#8a7aa8','#ffb08a']); C.skyline(g,120,9,'#2a2a4a','#ffe090'); C.R(g,0,120,320,60,'#4a4a5a'); C.R(g,110,70,100,50,'#5a6a8a'); C.R(g,110,66,100,6,'#3a4a6a'); C.R(g,140,74,40,8,'#f4f4f4'); C.R(g,150,96,20,24,'#2a3a5a'); },hd(o,t){ o.save(); o.font='700 6px sans-serif'; o.textAlign='center'; o.fillStyle='#1a2a6a'; o.fillText(CINE.L(['ΑΣΤΥΝΟΜΙΑ','POLICE']),160,80.5); o.restore(); C.title(o,CINE.L(['Περιπολικό 7','Patrol Car 7']),40,22,'#ffffff',Math.min(1,t/1.5)); C.glow(o,300,118,70,'255,190,130',.35); }},

    {d:5,cap:['Κανονισμός, υπομονή, ψυχραιμία. Και κανένα λάθος.','Regulations, patience, composure. And no mistakes.'],low(g,t,p){ C.R(g,0,0,320,180,'#1a1a22'); for(let i=0;i<6;i++){ C.R(g,30+i*45,40,40,110,i===3?'#5a6a7a':'#3a4a5a'); C.R(g,62+i*45,90,3,8,'#c8c8c8'); } C.R(g,0,150,320,30,'#2a2a30'); },hd(o,t){ const on=t>1&&(t>1.6||Math.sin(t*40)>0); if(on){ C.glow(o,160,10,140,'220,240,255',.35); } C.title(o,'7',70,10,'#ffffff',1); }},
  ],
  mid:[
    {d:5.5,cap:['Περιπολικό 7, σε περιπολία. Το κέντρο ακούει.','Patrol Car 7, on patrol. Dispatch is listening.'],low(g,t,p){ C.sky(g,0,110,['#5a9ad8','#c8e0f0']); C.skyline(g,110,4,'#8a9ab8','#ffffff',t*30); C.R(g,0,110,320,70,'#4a4a52'); for(let i=0;i<10;i++) C.R(g,(i*40-t*120)%360+360-40,142,20,2,'#e8e8e8'); carSide(g,130,150,'#f4f4f4',['#ff3030','#3060ff']); C.R(g,130,144,40,2,'#1a3a8a'); },hd(o,t){ const a=Math.sin(t*12)>0; C.glow(o,146,134,30,a?'255,40,40':'40,80,255',.6); }},

function CS_kokkino(){ return { introMood:'tale', midMood:'tale', endMood:'tale', midWhen:()=>S.scene==='forest',
  intro:[
    {d:5.5,cap:['Μια φορά κι έναν καιρό…','Once upon a time…'],low(g,t,p){ C.R(g,0,0,320,180,'#8a5a3a'); for(let i=0;i<12;i++) C.R(g,0,i*16,320,1,'#7a4a2a'); const w=Math.max(4,140*(1-Math.max(0,p-.6)*2.5)); C.R(g,160-w/2-4,26,w+8,130,'#5a1a1a'); C.R(g,160-w/2,30,w,122,'#c8302a'); if(w>60) C.disc(g,160,80,22,'#e8e0d0'); },hd(o,t,p){ if(p<.6) C.title(o,CINE.L(['Η Κοκκινοσκουφίτσα','Little Red Riding Hood']),130,13,'#ffe8b0',1); C.glow(o,160,70,120,'255,220,160',.15); }},

  ],
  mid:[
    {d:5,cap:['Το δάσος ήταν μεγάλο και πράσινο, γεμάτο πουλάκια και πεταλούδες.','The forest was big and green, full of birds and butterflies.'],low(g,t){ C.R(g,0,0,320,180,'#3a7a4a'); for(let i=0;i<9;i++){ C.R(g,i*38,20,12,160,'#5a3a2a'); C.disc(g,i*38+6,30,26,'#2f6a3a'); } C.R(g,0,140,320,40,'#5a9a4a'); for(let i=0;i<4;i++){ const x=(i*80+t*30)%340, y=100+Math.sin(t*3+i)*10; C.R(g,x,y,3,2,'#ffe066'); C.R(g,x+3,y-1,2,4,'#ff8ab0'); } },hd(o,t){ C.beams(o,t,'255,240,170',.18,6); }},
    {d:5,cap:['Μα πίσω από έναν θάμνο, δύο κίτρινα μάτια παρακολουθούσαν… Ποιος να ’ναι άραγε;','But behind a bush, two yellow eyes were watching… Who could it be?'],low(g,t){ C.R(g,0,0,320,180,'#1a3a2a'); C.ell(g,160,110,90,40,'#2a5a3a'); C.ell(g,140,100,60,30,'#346a44'); const bl=(t%2.4)<.15; C.R(g,140,96,8,bl?1:6,'#ffd23f'); C.R(g,166,96,8,bl?1:6,'#ffd23f'); if(!bl){ C.R(g,143,98,2,3,'#1a1a1a'); C.R(g,169,98,2,3,'#1a1a1a'); } },hd(o){ C.glow(o,157,99,30,'255,220,80',.25); C.vign(o,.6); }},
  ],
  ending:()=>[

    {d:5,cap:['Και ο λύκος; Έμαθε να ζητάει συγγνώμη. Και να τρώει κουλουράκια.','And the wolf? He learned to say sorry. And to eat cookies.'],low(g,t,p){ C.R(g,0,0,320,180,'#8a5a3a'); const w=Math.max(4,140*Math.min(1,p*1.6)); C.R(g,160-w/2-4,26,w+8,130,'#5a1a1a'); C.R(g,160-w/2,30,w,122,'#c8302a'); },hd(o,t,p){ if(p>.5) C.title(o,CINE.L(['Τέλος','The End']),96,18,'#ffe8b0',Math.min(1,(p-.5)*3)); }},
  ]}; }
