<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Απογραφή · v2 (πλάγια κύλιση)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#ddd5c4; --dim:#8c8476; --blood:#a8291f; --veil:rgba(8,6,6,.62); --line:rgba(221,213,196,.22); --bg:#000;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#ddd5c4; --dim:#8c8476; --bg:#000; } }
:root[data-theme="dark"]{ --ink:#ddd5c4; --dim:#8c8476; --bg:#000; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;}
body{box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'EB Garamond',Georgia,'Times New Roman',serif;color:var(--ink);}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;background:#000;--u:2px;--ts:1;}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;}
button:focus-visible{outline:1px solid var(--ink);outline-offset:2px;}

/* dialogue */
#dlg{position:absolute;left:50%;top:calc(var(--u)*7);transform:translateX(-50%);width:min(94%,calc(66% + (var(--ts) - 1) * 46%));max-height:calc(100% - var(--u)*50);overflow-y:auto;
  padding:calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*6);background:var(--veil);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;}
#dlg[hidden]{display:none;}
#dlgText{margin:0;font-size:calc(var(--u)*7.4*var(--ts));line-height:1.38;font-style:italic;min-height:1.38em;text-wrap:pretty;}
#dlgOpts{display:flex;flex-direction:column;gap:calc(var(--u)*3);margin-top:calc(var(--u)*5);}
#dlgOpts:empty{display:none;}
#dlgOpts button{background:none;border:0;border-top:1px solid var(--line);padding:calc(var(--u)*3) 0 0;font-size:calc(var(--u)*7*var(--ts));cursor:pointer;}
#dlgOpts button:active{color:var(--blood);}
#more{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*2);font-size:calc(var(--u)*5);color:var(--dim);animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(2px);}}

#whisper{position:absolute;left:0;right:0;top:44%;text-align:center;font-style:italic;font-size:calc(var(--u)*10*var(--ts));color:#c43a2c;
  opacity:0;transition:opacity 1.1s ease;pointer-events:none;text-shadow:0 0 calc(var(--u)*4) rgba(120,0,0,.9);letter-spacing:.04em;}
#whisper.show{opacity:.92;}

#hint{position:absolute;left:50%;bottom:calc(var(--u)*7);transform:translateX(-50%);max-width:calc(46% + (var(--ts) - 1) * 10%);text-align:center;
  font-size:calc(var(--u)*6.4*var(--ts));color:var(--ink);opacity:.82;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tip{position:absolute;left:50%;bottom:calc(var(--u)*17);transform:translateX(-50%);width:min(80%,calc(52% + (var(--ts) - 1) * 40%));text-align:center;font-size:calc(var(--u)*5.6*var(--ts));
  color:var(--dim);font-style:italic;pointer-events:none;transition:opacity 1s;opacity:0;}
#tip.show{opacity:1;}

/* controls */
.ctl{position:absolute;width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;
  background:rgba(12,10,10,.34);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;}
.ctl svg{width:44%;height:44%;fill:none;stroke:var(--ink);stroke-width:2;opacity:.75;}
.ctl.held{background:rgba(221,213,196,.16);}
#bL{left:calc(var(--u)*6);bottom:calc(var(--u)*6);}
#bR{left:calc(var(--u)*40);bottom:calc(var(--u)*6);}
#bA{right:calc(var(--u)*6);bottom:calc(var(--u)*6);width:calc(var(--u)*34);height:calc(var(--u)*34);opacity:.55;transition:opacity .25s;}
#bA.live{opacity:1;border-color:rgba(221,213,196,.5);}
#bInv{right:calc(var(--u)*6);top:calc(var(--u)*6);width:calc(var(--u)*24);height:calc(var(--u)*24);}
#bMenu{left:calc(var(--u)*6);top:calc(var(--u)*6);width:calc(var(--u)*20);height:calc(var(--u)*20);}
#sel{position:absolute;right:calc(var(--u)*44);bottom:calc(var(--u)*14);width:calc(var(--u)*18);height:calc(var(--u)*18);
  border:1px solid var(--blood);background:rgba(12,10,10,.5);padding:calc(var(--u)*2);}
#sel[hidden]{display:none;}
#sel canvas,.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
.ctl b{font-weight:600;font-style:normal;font-size:calc(var(--u)*12);line-height:1;opacity:.82;}
#bB{right:calc(var(--u)*44);bottom:calc(var(--u)*24);width:calc(var(--u)*26);height:calc(var(--u)*26);}
#bB b{font-size:calc(var(--u)*10);}
#sel{right:calc(var(--u)*6);bottom:calc(var(--u)*46);width:auto;height:auto;max-width:42%;display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:calc(var(--u)*2) calc(var(--u)*5) calc(var(--u)*2) calc(var(--u)*2);font-size:calc(var(--u)*6*var(--ts));font-style:italic;white-space:nowrap;}
#sel canvas{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none;}
#sel span{overflow:hidden;text-overflow:ellipsis;}
#sel.pop{animation:pop .25s ease;}
@keyframes pop{0%{transform:scale(.85);opacity:.4}100%{transform:none;opacity:1}}

/* inventory */
#inv{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*7) calc(var(--u)*36) calc(var(--u)*6);
  background:linear-gradient(rgba(6,5,5,.92),rgba(6,5,5,.8));border-bottom:1px solid var(--line);}
#inv[hidden]{display:none;}
#slots{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center;min-height:calc(var(--u)*22);}
.slot{width:calc(var(--u)*22);height:calc(var(--u)*22);padding:calc(var(--u)*3);background:rgba(221,213,196,.05);border:1px solid var(--line);}
.slot.on{border-color:var(--blood);background:rgba(168,41,31,.18);}
#invBar{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*6);margin-top:calc(var(--u)*4);}
#invCap{font-size:calc(var(--u)*6.4*var(--ts));font-style:italic;color:var(--ink);min-height:1.3em;text-align:center;}
#invBar button{background:none;border:1px solid var(--line);padding:calc(var(--u)*1.5) calc(var(--u)*6);font-size:calc(var(--u)*6*var(--ts));}
#invBar{flex-wrap:wrap;}
#invBar button:disabled{opacity:.3;}

/* menu */
#menu{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*30);display:flex;flex-direction:column;gap:calc(var(--u)*2);}
#menu[hidden]{display:none;}
#menu button{background:var(--veil);border:1px solid var(--line);padding:calc(var(--u)*2.5) calc(var(--u)*7);font-size:calc(var(--u)*6.4*var(--ts));text-align:left;}

/* title & end */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 calc(var(--u)*18) calc(var(--u)*16);
  background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,0) 80%);}
.screen[hidden]{display:none;}
#title h1{margin:0;font-weight:400;font-style:italic;font-size:calc(var(--u)*30);line-height:.9;letter-spacing:-.01em;color:#e4dccb;}
#title h1 span{display:block;font-style:normal;font-size:calc(var(--u)*6.4);letter-spacing:.02em;color:var(--dim);margin-top:calc(var(--u)*5);}
#title nav{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*2);margin-top:calc(var(--u)*10);}
#title nav button,#end button{background:none;border:0;padding:calc(var(--u)*1.5) 0;font-size:calc(var(--u)*9);cursor:pointer;}
#title nav button:active,#end button:active{color:var(--blood);}
#title nav button[hidden]{display:none;}
#title small{font-size:calc(var(--u)*5.2*var(--ts));color:var(--dim);margin-top:calc(var(--u)*8);font-style:italic;}
#end{background:#000;justify-content:center;align-items:center;text-align:center;padding:calc(var(--u)*12) calc(18% - (var(--ts) - 1) * 18%);overflow-y:auto;}
#end h2{font-weight:400;font-style:italic;font-size:calc(var(--u)*13);margin:0 0 calc(var(--u)*8);}
#end p{font-size:calc(var(--u)*7.2*var(--ts));line-height:1.5;margin:0 0 calc(var(--u)*4);opacity:0;animation:rise 2.2s ease forwards;}
#end button{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*7);color:var(--dim);opacity:0;animation:rise 2s ease forwards;}
@keyframes rise{to{opacity:1;}}

#settings{position:absolute;inset:0;background:rgba(4,3,3,.93);display:flex;flex-direction:column;justify-content:center;padding:0 12%;gap:calc(var(--u)*5);z-index:5;}
#settings[hidden]{display:none;}
#settings h3{margin:0;font-weight:400;font-style:italic;font-size:calc(var(--u)*14);}
#settings .lab{margin:0;color:var(--dim);font-size:calc(var(--u)*6.4);}
#tsRow{display:flex;gap:calc(var(--u)*3);}
#lgRow{display:flex;gap:calc(var(--u)*3);}
#tsRow button,#lgRow button{flex:1;background:none;border:1px solid var(--line);padding:calc(var(--u)*3) 0;line-height:1;}
#tsRow button[aria-pressed="true"],#lgRow button[aria-pressed="true"]{border-color:var(--ink);background:rgba(221,213,196,.1);}
#tsPrev{margin:0;font-style:italic;font-size:calc(var(--u)*7.4*var(--ts));line-height:1.38;min-height:2.8em;}
#settings .row{display:flex;gap:calc(var(--u)*4);flex-wrap:wrap;}
#settings .row button{background:none;border:1px solid var(--line);padding:calc(var(--u)*3) calc(var(--u)*8);font-size:calc(var(--u)*7);}
#rotate{position:fixed;inset:0;background:#000;color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  font-size:20px;font-style:italic;text-align:center;padding:0 12%;z-index:9;}
#rotate i{display:block;width:34px;height:58px;border:2px solid var(--ink);border-radius:6px;animation:turn 2.4s ease-in-out infinite;}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){#more,#rotate i{animation:none;}}

[hidden]{display:none!important;}
</style>




<style id="gfxcss">
/* settings panel: scrollable on small screens (content centred only when it fits) */
#settings{overflow-y:auto!important;justify-content:flex-start!important;padding-top:calc(var(--u)*8)!important;padding-bottom:calc(var(--u)*10)!important;touch-action:pan-y!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
#settings>*{flex-shrink:0;} #settings>:first-child{margin-top:auto!important;} #settings>:last-child{margin-bottom:auto!important;}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="whisper"></div>
  <div id="hint"></div>
  <div id="tip"></div>

  <button class="ctl" id="bL" aria-label="Αριστερά"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
  <button class="ctl" id="bR" aria-label="Δεξιά"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
  <button class="ctl" id="bA" aria-label="A: εξέταση ή χρήση"><b>A</b></button>
  <button class="ctl" id="bB" aria-label="B: άλλαξε αντικείμενο"><b>B</b></button>
  <button class="ctl" id="bInv" aria-label="Αντικείμενα"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1.3 12H5.3L4 8Zm4 0V6a4 4 0 0 1 8 0v2"/></svg></button>
  <button class="ctl" id="bMenu" aria-label="Μενού"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
  <button id="sel" hidden aria-label="Άδεια χέρια"></button>

  <div id="menu" hidden>
    <button id="mSet" data-i18n="Ρυθμίσεις">Ρυθμίσεις</button>
    <button id="mTitle" data-i18n="Στην αρχική">Στην αρχική</button>
  </div>

  <div id="inv" hidden>
    <div id="slots"></div>
    <div id="invBar">
      <div id="invCap"></div>
      <button id="bExam" disabled data-i18n="Εξέταση">Εξέταση</button>
      <button id="bClose" data-i18n="Κλείσιμο">Κλείσιμο</button>
    </div>
  </div>

  <div id="dlg" hidden><p id="dlgText"></p><div id="dlgOpts"></div><span id="more">▾</span></div>

  <div class="screen" id="title">
    <h1><b data-i18n="Απογραφή" style="font-weight:inherit">Απογραφή</b><span data-i18n="Θεσσαλονίκη, Νοέμβριος 1987">Θεσσαλονίκη, Νοέμβριος 1987</span></h1>
    <nav>
      <button id="tNew" data-i18n="Νέο παιχνίδι">Νέο παιχνίδι</button>
      <button id="tCont" hidden data-i18n="Συνέχεια">Συνέχεια</button>
      <button id="tSet" data-i18n="Ρυθμίσεις">Ρυθμίσεις</button>
    </nav>
    <small data-i18n="Καλύτερα με ακουστικά και το κινητό οριζόντια.">Καλύτερα με ακουστικά και το κινητό οριζόντια.</small>
  </div>

  <div id="settings" hidden role="dialog" aria-label="Ρυθμίσεις">
    <h3 data-i18n="Ρυθμίσεις">Ρυθμίσεις</h3>
    <p class="lab" data-i18n="Μέγεθος γραμμάτων">Μέγεθος γραμμάτων</p>
    <div id="tsRow">
      <button data-ts="1" style="font-size:calc(var(--u)*7)">Α</button>
      <button data-ts="1.3" style="font-size:calc(var(--u)*9)">Α</button>
      <button data-ts="1.6" style="font-size:calc(var(--u)*11)">Α</button>
      <button data-ts="2" style="font-size:calc(var(--u)*13)">Α</button>
    </div>
    <p class="lab" data-i18n="Γλώσσα">Γλώσσα</p>
    <div id="lgRow"><button data-lg="el" style="font-size:calc(var(--u)*7)">Ελληνικά</button><button data-lg="en" style="font-size:calc(var(--u)*7)">English</button></div>
    <p id="tsPrev" data-i18n="Έτσι θα φαίνονται τα κείμενα: «Το ρολόι σταμάτησε στις 3:17.»">Έτσι θα φαίνονται τα κείμενα: «Το ρολόι σταμάτησε στις 3:17.»</p>
    <div class="row">
      <button id="sSound">Ήχος: ναι</button>
      <button id="sFull" data-i18n="Πλήρης οθόνη">Πλήρης οθόνη</button>
      <button id="sClose" data-i18n="Κλείσιμο">Κλείσιμο</button>
    </div>
  </div>

  <div class="screen" id="end" hidden>
    <h2 id="endH"></h2>
    <div id="endT"></div>
    <button id="endB" data-i18n="Από την αρχή">Από την αρχή</button>
  </div>
</div>
</div>
<div id="rotate"><i></i><span data-i18n="Γύρισε το κινητό οριζόντια.">Γύρισε το κινητό οριζόντια.</span></div>

<script>
'use strict';
/* ============================================================
   ΑΠΟΓΡΑΦΗ — side-scrolling psychological horror adventure
   Everything (art, light, sound) is generated at runtime.
   ============================================================ */
const W = 320, H = 180, FLOOR = 160;
/* ===== v2 HD layer (shared) ===== */
const OUT=document.getElementById('cv'), octx=OUT.getContext('2d');

  if(d<.5){ g.fillStyle='rgba(20,10,30,'+a+')'; g.fillRect(cx+x,cy+y,1,1); } else if(((cx+x+cy+y)&1)===0){ g.fillStyle='rgba(20,10,30,'+(a*.7)+')'; g.fillRect(cx+x,cy+y,1,1); } } } }
function aoBand(g,x,w,y0,y1,a){ const gr=g.createLinearGradient(0,y0,0,y1); gr.addColorStop(0,'rgba(20,10,30,0)'); gr.addColorStop(1,'rgba(20,10,30,'+a+')'); g.fillStyle=gr; g.fillRect(x,y0,w,y1-y0); }
function grainBg(g,w,y0,amt){ const h=180-y0, id=g.getImageData(0,y0,w,h), d=id.data; for(let i=0,p=0;i<d.length;i+=4,p++){ const x=p%w, y=(p/w)|0; const n=(((x*73856093)^(y*19349663))>>>0)%1000; const k=1+((n/1000)-.5)*(amt||.07); d[i]=Math.min(255,d[i]*k); d[i+1]=Math.min(255,d[i+1]*k); d[i+2]=Math.min(255,d[i+2]*k); } g.putImageData(id,0,y0); }
function compChars(col,a){ OG.globalCompositeOperation='source-over'; OG.clearRect(0,0,320,180); OG.drawImage(chc,0,0); OG.globalCompositeOperation='source-in'; OG.fillStyle=col; OG.fillRect(0,0,320,180); OG.globalCompositeOperation='source-over';
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=a||.9; ctx.drawImage(olc,1,0); ctx.drawImage(olc,-1,0); ctx.drawImage(olc,0,1); ctx.drawImage(olc,0,-1); ctx.globalAlpha=1; ctx.drawImage(chc,0,0); ctx.restore(); }
function charLayer(cam,sx,sy){ CG.setTransform(1,0,0,1,0,0); CG.clearRect(0,0,320,180); CG.setTransform(1,0,0,1,-cam+(sx||0),sy||0); }
function hdBase(){ octx.setTransform(1,0,0,1,0,0); octx.globalCompositeOperation='source-over'; octx.globalAlpha=1; octx.imageSmoothingEnabled=false; octx.drawImage(cv,0,0,OW,OH); const k=OW/320; octx.setTransform(k,0,0,k,0,0); octx.imageSmoothingEnabled=true; return k; }
function hdAdd(fn){ octx.save(); octx.globalCompositeOperation='lighter'; fn(); octx.restore(); }

function hdSun(sx,sy,warm,rays){ const cg=Math.round(236-warm*70), cb=Math.round(190-warm*120);
  hdAdd(()=>{ hdGlow(sx,sy,90,'255,'+cg+','+cb,.45); octx.fillStyle='rgba(255,'+(250-warm*60)+','+(220-warm*120)+',.95)'; octx.beginPath(); octx.arc(sx,sy,6,0,7); octx.fill();
    if(rays) for(let i=0;i<4;i++){ const a=2.0+i*.24+Math.sin(T*.3+i)*.03, len=260, w2=.035+.02*Math.sin(T*.5+i*2); octx.beginPath(); octx.moveTo(sx,sy); octx.lineTo(sx+Math.cos(a-w2)*len,sy+Math.sin(a-w2)*len); octx.lineTo(sx+Math.cos(a+w2)*len,sy+Math.sin(a+w2)*len); octx.closePath();

/* ---------- small helpers ---------- */
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function R(g,x,y,w,h,c){ g.fillStyle = c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function hex(c){ return [1,3,5].map(i => parseInt(c.slice(i,i+2),16)); }
function mix(a,b,k){ const A = hex(a), B = hex(b); return 'rgb(' + A.map((v,i) => Math.round(v + (B[i]-v)*k)).join(',') + ')'; }
function disc(g,cx,cy,r,c){ g.fillStyle = c; for(let dy=-r; dy<=r; dy++){ const dx = Math.floor(Math.sqrt(r*r - dy*dy + r*.6)); g.fillRect(cx-dx, cy+dy, dx*2+1, 1); } }
function line(g,x0,y0,x1,y1,c){ g.fillStyle = c; x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let e=dx+dy;
  for(let i=0;i<800;i++){ g.fillRect(x0,y0,1,1); if(x0===x1&&y0===y1) break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} } }
function speck(g,x,y,w,h,n,cols,r){ for(let i=0;i<n;i++) R(g, x+r()*w, y+r()*h, 1, 1, cols[(r()*cols.length)|0]); }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);

  opts.forEach(o=>{ const b=document.createElement('button'); b.textContent=tr(o.t); b.addEventListener('click',e=>{ e.stopPropagation(); D.opts=null; D.active=false; dlgEl.hidden=true; dlgOpts.innerHTML=''; o.f(); }); dlgOpts.appendChild(b); }); }
let whT=0;
function whisper(t){ const el=$('whisper'); el.textContent=tr(t); el.classList.add('show'); clearTimeout(whT); whT=setTimeout(()=>el.classList.remove('show'),2400); }
let tipT=0;
function tip(t,ms){ const el=$('tip'); el.textContent=tr(t); el.classList.add('show'); clearTimeout(tipT); tipT=setTimeout(()=>el.classList.remove('show'),ms||6000); }

/* ---------- scene flow ---------- */
function fadeTo(v,d,cb){ S.fadeFrom=S.fade; S.fadeTo=v; S.fadeDur=d; S.fadeT=0; S.fadeCb=cb||null; }
function enter(id,x){ S.scene=id; S.x=x; const s=SC[id]; S.cam=clamp(x-W/2,0,s.w-W); S.ghost=null; A.amb(); if(id!=='dream') save(); }
function go(id,x,cb){ if(S.trans) return; S.trans=1; closeInv();
  fadeTo(1,.45,()=>{ enter(id,x); fadeTo(0,.55,()=>{ S.trans=0; const s=SC[id]; if(s.onEnter) s.onEnter(); if(cb) cb(); }); }); }
function clockEvent(){
  say(['Βάζω το κλειδί στο καντράν. Μία, δύο, τρεις στροφές.','Σπρώχνω το εκκρεμές.','Τικ.'],()=>{
    S.clockRun=1; S.lock=1; sfx('tickLoud'); shake(1,2);
    after(.8,()=>{ sfx('tickLoud'); shake(.6,3); });
    after(1.5,()=>{ sfx('sting'); S.flash=1; shake(1,4); });
    after(2.3,()=>{ S.lock=0; go('dream',40,()=>after(.6,()=>whisper('Τικ…'))); });
  });
}
function wake(){ F.clockDone=1; S.lock=1; S.flash=1; sfx('sting');
  after(.4,()=>{ S.lock=0; go('hall',300,()=>say(['…','Είμαι στο χολ. Το ρολόι χτυπάει κανονικά.','Τα σεντόνια από τη σκάλα έχουν γλιστρήσει στο πάτωμα. Σαν να τα τράβηξε κάποιος.'])); }); }
function finalChoice(){
  say(['Γράφω. Καναπές. Δύο πολυθρόνες. Σερβίτσιο πορσελάνης. Βάζα με γλυκό: πενήντα δύο.','Εκκρεμές ρολόι, σε λειτουργία. Μόνο αυτό αξίζει όσο το μισό σπίτι.','Από κάτω ακούγεται το τικ-τακ. Σαν να περιμένει τι θα γράψω.'],()=>
    choose('Τι γράφω για το ρολόι;',[
      {t:'«Σε λειτουργία». Υπογράφω.', f:()=>ending('a')},
      {t:'Κατεβαίνω να το σταματήσω στις 3:17.', f:()=>ending('b')},
    ]));
}
const ENDINGS = {
  a:{h:'Πρώτο τέλος · Η απογραφή', p:['Το ρολόι φορτώθηκε σε ένα φορτηγάκι του Δημοσίου μαζί με άλλα διακόσια δεκατρία αντικείμενα. Χτυπούσε σε όλη τη διαδρομή.','Τον Μάρτιο πήρα προαγωγή.','Ξυπνάω κάθε βράδυ στις 3:17 και ακούω ένα τικ-τακ στο χολ μου.','Δεν έχω ρολόι στο χολ μου.']},
  b:{h:'Δεύτερο τέλος · Τρεις και δεκαεφτά', p:['Άνοιξα το γυάλινο πορτάκι και σταμάτησα το εκκρεμές με δύο δάχτυλα. Γύρισα τους δείκτες πίσω: τρεις και δεκαεφτά.','Η βροχή σταμάτησε. Από πάνω, η πολυθρόνα έτριξε μια τελευταία φορά, και ησύχασε.','Στο έντυπο έγραψα: «Εκκρεμές ρολόι, μη λειτουργικό. Άνευ αξίας.»','Ήταν το μόνο ψέμα που έγραψα ποτέ σε απογραφή.']},
};
function ending(k){
  S.lock=1; if(k==='b'){ S.clockRun=0; sfx('creak'); }
  fadeTo(1,1.6,()=>{ S.mode='end'; const e=ENDINGS[k]; $('endH').textContent=tr(e.h); const box=$('endT'); box.innerHTML='';
    e.p.forEach((t,i)=>{ const p=document.createElement('p'); p.textContent=tr(t); p.style.animationDelay=(.6+i*1.8)+'s'; box.appendChild(p); });
    $('endB').style.animationDelay=(1+e.p.length*1.8)+'s'; $('end').hidden=false; setUI(false); clearSave(); A.amb(); });
}

/* ---------- save ---------- */
const KEY='apografi2-save-v1';
function save(){ if(S.mode!=='play') return; try{ localStorage.setItem(KEY, JSON.stringify({scene:S.scene,x:S.x,inv:S.inv,F,clockRun:S.clockRun})); }catch(e){} }
function load(){ try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* ---------- inventory UI ---------- */
const invEl=$('inv'), slotsEl=$('slots'), capEl=$('invCap'), selEl=$('sel');
function renderInv(){ slotsEl.innerHTML='';
  S.inv.forEach(id=>{ const b=document.createElement('button'); b.className='slot'+(S.sel===id?' on':''); b.setAttribute('aria-label',tr(ITEMS[id].n)); b.appendChild(iconCanvas(id)); b.addEventListener('click',e=>{ e.stopPropagation(); invTap(id); }); slotsEl.appendChild(b); });
  $('bExam').disabled = !S.sel; }
function setSel(id){ S.sel=id; selEl.innerHTML=''; if(id && S.mode==='play'){ selEl.appendChild(iconCanvas(id)); const sp=document.createElement('span'); sp.textContent=tr(ITEMS[id].n); selEl.appendChild(sp); selEl.hidden=false; selEl.classList.remove('pop'); void selEl.offsetWidth; selEl.classList.add('pop'); } else selEl.hidden=true; }
function cycleItem(){ A.init(); if(D.active||S.mode!=='play'||S.trans) return; closeInv(); if(!S.inv.length) return;
  const i=S.sel?S.inv.indexOf(S.sel):-1; const n=i+1; const id=n>=S.inv.length?null:S.inv[n]; setSel(id); sfx(id?'tick':'step');
  if(!id) tip('Άδεια χέρια.',1200); }
function invTap(id){ A.init();
  if(S.sel && S.sel!==id){ const r=RECIPES[rkey(S.sel,id)];
    if(r){ const a=S.sel; take(a); take(id); give(r[0]); setSel(null); sfx('pick'); closeInv(); say([r[1]]); }
    else { setSel(null); capEl.textContent=tr('Αυτά τα δύο δεν συνδυάζονται.'); }
    renderInv(); return; }
  if(S.sel===id){ setSel(null); capEl.textContent=tr('Διάλεξε ένα αντικείμενο.'); }
  else { setSel(id); capEl.textContent=tr(ITEMS[id].n); }
  renderInv(); }
function openInv(){ if(S.mode!=='play'||D.active||S.trans) return; renderInv(); capEl.textContent=tr(S.sel?ITEMS[S.sel].n:'Διάλεξε ένα αντικείμενο. Πάτα δεύτερο για να τα συνδυάσεις.'); invEl.hidden=false; }
function closeInv(){ invEl.hidden=true; }
$('bInv').addEventListener('click',e=>{ e.stopPropagation(); A.init(); invEl.hidden?openInv():closeInv(); });
$('bClose').addEventListener('click',e=>{ e.stopPropagation(); closeInv(); });
$('bExam').addEventListener('click',e=>{ e.stopPropagation(); if(!S.sel) return; const it=ITEMS[S.sel]; closeInv(); say(it.d); });
selEl.addEventListener('click',e=>{ e.stopPropagation(); setSel(null); });

/* ---------- input ---------- */
const keys={l:0,r:0}, held={l:0,r:0};
function holdBtn(el,k){
  const on=e=>{ e.preventDefault(); A.init(); held[k]=1; el.classList.add('held'); try{ el.setPointerCapture(e.pointerId); }catch(_){} };
  const off=()=>{ held[k]=0; el.classList.remove('held'); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off);
}
holdBtn($('bL'),'l'); holdBtn($('bR'),'r');
$('bA').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); action(); });
$('bB').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); cycleItem(); });
stage.addEventListener('pointerdown',e=>{ A.init(); if(e.target.closest('button')||e.target.closest('#inv')) return; if(!$('menu').hidden){ $('menu').hidden=true; return; } if(D.active&&!D.opts) advance(); });
addEventListener('keydown',e=>{ const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A') keys.l=1;
  else if(k==='ArrowRight'||k==='d'||k==='D') keys.r=1;
  else if(k===' '||k==='Enter'||k==='e'||k==='E'){ e.preventDefault(); action(); }
  else if(k==='q'||k==='Q'||k==='b'||k==='B'||k==='Tab'){ e.preventDefault(); cycleItem(); }
  else if(k==='i'||k==='I'){ invEl.hidden?openInv():closeInv(); }
  else if(k==='Escape'){ closeInv(); setSel(null); } });
addEventListener('keyup',e=>{ const k=e.key; if(k==='ArrowLeft'||k==='a'||k==='A') keys.l=0; if(k==='ArrowRight'||k==='d'||k==='D') keys.r=0; });
const NOPE=['Δεν βγαίνει νόημα.','Όχι, δεν ταιριάζει εδώ.','Δεν νομίζω.','Αυτό δεν θα βοηθήσει.'];
function action(){ A.init(); if(!$('settings').hidden) return;
  if(D.active){ advance(); return; }
  if(S.mode!=='play'||S.lock||S.trans) return;
  closeInv();
  const h=S.near;
  if(S.sel){ const it=S.sel;
    if(!h){ say(['Δεν υπάρχει τίποτα εδώ για να το χρησιμοποιήσω. (B για άδεια χέρια)']); return; }
    if(!(h.use && h.use(it))) say([NOPE[(Math.random()*NOPE.length)|0]]);
    return; }
  if(h) h.act();
}

/* menu */
$('bMenu').addEventListener('click',e=>{ e.stopPropagation(); A.init(); $('menu').hidden=!$('menu').hidden; });
const PREF='apografi2-prefs-v1';
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(PREF))||{}; }catch(e){ return {}; } }
function savePrefs(){ try{ localStorage.setItem(PREF,JSON.stringify({ts:TS,sound:A.on,lang:LANG})); }catch(e){} }
function setLang(l){ LANG=l; document.documentElement.lang=l; document.title=tr('Απογραφή');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
  document.querySelectorAll('#lgRow button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lg===l)));
  $('sSound').textContent=tr('Ήχος: ')+tr(A.on?'ναι':'όχι'); if(S.sel) setSel(S.sel); lastHint=null; savePrefs(); }
let TS=1;
function setTS(v){ TS=v; stage.style.setProperty('--ts',v); document.querySelectorAll('#tsRow button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.ts===v))); savePrefs(); }
function openSettings(){ closeInv(); $('menu').hidden=true; $('sSound').textContent=tr('Ήχος: ')+tr(A.on?'ναι':'όχι'); $('settings').hidden=false; }
document.querySelectorAll('#tsRow button').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); setTS(+b.dataset.ts); }));
document.querySelectorAll('#lgRow button').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); setLang(b.dataset.lg); }));
$('mSet').addEventListener('click',e=>{ e.stopPropagation(); openSettings(); });
$('tSet').addEventListener('click',e=>{ e.stopPropagation(); openSettings(); });
$('sSound').addEventListener('click',e=>{ e.stopPropagation(); A.init(); A.setOn(!A.on); $('sSound').textContent=tr('Ήχος: ')+tr(A.on?'ναι':'όχι'); savePrefs(); });
$('sFull').addEventListener('click',e=>{ e.stopPropagation(); goFull(); });
$('sClose').addEventListener('click',e=>{ e.stopPropagation(); $('settings').hidden=true; });
$('settings').addEventListener('pointerdown',e=>e.stopPropagation());
(()=>{ const pr=loadPrefs(); if(pr.sound===false) A.on=false; setTS([1,1.3,1.6,2].includes(pr.ts)?pr.ts:1.3); setLang(pr.lang==='en'?'en':'el'); })();
$('mTitle').addEventListener('click',e=>{ e.stopPropagation(); $('menu').hidden=true; toTitle(); });
function goFull(){ const el=document.documentElement; try{ const p=(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); if(p&&p.then) p.then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(_){} }).catch(()=>{}); }catch(_){} }

/* title / end */
function setUI(on){ ['bL','bR','bA','bB','bInv','bMenu'].forEach(id=>$(id).style.display=on?'':'none'); if(!on){ selEl.hidden=true; $('hint').textContent=''; } }
function toTitle(){ S.mode='title'; closeInv(); D.active=false; D.opts=null; dlgEl.hidden=true; $('end').hidden=true; $('title').hidden=false; setUI(false);
  $('tCont').hidden=!load(); enter('street',200); S.fade=0; S.lock=0; S.trans=0; A.amb(); }
function startGame(data){ A.init(); $('title').hidden=true; setUI(true);
  S.fade=1; S.mode='play'; S.lock=0; timers.length=0;
  if(data){ F=data.F||{}; S.inv=data.inv||['form']; S.clockRun=data.clockRun||0; enter(data.scene,data.x); }
  else { F={}; S.inv=['form']; S.clockRun=0; enter('street',122); S.face=1; }
  setSel(null); renderInv();
  if(!data){ say(['Θεσσαλονίκη, Νοέμβριος 1987.','Με λένε Λευτέρη Σταθάκη. Είμαι εκτιμητής του Πρωτοδικείου.','Η δουλειά μου είναι να μετράω τι αφήνουν πίσω τους οι άνθρωποι.','Ευτέρπη Λάμπρου, ογδόντα ενός ετών. Χωρίς κληρονόμους. Το σπίτι περνάει στο Δημόσιο.','Μία απογραφή. Μία υπογραφή. Και μετά σπίτι μου.'],
      ()=>tip('Βέλη για κίνηση. A εξετάζει ή χρησιμοποιεί. B αλλάζει το αντικείμενο που κρατάς. Στην τσάντα συνδυάζεις.',8000)); }
  fadeTo(0,1.2);
}
$('tNew').addEventListener('click',e=>{ e.stopPropagation(); startGame(null); });
$('tCont').addEventListener('click',e=>{ e.stopPropagation(); startGame(load()); });
$('endB').addEventListener('click',e=>{ e.stopPropagation(); toTitle(); });

/* ---------- update ---------- */
function update(dt){
  for(let i=timers.length-1;i>=0;i--){ timers[i].t-=dt; if(timers[i].t<=0){ const f=timers[i].fn; timers.splice(i,1); f(); } }
  if(S.fadeDur){ S.fadeT+=dt; const k=Math.min(1,S.fadeT/S.fadeDur); S.fade=S.fadeFrom+(S.fadeTo-S.fadeFrom)*k; if(k>=1){ S.fadeDur=0; const cb=S.fadeCb; S.fadeCb=null; if(cb) cb(); } }
  if(D.active && !D.opts && D.shown<D.text.length){ D.shown=Math.min(D.text.length,D.shown+dt*46); dlgText.textContent=D.text.slice(0,Math.floor(D.shown)); }
  moreEl.style.visibility = D.active && !D.opts && D.shown>=D.text.length ? 'visible' : 'hidden';
  const s=SC[S.scene];
  S.lampI = Math.random()<.04 ? rand(.15,.5) : Math.min(1,S.lampI+dt*3);
  S.flick = Math.random()<.025 ? rand(.2,.6) : Math.min(1,S.flick+dt*4);
  if(s.storm && S.mode!=='end'){ S.lt-=dt; if(S.lt<=0){ S.lt=rand(8,17); S.flash=1; after(rand(.5,1.4),()=>sfx('thunder')); after(.12,()=>{ S.flash=Math.max(S.flash,.7); }); } }
  S.flash=Math.max(0,S.flash-dt*2.4); S.shk=Math.max(0,S.shk-dt);
  if(S.ghost){ S.ghost.t-=dt; if(S.ghost.t<=0) S.ghost=null; }

  S.moving=false;
  if(S.mode==='play' && !D.active && !S.lock && !S.trans && $('settings').hidden){
    const dir=(keys.r||held.r)-(keys.l||held.l);
    if(dir){ const sp=s.dream?30:40; const nx=clamp(S.x+dir*sp*dt,s.minX||14,s.w-14);
      if(nx!==S.x){ S.moving=true; const before=Math.floor(S.phase/Math.PI); S.phase+=dt*sp*.24; if(Math.floor(S.phase/Math.PI)!==before) sfx('step'); }
      S.x=nx; S.face=dir; }
    if(s.update) s.update(dt);
    if(S.scene==='hall' && S.clockRun){ S.tickT-=dt; if(S.tickT<=0){ S.tickT=1; sfx('tick'); } }
    if(S.scene==='bedroom'){ S.creakT-=dt; if(S.creakT<=0){ S.creakT=rand(2.2,4); sfx('creak'); } }
  }
  if(S.mode==='title'){ S.cam=170+Math.sin(T*.08)*60; }
  else { const tx=clamp(S.x-W/2,0,s.w-W); S.cam+= (tx-S.cam)*Math.min(1,dt*5); }

  let near=null, nd=1e9;
  if(S.mode==='play' && !S.trans) for(const h of s.hs){ const d=Math.abs(S.x-h.x); if(d<=h.r && d<nd){ nd=d; near=h; } }
  S.near=near;
  const hint = S.mode!=='play'||D.active ? '' : near ? (S.sel ? tr(near.n)+tr(' · A για χρήση') : tr(near.n)) : '';
  if(hint!==lastHint){ $('hint').textContent=hint; lastHint=hint; }
  const live=!!(near||D.active);
  if(live!==lastLive){ $('bA').classList.toggle('live',live); lastLive=live; }
}

/* ---------- render ---------- */
let lastCam=0;
function render(dt){
  const s=SC[S.scene];
  const sx = S.shk>0 ? Math.round((Math.random()-.5)*2*S.shkA) : 0, sy = S.shk>0 ? Math.round((Math.random()-.5)*S.shkA) : 0;
  const cam=Math.round(S.cam);
  ctx.save(); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.translate(-cam+sx,sy);
  ctx.drawImage(s.img,0,0);
  if(s.dyn) s.dyn(ctx);
  if(!s.outdoor){ ctx.fillStyle='#e6dcc4'; for(const m of motes){ m.x+=m.vx*dt/s.w; m.y+=m.vy*dt+Math.sin(T+m.p)*.02; if(m.x<0)m.x+=1; if(m.x>1)m.x-=1; if(m.y<18)m.y=140; if(m.y>146)m.y=20; ctx.globalAlpha=.25+.2*Math.sin(T*1.3+m.p); ctx.fillRect(Math.round(m.x*s.w),Math.round(m.y),1,1); } ctx.globalAlpha=1; }
  let flame=null;
  if(S.mode!=='title') flame=drawPlayer(ctx,S.x,FLOOR);
  if(s.dream && !F.dwFig) drawFigure(ctx,760,FLOOR,.95,false);
  if(s.fore) s.fore(ctx);
  ctx.restore();

  // lighting (drawn smooth in HD)
  const L=s.lights().slice();
  if(flame){ const fl=.9+Math.random()*.1; L.push({x:flame.x,y:flame.y,r:64*fl,i:.97,c:[255,170,90]}); }
  const dark=s.dark*(1-S.flash*(s.outdoor?.75:.45));
  if(flame){ const fx=flame.x-cam+sx, fy=flame.y+sy, w=Math.random()<.5?0:1; R(ctx,fx,fy-4-w,1,3+w,'#f4c868'); R(ctx,fx,fy-2,1,1,'#fff6d0'); R(ctx,fx-1,fy-2,1,1,'#e0903a'); }
  if(S.near && !D.active && S.mode==='play'){ const h=S.near, mx=h.x-cam+sx, my=(h.my||108)+Math.round(Math.sin(T*4))+sy; ctx.fillStyle='rgba(230,222,200,.9)'; ctx.fillRect(mx,my-1,1,3); ctx.fillRect(mx-1,my,3,1); }
  if(s.dream){ tg.drawImage(cv,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    for(let y=0;y<H;y+=2){ const o=Math.sin(y*.08+T*2.4)*1.8; ctx.drawImage(tmp,0,y,W,2,o,y,W,2); }
    ctx.globalAlpha=.22; ctx.drawImage(tmp,2,0); ctx.globalAlpha=1; ctx.fillStyle='rgba(110,0,0,.16)'; ctx.fillRect(0,0,W,H); }
  compositeA(dt,s,cam,L,dark);
  if(S.ghost){ const k=OW/320; octx.save(); octx.setTransform(k,0,0,k,0,0); octx.imageSmoothingEnabled=false; tg.clearRect(0,0,W,H); drawFigure(tg,S.ghost.x-cam,FLOOR,1,true); octx.drawImage(tmp,0,0); octx.restore(); }
}

/* ---------- loop & layout ---------- */
let last=performance.now();
function loop(now){ const dt=clamp((now-last)/1000,0,.05); last=now; T+=dt; update(dt); render(dt); requestAnimationFrame(loop); }
function fit(){ const wr=$('wrap'); const vw=wr.clientWidth, vh=wr.clientHeight; const k=Math.min(vw/W,vh/H); const w=Math.floor(W*k), h=Math.floor(H*k);
  stage.style.width=w+'px'; stage.style.height=h+'px'; stage.style.setProperty('--u',(h/180)+'px'); fitHD(w); }
addEventListener('resize',fit); if(window.visualViewport) visualViewport.addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ keys.l=keys.r=held.l=held.r=0; if(A.c) A.c.suspend(); } else if(A.c) A.c.resume(); });
fit(); toTitle(); requestAnimationFrame(loop);
</script>







<script id="gfx">
/* ===== GFX+ — engine-independent graphics pack =====
   Works on any of our builds (needs: render(), a composite*() HD pass, SC[*].img backgrounds, S.cam, cv, octx, OW/OH).
   Each background is split automatically into FAR (sky and sea, found by flood-fill from the top row and from the sea band,
   so blue doors/windows/domes inside buildings are NOT taken) and NEAR (everything else). Every frame:
   far (45% parallax, palette-cycled sea, heat shimmer) → drifting clouds → boat → birds → near.
   HD post: soft bloom, horizon haze, indoor dust motes, optional CRT. A frame-time monitor lowers quality on its own. */
(()=>{
  const KEY='gfx-'+((typeof G!=='undefined'&&G.key)||document.title||'game').replace(/\s+/g,'-');
  const P=(()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
  const GX={on:P.on!==false, crt:!!P.crt, lvl:2, ft:[], st:{}};
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({on:GX.on,crt:GX.crt})); }catch(e){} };

/* ---------- drawing kit (low-res 320×180, integer pixels) ---------- */
const CK={
  R:(g,x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); },
  disc(g,x,y,r,c){ g.fillStyle=c; for(let dy=-r;dy<=r;dy++){ const w=Math.round(Math.sqrt(r*r-dy*dy)); g.fillRect(Math.round(x-w),Math.round(y+dy),w*2+1,1); } },
  ell(g,x,y,rx,ry,c){ g.fillStyle=c; for(let dy=-ry;dy<=ry;dy++){ const w=Math.round(rx*Math.sqrt(1-(dy*dy)/(ry*ry||1))); g.fillRect(Math.round(x-w),Math.round(y+dy),w*2+1,1); } },
  sky(g,y0,y1,cols){ const n=cols.length-1; for(let y=y0;y<y1;y++){ const f=(y-y0)/(y1-y0)*n, i=Math.min(n-1,Math.floor(f)), u=f-i; const a=CK.hex(cols[i]), b=CK.hex(cols[i+1]); g.fillStyle='rgb('+Math.round(a[0]+(b[0]-a[0])*u)+','+Math.round(a[1]+(b[1]-a[1])*u)+','+Math.round(a[2]+(b[2]-a[2])*u)+')'; g.fillRect(0,y,320,1); } },
  hex:h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],
  hills(g,base,amp,fr,col,ph,w){ g.fillStyle=col; for(let x=0;x<(w||320);x++){ const h=amp*(.6+.4*Math.sin(x*fr+ph)+.25*Math.sin(x*fr*3.1+ph*2)); g.fillRect(x,Math.round(base-h),1,Math.round(h)+200); } },
  rnd(seed){ let s=seed>>>0||1; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); },
  skyline(g,base,seed,col,win,off){ const r=CK.rnd(seed); let x=-((off||0)%40); while(x<330){ const w=12+r()*22, h=20+r()*50; CK.R(g,x,base-h,w,h+200,col); if(win) for(let yy=base-h+4;yy<base-4;yy+=6) for(let xx=x+3;xx<x+w-3;xx+=5) if(r()<.35) CK.R(g,xx,yy,2,3,win); x+=w+1; } },
  stars(g,n,t,seed){ const r=CK.rnd(seed||7); for(let i=0;i<n;i++){ const x=r()*320, y=r()*90, a=.5+.5*Math.sin(t*2+i); g.globalAlpha=a; CK.R(g,x,y,1,1,'#fff'); } g.globalAlpha=1; },
  sea(g,y0,cols,t,glit){ CK.sky(g,y0,180,cols); if(glit){ for(let i=0;i<60;i++){ const x=(i*53+t*20*(i%3+1))%330, y=y0+3+(i*17)%(180-y0-4); CK.R(g,x,y,3+(i%3),1,glit); } } },
  rain(g,t,n,col){ g.fillStyle=col||'rgba(180,200,230,.6)'; for(let i=0;i<(n||120);i++){ const x=(i*37+t*60)%340-10, y=(i*91+t*420)%200-10; g.fillRect(Math.round(x),Math.round(y),1,4); } },
  fig(g,x,y,h,col,o={}){ const hw=Math.max(2,Math.round(h*.12)); CK.R(g,x-hw,y-h*.62,hw*2,h*.42,col); CK.R(g,x-hw+1,y-h*.22,hw-1,h*.22,col); CK.R(g,x+1,y-h*.22,hw-1,h*.22,col); CK.disc(g,x,y-h*.75,Math.max(2,Math.round(h*.11)),o.head||col); if(o.hair) CK.R(g,x-hw,y-h*.88,hw*2,Math.max(2,h*.08),o.hair); if(o.long) CK.R(g,x-hw-1,y-h*.82,3,h*.4,o.hair||col); },
  face(g,x,y,s,o){ const S=v=>Math.round(v*s); CK.R(g,x-S(9),y-S(11),S(18),S(22),o.skin); CK.R(g,x-S(9),y-S(11),S(3),S(22),o.skinD||o.skin); if(o.hair){ CK.R(g,x-S(11),y-S(15),S(22),S(7),o.hair); if(o.long){ CK.R(g,x-S(13),y-S(11),S(4),S(26),o.hair); CK.R(g,x+S(9),y-S(11),S(4),S(26),o.hair); } }
    const bl=o.blink; CK.R(g,x-S(5),y-S(2),S(3),bl?1:S(3),o.eye||'#1a1a2a'); CK.R(g,x+S(2),y-S(2),S(3),bl?1:S(3),o.eye||'#1a1a2a'); if(!bl){ CK.R(g,x-S(5),y-S(2),1,1,'#fff'); CK.R(g,x+S(2),y-S(2),1,1,'#fff'); } if(o.beard) CK.R(g,x-S(8),y+S(4),S(16),S(9),o.beard); CK.R(g,x-S(3),y+S(6),S(6),1,o.mouth||'#8a3a3a'); if(o.tear) CK.R(g,x-S(5),y+S(1)+((o.tear*20)%S(8)),1,2,'#bfe8ff'); },
  title(o,txt,y,size,col,a){ o.save(); o.globalAlpha=a===undefined?1:a; o.textAlign='center'; o.font='700 '+size+'px "EB Garamond", "Comfortaa", serif'; o.lineWidth=size/5; o.strokeStyle='rgba(0,0,0,.8)'; o.strokeText(txt,160,y); o.fillStyle=col||'#fff'; o.fillText(txt,160,y); o.restore(); },
  glow(o,x,y,r,rgb,a){ const gr=o.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba('+rgb+','+a+')'); gr.addColorStop(1,'rgba('+rgb+',0)'); o.save(); o.globalCompositeOperation='lighter'; o.fillStyle=gr; o.fillRect(x-r,y-r,r*2,r*2); o.restore(); },
  beams(o,t,rgb,a,n){ o.save(); o.globalCompositeOperation='lighter'; for(let i=0;i<(n||6);i++){ const x=i*60-20+Math.sin(t*.5+i)*14, w=14+6*Math.sin(t+i); const gr=o.createLinearGradient(0,0,0,180); gr.addColorStop(0,'rgba('+rgb+','+a+')'); gr.addColorStop(1,'rgba('+rgb+',0)'); o.fillStyle=gr; o.beginPath(); o.moveTo(x,0); o.lineTo(x+w,0); o.lineTo(x+w+60,180); o.lineTo(x+30,180); o.fill(); } o.restore(); },
  vign(o,a,rgb){ const gr=o.createRadialGradient(160,90,60,160,90,200); gr.addColorStop(0,'rgba('+(rgb||'0,0,0')+',0)'); gr.addColorStop(1,'rgba('+(rgb||'0,0,0')+','+a+')'); o.fillStyle=gr; o.fillRect(0,0,320,180); },
  tint(o,rgb,a,mode){ o.save(); o.globalCompositeOperation=mode||'soft-light'; o.fillStyle='rgba('+rgb+','+a+')'; o.fillRect(0,0,320,180); o.restore(); },
  flash(o,a){ if(a>0){ o.fillStyle='rgba(255,255,255,'+a+')'; o.fillRect(0,0,320,180); } },
  portrait(g,id,x,y,s,talk,blink){ if(typeof PTD==='undefined'||!PTD[id]) return false; const c=CK._pc||(CK._pc=document.createElement('canvas')); c.width=42; c.height=42; const x2=c.getContext('2d'); x2.imageSmoothingEnabled=false; try{ PTD[id](x2,!!talk,!!blink); }catch(e){ return false; } g.imageSmoothingEnabled=false; g.drawImage(c,Math.round(x-21*s),Math.round(y-21*s),Math.round(42*s),Math.round(42*s)); return true; },
  bokeh(o,t,n,rgb,a,seed){ const r=CK.rnd(seed||5); o.save(); o.globalCompositeOperation='lighter'; for(let i=0;i<n;i++){ const x=(r()*360+t*(4+r()*10))%360-20, y=r()*180+Math.sin(t*.7+i)*6, rr=3+r()*9; const gr=o.createRadialGradient(x,y,0,x,y,rr); gr.addColorStop(0,'rgba('+rgb+','+(a*(.5+.5*Math.sin(t*1.3+i)))+')'); gr.addColorStop(.7,'rgba('+rgb+','+(a*.3)+')'); gr.addColorStop(1,'rgba('+rgb+',0)'); o.fillStyle=gr; o.fillRect(x-rr,y-rr,rr*2,rr*2); } o.restore(); },
  rim(o,x,y,w,h,rgb,a){ o.save(); o.globalCompositeOperation='lighter'; const gr=o.createLinearGradient(x,y,x+w,y); gr.addColorStop(0,'rgba('+rgb+','+a+')'); gr.addColorStop(.25,'rgba('+rgb+',0)'); o.fillStyle=gr; o.fillRect(x,y,w,h); o.restore(); },
  card(o,txt,y,size,col,a,glow){ o.save(); o.globalAlpha=a===undefined?1:a; o.textAlign='center'; o.font='700 '+size+'px "EB Garamond","Comfortaa",serif'; if(glow){ o.shadowColor='rgba('+glow+',.9)'; o.shadowBlur=size*.8; } o.fillStyle=col||'#fff'; o.fillText(txt,160,y); o.shadowBlur=0; o.restore(); },
};

  document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#tNew'); if(!b||bypass||CINE.busy()) return; e.stopImmediatePropagation(); e.preventDefault(); try{ if(typeof A!=='undefined'&&A.init) A.init(); }catch(_){}
    CINE.play(cfg.intro,()=>{ bypass=true; b.click(); bypass=false; },cfg.introMood); },true);

  const end=$$('end'); if(end) new MutationObserver(()=>{ if(end.hidden||end.dataset.cine==='1'||end.classList.contains('over')) return; end.dataset.cine='1'; end.style.visibility='hidden';

    {d:6,cap:['Αιγαίο, καλοκαίρι 1988.','The Aegean, summer 1988.'],low(g,t,p){ C.sky(g,0,100,['#3a98ff','#b2e2ff']); C.hills(g,100,26,.02,'#c8b890',1); whiteHouses(g,92,5,true); C.sea(g,100,['#2b8de8','#1a5ab8'],t,'#ffffff'); const x=-60+p*150; C.R(g,x,112,70,10,'#f4f4f4'); C.R(g,x+8,104,40,8,'#f4f4f4'); C.R(g,x+30,96,8,8,'#e8463a'); C.R(g,x,120,70,3,'#1a3a8a'); for(let i=0;i<3;i++){ const bx=60+i*70+Math.sin(t*2+i)*10, by=40+i*8+Math.sin(t*3+i)*4; C.R(g,bx-4,by,4,1,'#fff'); C.R(g,bx+1,by,4,1,'#fff'); } },
     hd(o,t){ C.glow(o,262,26,50,'255,240,180',.6); C.title(o,CINE.L(['Ο Λουκουμάς στο Αλμυρίκι','Loukoumas on Almyriki']),64,18,'#ffd23f',Math.min(1,t/1.5)); }},
    {d:6,cap:['Ο Τάκης Λουκουμάς, λογιστής, ήρθε για ήλιο, θάλασσα… και έρωτα.','Takis Loukoumas, accountant, came for sun, sea… and love.'],low(g,t,p){ C.sky(g,0,180,['#7ac8ff','#d8f0ff']); C.R(g,0,120,320,60,'#f4f4f4'); C.R(g,0,118,320,3,'#1a3a8a'); C.fig(g,150,150,46,'#3a3a46',{head:'#eab58c',hair:'#2a1a12'}); C.R(g,166,128,16,14,'#8a4a2a'); const sx=p<.5?200-p*80:160+(p-.5)*400, sy=p<.5?60+p*60:90-(p-.5)*160; C.R(g,sx-6,sy,6,2,'#fff'); C.R(g,sx+1,sy,6,2,'#fff'); C.R(g,sx,sy+1,3,3,'#fff'); if(p>.5) C.disc(g,sx+2,sy+6,3,'#d8a050'); else C.disc(g,142,126,3,'#d8a050'); }},
    {d:5,cap:['Και το Σάββατο: ο μεγάλος διαγωνισμός χορού. Η Δανάη θα είναι εκεί.','And on Saturday: the big dance contest. Danae will be there.'],low(g,t,p){ C.R(g,0,0,320,180,'#f4f0e8'); g.save(); const s=1+p*.1; g.translate(160,90); g.scale(s,s); g.translate(-160,-90); C.R(g,90,20,140,140,'#e0338a'); C.R(g,100,30,120,120,'#ffd23f'); C.R(g,110,40,100,20,'#2b1d3a'); for(let i=0;i<5;i++){ C.disc(g,130+i*15,110,5+Math.sin(t*4+i)*2,['#e8463a','#3a7ad8','#3fae4a','#ff8a2a','#9a5ab8'][i]); } g.restore(); },hd(o,t){ C.title(o,CINE.L(['ΔΙΑΓΩΝΙΣΜΟΣ ΧΟΡΟΥ','DANCE CONTEST']),56,12,'#ffd23f',1); }},
  ],
  mid:[
    {d:5,cap:['Ο ήλιος βούτηξε στη θάλασσα. Το Αλμυρίκι άναψε.','The sun dipped into the sea. Almyriki lit up.'],low(g,t,p){ const c=p<.5?['#ff8a4a','#ffc070']:['#1a1a4a','#5a3a7a']; C.sky(g,0,100,c); C.hills(g,100,26,.02,p<.5?'#8a6a5a':'#1a1a2a',1); whiteHouses(g,92,5,p<.5); C.sea(g,100,p<.5?['#e87a4a','#5a3a7a']:['#1a1a3a','#0a0a1a'],t,p<.5?'#ffd090':'#ffd890'); },hd(o,t,p){ if(p<.5) C.glow(o,250,98-p*40,40,'255,180,90',.6); else C.glow(o,230,80,60,'255,80,200',.3*Math.sin(t*6)+.3); }},
    {d:5,cap:['Στη ντισκοτέκ, οι μπάλες-καθρέφτες γύρισαν. Ήρθε η ώρα.','At the disco, the mirror balls began to spin. It was time.'],low(g,t){ C.R(g,0,0,320,180,'#140a24'); for(let i=0;i<8;i++) for(let j=0;j<5;j++) C.R(g,40+i*30,110+j*14,28,12,['#e0338a','#3a7ad8','#ffd23f','#3fae4a'][(i+j+Math.floor(t*4))%4]); C.disc(g,160,30,12,'#c8c8d8'); },hd(o,t){ for(let i=0;i<6;i++){ const a=t*1.5+i; C.glow(o,160+Math.cos(a)*120,90+Math.sin(a*1.3)*50,30,['255,80,200','80,180,255','255,230,80'][i%3],.35); } C.glow(o,160,30,24,'255,255,255',.5); }},
  ],
  ending:()=>[
    {d:6,cap:['Πυροτεχνήματα πάνω από τον κόλπο. Το νησί χειροκροτούσε.','Fireworks over the bay. The whole island was cheering.'],low(g,t){ C.sky(g,0,110,['#0a0a2a','#2a1a4a']); C.hills(g,110,24,.02,'#0a0a1a',1); whiteHouses(g,104,5,false); C.sea(g,110,['#1a1a3a','#05050f'],t,'#ffd890'); },hd(o,t){ for(let i=0;i<5;i++){ const ph=(t*.7+i*.37)%1, x=40+i*60, y=30+(i%2)*20; for(let k=0;k<12;k++){ const a=k/12*6.28; C.glow(o,x+Math.cos(a)*ph*30,y+Math.sin(a)*ph*30+ph*ph*10,5,['255,80,120','255,220,80','120,200,255'][i%3],(1-ph)*.8); } } }},
    {d:6,cap:['Ο Τάκης κέρδισε τον διαγωνισμό. Και κάτι πολύ πιο σημαντικό.','Takis won the contest. And something far more important.'],low(g,t){ C.R(g,0,0,320,180,'#140a24'); for(let i=0;i<8;i++) for(let j=0;j<4;j++) C.R(g,40+i*30,124+j*14,28,12,['#e0338a','#3a7ad8','#ffd23f','#3fae4a'][(i+j+Math.floor(t*4))%4]); const b=Math.sin(t*6)*3; C.fig(g,145,124+b,50,'#2b1d3a',{head:'#eab58c',hair:'#2a1a12'}); C.fig(g,175,124-b,46,'#e0338a',{head:'#f0c8a0',hair:'#ffd23f',long:true}); },hd(o,t){ C.glow(o,160,30,30,'255,255,255',.4); C.glow(o,160,90,60,'255,120,200',.25); C.title(o,CINE.L(['Τέλος','The End']),40,16,'#ffd23f',Math.min(1,t/3)); }},
  ]}; }

function CS_peripoliko(){ return { introMood:'police', midMood:'police', endMood:'police', midWhen:()=>S.scene==='street',
  intro:[
    {d:6,cap:['Ακτή, 1989. Πέντε και μισή το πρωί.','Akti, 1989. Half past five in the morning.'],low(g,t,p){ C.sky(g,0,120,['#1a2a5a','#8a7aa8','#ffb08a']); C.skyline(g,120,9,'#2a2a4a','#ffe090'); C.R(g,0,120,320,60,'#4a4a5a'); C.R(g,110,70,100,50,'#5a6a8a'); C.R(g,110,66,100,6,'#3a4a6a'); C.R(g,140,74,40,8,'#f4f4f4'); C.R(g,150,96,20,24,'#2a3a5a'); },hd(o,t){ o.save(); o.font='700 6px sans-serif'; o.textAlign='center'; o.fillStyle='#1a2a6a'; o.fillText(CINE.L(['ΑΣΤΥΝΟΜΙΑ','POLICE']),160,80.5); o.restore(); C.title(o,CINE.L(['Περιπολικό 7','Patrol Car 7']),40,22,'#ffffff',Math.min(1,t/1.5)); C.glow(o,300,118,70,'255,190,130',.35); }},
    {d:5.5,cap:['Η πρώτη βάρδια του αστυφύλακα Άρη Μαυρίδη.','Officer Aris Mavridis\'s first shift.'],low(g,t,p){ C.R(g,0,0,320,180,'#2a3a5a'); g.save(); g.translate(160,90); const s=1.2+p*.3; g.scale(s,s); C.disc(g,0,0,30,'#c8a040'); C.disc(g,0,0,24,'#e8c860'); C.R(g,-6,-12,12,24,'#1a2a6a'); C.R(g,-3,-6,6,3,'#ffffff'); g.restore(); },hd(o,t){ const x=(t*60)%400-40; C.glow(o,x,70,30,'255,255,255',.5); C.title(o,'7',100,22,'#ffffff',.9); }},
    {d:5,cap:['Κανονισμός, υπομονή, ψυχραιμία. Και κανένα λάθος.','Regulations, patience, composure. And no mistakes.'],low(g,t,p){ C.R(g,0,0,320,180,'#1a1a22'); for(let i=0;i<6;i++){ C.R(g,30+i*45,40,40,110,i===3?'#5a6a7a':'#3a4a5a'); C.R(g,62+i*45,90,3,8,'#c8c8c8'); } C.R(g,0,150,320,30,'#2a2a30'); },hd(o,t){ const on=t>1&&(t>1.6||Math.sin(t*40)>0); if(on){ C.glow(o,160,10,140,'220,240,255',.35); } C.title(o,'7',70,10,'#ffffff',1); }},
  ],
  mid:[
    {d:5.5,cap:['Περιπολικό 7, σε περιπολία. Το κέντρο ακούει.','Patrol Car 7, on patrol. Dispatch is listening.'],low(g,t,p){ C.sky(g,0,110,['#5a9ad8','#c8e0f0']); C.skyline(g,110,4,'#8a9ab8','#ffffff',t*30); C.R(g,0,110,320,70,'#4a4a52'); for(let i=0;i<10;i++) C.R(g,(i*40-t*120)%360+360-40,142,20,2,'#e8e8e8'); carSide(g,130,150,'#f4f4f4',['#ff3030','#3060ff']); C.R(g,130,144,40,2,'#1a3a8a'); },hd(o,t){ const a=Math.sin(t*12)>0; C.glow(o,146,134,30,a?'255,40,40':'40,80,255',.6); }},
  ],
  ending:()=>[
    {d:6,cap:['Το περιπολικό γύρισε στο τμήμα με τη δύση του ήλιου.','The patrol car came back to the station at sunset.'],low(g,t){ C.sky(g,0,120,['#2a2a5a','#c86a6a','#ffb070']); C.skyline(g,120,9,'#2a2030','#ffe090'); C.R(g,0,120,320,60,'#3a3440'); C.R(g,110,70,100,50,'#4a4a6a'); carSide(g,40,150,'#e8e8e8'); },hd(o){ C.glow(o,260,118,80,'255,170,110',.4); }},
    {d:6,cap:['Αναφορά υπογεγραμμένη. Ο κανονισμός τηρήθηκε. Τέλος βάρδιας.','Report signed. Regulations followed. End of shift.'],low(g,t,p){ C.R(g,0,0,320,180,'#3a2a1a'); C.R(g,90,30,140,120,'#f0e8d8'); for(let i=0;i<9;i++) C.R(g,104,46+i*9,100-(i%3)*18,2,'#4a4a5a'); if(p>.4){ g.save(); g.translate(190,128); g.rotate(-.2); C.R(g,-24,-8,48,16,'rgba(40,60,160,.75)'); g.restore(); } },hd(o,t){ C.title(o,CINE.L(['Τέλος βάρδιας','End of shift']),24,12,'#ffffff',Math.min(1,t/2)); }},
  ]}; }

function CS_kokkino(){ return { introMood:'tale', midMood:'tale', endMood:'tale', midWhen:()=>S.scene==='forest',
  intro:[
    {d:5.5,cap:['Μια φορά κι έναν καιρό…','Once upon a time…'],low(g,t,p){ C.R(g,0,0,320,180,'#8a5a3a'); for(let i=0;i<12;i++) C.R(g,0,i*16,320,1,'#7a4a2a'); const w=Math.max(4,140*(1-Math.max(0,p-.6)*2.5)); C.R(g,160-w/2-4,26,w+8,130,'#5a1a1a'); C.R(g,160-w/2,30,w,122,'#c8302a'); if(w>60) C.disc(g,160,80,22,'#e8e0d0'); },hd(o,t,p){ if(p<.6) C.title(o,CINE.L(['Η Κοκκινοσκουφίτσα','Little Red Riding Hood']),130,13,'#ffe8b0',1); C.glow(o,160,70,120,'255,220,160',.15); }},
    {d:6,cap:['…ζούσε ένα κοριτσάκι που φορούσε πάντα μια κόκκινη κάπα.','…there lived a little girl who always wore a red cape.'],low(g,t,p){ C.sky(g,0,110,['#8fd5ff','#e2f6ff']); C.hills(g,110,20,.02,'#7ac860',2); C.R(g,0,110,320,70,'#86cc5c'); C.R(g,40,70,50,40,'#f4e8d0'); g.fillStyle='#c8302a'; g.beginPath(); g.moveTo(34,72); g.lineTo(65,48); g.lineTo(96,72); g.fill(); C.R(g,58,86,12,24,'#8a5a2a'); for(let i=0;i<14;i++) C.disc(g,(i*29)%320,130+(i*13)%40,2,['#ff6a8a','#ffe066','#ffffff'][i%3]); const x=120+p*80; C.fig(g,x,150,30,'#e0262f',{head:'#ffe3cf',hair:'#e0262f'}); },hd(o){ C.glow(o,280,30,60,'255,240,180',.5); }},
    {d:5,cap:['Μια μέρα, η μαμά της είπε: «Η γιαγιά είναι άρρωστη. Πήγαινέ της κουλουράκια.»','One day, her mum said: "Grandma is poorly. Take her some cookies."'],low(g,t){ C.R(g,0,0,320,180,'#f4e8d0'); C.R(g,0,130,320,50,'#c98a4f'); C.fig(g,120,140,56,'#3fae6e',{head:'#ffe3cf',hair:'#8a4a2a'}); C.fig(g,190,140,34,'#e0262f',{head:'#ffe3cf',hair:'#e0262f'}); C.R(g,200,118,14,10,'#c8903a'); },hd(o){ C.glow(o,160,60,100,'255,220,160',.2); }},
  ],
  mid:[
    {d:5,cap:['Το δάσος ήταν μεγάλο και πράσινο, γεμάτο πουλάκια και πεταλούδες.','The forest was big and green, full of birds and butterflies.'],low(g,t){ C.R(g,0,0,320,180,'#3a7a4a'); for(let i=0;i<9;i++){ C.R(g,i*38,20,12,160,'#5a3a2a'); C.disc(g,i*38+6,30,26,'#2f6a3a'); } C.R(g,0,140,320,40,'#5a9a4a'); for(let i=0;i<4;i++){ const x=(i*80+t*30)%340, y=100+Math.sin(t*3+i)*10; C.R(g,x,y,3,2,'#ffe066'); C.R(g,x+3,y-1,2,4,'#ff8ab0'); } },hd(o,t){ C.beams(o,t,'255,240,170',.18,6); }},
    {d:5,cap:['Μα πίσω από έναν θάμνο, δύο κίτρινα μάτια παρακολουθούσαν… Ποιος να ’ναι άραγε;','But behind a bush, two yellow eyes were watching… Who could it be?'],low(g,t){ C.R(g,0,0,320,180,'#1a3a2a'); C.ell(g,160,110,90,40,'#2a5a3a'); C.ell(g,140,100,60,30,'#346a44'); const bl=(t%2.4)<.15; C.R(g,140,96,8,bl?1:6,'#ffd23f'); C.R(g,166,96,8,bl?1:6,'#ffd23f'); if(!bl){ C.R(g,143,98,2,3,'#1a1a1a'); C.R(g,169,98,2,3,'#1a1a1a'); } },hd(o){ C.glow(o,157,99,30,'255,220,80',.25); C.vign(o,.6); }},
  ],
  ending:()=>[
    {d:6,cap:['Και όλοι μαζί έκαναν ένα μεγάλο πάρτι στο σπιτάκι της γιαγιάς!','And they all had a big party at Grandma\'s cottage!'],low(g,t){ C.R(g,0,0,320,180,'#f4d8b0'); C.R(g,0,130,320,50,'#c98a4f'); const b=Math.sin(t*6)*3; C.fig(g,90,150+b,30,'#e0262f',{head:'#ffe3cf',hair:'#e0262f'}); C.fig(g,140,150-b,46,'#9a5ab8',{head:'#ffe3cf',hair:'#e8e8e8'}); C.fig(g,195,150+b,56,'#7a5a2a',{head:'#ffe3cf',hair:'#7a4a2a'}); C.fig(g,250,150-b,44,'#8a8a9a',{head:'#9a9aaa'}); for(let i=0;i<40;i++){ const x=(i*29+t*30*(i%3+1))%320, y=(i*47+t*60)%180; C.R(g,x,y,2,2,['#e0262f','#ffd23f','#3fae6e','#4aa8ff'][i%4]); } },hd(o){ C.glow(o,160,40,100,'255,230,160',.3); }},
    {d:5,cap:['Και ο λύκος; Έμαθε να ζητάει συγγνώμη. Και να τρώει κουλουράκια.','And the wolf? He learned to say sorry. And to eat cookies.'],low(g,t,p){ C.R(g,0,0,320,180,'#8a5a3a'); const w=Math.max(4,140*Math.min(1,p*1.6)); C.R(g,160-w/2-4,26,w+8,130,'#5a1a1a'); C.R(g,160-w/2,30,w,122,'#c8302a'); },hd(o,t,p){ if(p>.5) C.title(o,CINE.L(['Τέλος','The End']),96,18,'#ffe8b0',Math.min(1,(p-.5)*3)); }},
  ]}; }

cineInstall(CS_apografi());
})();
