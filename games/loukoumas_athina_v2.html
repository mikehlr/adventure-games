r own voice. Something you wrote yourself might help too…", "Πες της την αλήθεια σε κάθε ερώτηση.": "Tell her the truth at every question.", "Το φιλμ μάσησε.": "The film got chewed up.", "Κάτι που κουβαλάς από το ’88…": "Something you’ve carried since ’88…", "Χρησιμοποίησε το μολύβι στη μηχανή προβολής.": "Use the pencil on the projector.", "Η Ζωή περιμένει μια απάντηση.": "Zoe is waiting for an answer.", "Όχι frame. Όχι points.": "No frame. No points.", "Πες της την αλήθεια.": "Tell her the truth.", "Κυψέλη": "Kypseli", "Μετρό": "Metro", "Συρμός": "Train", "Σεμινάριο": "Seminar", "Βιβλιοπωλείο": "Bookshop", "Κολωνάκι": "Kolonaki", "Γκάζι": "Gazi", "Θερινός": "Summer cinema", "Λυκαβηττός": "Lycabettus", "Τσίχλα του 1988": "Gum from 1988", "Ροζ, σκληρή σαν λόγος του Λύκου. Αλλά κολλάει ακόμα.": "Pink, hard as the Wolf’s word. But it still sticks.", "Μολύβι-καλάμι": "Pencil fishing rod", "Μολύβι με τσίχλα στην άκρη. Τεχνολογία αιχμής του ’88.": "A pencil with gum on the end. Cutting-edge technology from ’88.", "Το δικό σου κεφάλαιο": "Your own chapter", "Στο τέλος του Εγχειριδίου έγραψες με μολύβι: «Κεφάλαιο 1: Να είσαι ο εαυτός σου. Τέλος.»": "At the end of the Manual you wrote in pencil: “Chapter 1: Be yourself. The End.”", "USB με αποδείξεις": "USB with evidence", "Το USB του Μάκη, με τη φωτογραφία του φακέλου και την ηχογράφηση του Λύκου.": "Makis’s USB, with the photo of the folder and the Wolf’s recording.", "Κολλάς την τσίχλα του ’88 στην άκρη του μολυβιού. Ένα εργαλείο που θα ζήλευε κι ο ΜακΓκάιβερ.": "You stick the gum from ’88 onto the end of the pencil. A tool MacGyver would envy.", "Ανοίγεις το Εγχειρίδιο του Άλφα στην τελευταία, λευκή σελίδα. Με το μολύβι του ’88 γράφεις: «Κεφάλαιο 1: Να είσαι ο εαυτός σου. Τέλος.» Η καλύτερη σελίδα του βιβλίου.": "You open the Alpha Manual at the last, blank page. With the pencil from ’88 you write: “Chapter 1: Be yourself. The End.” The best page in the book.", "Περνάς τη φωτογραφία και την ηχογράφηση στο USB του Μάκη. Αρχείο: «case_study_FINAL_alithia.mp4».": "You copy the photo and the recording onto Makis’s USB. File: “case_study_FINAL_truth.mp4”.", "Σκύβεις να το πιάσεις… και ένα περιστέρι, από καθαρή κακία, το σπρώχνει μέσα στη σχάρα του συντριβανιού.": "You bend down to pick it up… and a pigeon, out of pure spite, kicks it into the fountain grate.", "Είναι εκεί κάτω, ροζ και απρόσιτο. Σαν τα όνειρά σου.": "It’s down there, pink and out of reach. Like your dreams.", "Το χέρι σου δεν χωράει στη σχάρα. Χρειάζεσαι κάτι μακρύ… και κολλώδες.": "Your hand won’t fit through the grate. You need something long… and sticky.", "Το κορδόνι είναι στον πάτο της σχάρας. Κάτι μακρύ και κολλώδες θα το έπιανε.": "The lanyard is at the bottom of the grate. Something long and sticky would catch it.", "Βάζεις το μολύβι-καλάμι στη σχάρα. Η τσίχλα του ’88 πιάνει το κορδόνι με την πρώτη!": "You lower the pencil rod into the grate. The gum from ’88 grabs the lanyard first time!", "Ξεκολλάς την τσίχλα. Το μολύβι επιστρέφει στην τσέπη σου, έτοιμο για το επόμενο θαύμα.": "You peel off the gum. The pencil goes back in your pocket, ready for the next miracle.", "Εντύπωση": "Impression", "Ζωή (χωρίς να σηκώσει το βλέμμα): «Αν ψάχνεις το \"Γίνε Άλφα σε 30 μέρες\", είναι στη γωνία της ντροπής. Δίπλα στα βιβλία μαγειρικής του Τσιόδρα.»": "Zoe (without looking up): “If you’re looking for ‘Become an Alpha in 30 Days’, it’s in the corner of shame. Next to the celebrity diet books.”", "Ζωή: «Ωραίο πουκάμισο. Σχεδόν σαν να το διάλεξες το 1988.» Παύση. «Ά, περίμενε. Το διάλεξες το 1988.»": "Zoe: “Nice shirt. Almost as if you chose it in 1988.” Pause. “Oh, wait. You did choose it in 1988.”", "«Ψάχνω κάτι για… ποίηση; Δεν ξέρω από πού να ξεκινήσω.»": "“I’m looking for something… poetry? I don’t know where to start.”", "Η Ζωή σηκώνει το βλέμμα. «Ποίηση; Εσύ; …Ξεκίνα από τον Καβάφη. Όλοι από εκεί ξεκινάνε. Οι περισσότεροι εκεί και σταματάνε.»": "Zoe looks up. “Poetry? You? …Start with Cavafy. Everyone starts there. Most people stop there too.”", "«Είσαι Ζωή; Γιατί μόλις μου έδωσες ζωή!»": "“Are you Zoe? Because you just brought me back to life!”", "Ζωή: «Αυτή η ατάκα είναι παλαιότερη από το πουκάμισό σου. Και αυτό λέει πολλά.»": "Zoe: “That line is older than your shirt. And that says a lot.”", "Ζωή: «Και τι δουλειά κάνεις, εκτός από το να κλέβεις τον χρόνο ανθρώπων που διαβάζουν;»": "Zoe: “And what do you do, apart from wasting the time of people who read?”", "«Λογιστής. Ο πιο cool λογιστής της Κυψέλης.»": "“Accountant. The coolest accountant in Kypseli.”", "Ζωή: «Ο ανταγωνισμός δεν είναι ιδιαίτερα σκληρός, φαντάζομαι.»": "Zoe: “I imagine the competition isn’t fierce.”", "«Επιχειρηματίας. Χτίζω αυτοκρατορία.» (frame του Λύκου)": "“Entrepreneur. I’m building an empire.” (the Wolf’s frame)", "Ζωή: «Από τι; Από χαρτόκουτα;»": "Zoe: “Out of what? Cardboard boxes?”", "«Λογιστής. Βαρετό, το ξέρω. Αλλά τα νούμερα δεν λένε ψέματα. Οι άνθρωποι λένε.»": "“Accountant. Boring, I know. But numbers don’t lie. People do.”", "Ζωή: «…Χμ. Αυτό ήταν σχεδόν ποιητικό. Μην το συνηθίσεις.»": "Zoe: “…Hm. That was almost poetic. Don’t get used to it.”", "Ζωή: «Σε έστειλε ο \"Λύκος\", ε; Είσαι ο τρίτος σήμερα. Ο προηγούμενος μου είπε ότι τα βιβλία είναι για όσους φοβούνται τη ζωή.»": "Zoe: “The ‘Wolf’ sent you, didn’t he? You’re the third today. The last one told me books are for people afraid of life.”", "«…Ναι. Αλλά νομίζω ότι μόλις τον απέλυσα.»": "“…Yes. But I think I just fired him.”", "Η Ζωή γελάει. Ένα αληθινό γέλιο. Ο γάτος Μπόρχες ανοίγει το ένα μάτι, ενοχλημένος από τη χαρά.": "Zoe laughs. A real laugh. Borges the cat opens one eye, annoyed by the joy.", "«Ο Λύκος; Γαβ!»": "“The Wolf? Woof!”", "Ζωή: «Γαβ. Ωραία. Συνεννοηθήκαμε σε επίπεδο σκύλου.»": "Zoe: “Woof. Lovely. We’ve reached an understanding at dog level.”", "«Ποιος Λύκος; Εγώ είμαι φυσικός Άλφα.»": "“What Wolf? I’m a natural Alpha.”", "Ζωή: «Φυσικός Άλφα με κάρτα ATH.ENA και walkman. Συγκινητικό.»": "Zoe: “A natural Alpha with an ATH.ENA card and a Walkman. Touching.”", "Ζωή: «Ζωή. Δικό μου το μαγαζί. Ή, πιο σωστά, της τράπεζας.»": "Zoe: “I’m Zoe. The shop is mine. Or rather, the bank’s.”", "Ζωή: «Τέλος πάντων. Ζωή. Και μη με ξανακάνεις \"neg\" γιατί θα σε πουλήσω στο Γιουσουρούμ.»": "Zoe: “Anyway. Zoe. And don’t ‘neg’ me again or I’ll sell you at the flea market.”", "VALUE +1000!!! ΕΙΣΑΙ ΘΡΥΛΟΣ, CHAMP! 🐺🔥": "VALUE +1000!!! YOU’RE A LEGEND, CHAMP! 🐺🔥", "Σε είδα στο Instagram. «Ο Vintage Θείος του Λύκου». Case study, ε; Μη μου ξαναμιλήσεις.": "I saw you on Instagram. “The Wolf’s Vintage Uncle”. Case study, huh? Don’t talk to me again.", "Το κινητό δονείται ξανά. Μήνυμα από τη Ζωή:": "The phone buzzes again. A message from Zoe:", "«Σε είδα στο Instagram. \"Ο Vintage Θείος του Λύκου\". Case study, ε; Μη μου ξαναμιλήσεις.»": "“I saw you on Instagram. ‘The Wolf’s Vintage Uncle’. Case study, huh? Don’t talk to me again.”", "Τάκης (από μέσα του): «…Τάκη. Τι έκανες;»": "Takis (to himself): “…Takis. What have you done?”", "Η Ζωή δεν σηκώνει καν το βλέμμα.": "Zoe doesn’t even look up.", "Ζωή: «Δεν έχουμε τίποτα να πούμε, \"case study\". Αν θες ποίηση, ψάξε στο Instagram.»": "Zoe: “We have nothing to say, ‘case study’. If you want poetry, look on Instagram.”", "Ένας κύριος με κοστούμι μιλάει δυνατά στο κινητό: «Όχι, ΕΣΥ άκουσέ με! Είμαι στο μετρό, αλλά είμαι CEO!»": "A man in a suit is shouting into his phone: “No, YOU listen to ME! I’m on the metro, but I’m a CEO!”", "Μια γιαγιά σού προσφέρει θέση. Δεν ξέρεις αν να νιώσεις ευγνωμοσύνη ή να πας για αξονική.": "A grandmother offers you her seat. You don’t know whether to feel grateful or book a scan.", "Ένας φοιτητής διαβάζει «Σπινόζα για αρχάριους». Ένας άλλος δίπλα του διαβάζει «Γίνε Άλφα για αρχάριους». Κοιτάζονται. Κανείς δεν κερδίζει.": "A student is reading “Spinoza for Beginners”. The one next to him is reading “Alpha for Beginners”. They look at each other. Nobody wins.", "Δύο κυρίες συζητάνε δυνατά: «Και του λέω: ή το σεμινάριο ή εγώ!» «Και τι διάλεξε;» «Το σεμινάριο. Με έκπτωση.»": "Two ladies talk loudly: “So I tell him: it’s the seminar or me!” “And what did he choose?” “The seminar. With a discount.”", "Ένας νεαρός κάνει βίντεο: «Καλημέρα, Άλφα οικογένεια! Σήμερα κάνω νηστεία ντοπαμίνης στο μετρό!» Δείχνει πολύ, πολύ εξαντλημένος.": "A young man is filming himself: “Morning, Alpha family! Today I’m doing a dopamine fast on the metro!” He looks very, very exhausted.", "Ένα παιδάκι σε κοιτάζει επίμονα. «Μαμά, ο κύριος είναι από ταινία;» «Μην κοιτάς, αγάπη μου.»": "A little kid stares at you. “Mum, is the man from a film?” “Don’t stare, sweetheart.”", "ΓΡΑΜΜΕΣ 1 · 2 · 3": "LINES 1 · 2 · 3", "«Ο συρμός σου είναι το mindset σου»": "“Your train is your mindset”", "Επιβάτης": "Passenger", "Ένας επιβάτης. Κρατιέται από τη μπάρα σαν να είναι η τελευταία του ελπίδα.": "A passenger. He clings to the pole as if it were his last hope.", "Νεαρός με ηχείο": "Young man with a speaker", "Ένας νεαρός ακούει ένα podcast χωρίς ακουστικά. Φυσικά.": "A young man is listening to a podcast without headphones. Of course.", "Από το κινητό του ακούγεται η φωνή του Λύκου:": "From his phone comes the Wolf’s voice:", "«…και να ξέρετε, Άλφα οικογένεια: ο κωδικός μου σε ΟΛΑ είναι το όνομα του brand και η χρονιά που γεννήθηκε η Academy. Ο Άλφα δεν φοβάται τους χάκερ!»": "“…and remember, Alpha family: my password for EVERYTHING is the brand name and the year the Academy was born. The Alpha doesn’t fear hackers!”", "Τάκης (από μέσα του): «ALPHA… και η χρονιά. Στο φυλλάδιο έγραφε \"since 1997\".»": "Takis (to himself): “ALPHA… and the year. The flyer said ‘since 1997’.”", "Νεαρός: «Ο Λύκος είναι θεός, αδερφέ.» Τάκης: «Θα το δούμε.»": "Young man: “The Wolf is a god, bro.” Takis: “We’ll see.”", "Μουσικός του μετρό": "Metro musician", "Ο μουσικός από το Μοναστηράκι! Παίζει «Τα παιδιά του Πειραιά» μέσα στο βαγόνι.": "The musician from Monastiraki! He’s playing “The Children of Piraeus” in the carriage.", "Μουσικός: «Φίλε μου! Η χορδή σου κρατάει Και φέρε… εσένα. Μόνο εσένα.»": "Zoe: “Tonight, the ‘Paradise’ summer cinema, 9:30. And bring… you. Just you.”", "Ο σταθμός «Ακρόπολη» ξεκλειδώθηκε στον χάρτη.": "“Akropoli” station is now unlocked on the map.", "Της δίνεις το Εγχειρίδιο του Άλφα, ανοιχτό στην τελευταία σελίδα. Διαβάζει: «Κεφάλαιο 1: Να είσαι ο εαυτός σου. Τέλος.»": "You hand her the Alpha Manual, open at the last page. She reads: “Chapter 1: Be yourself. The End.”", "Ζωή: «…Αυτό το έγραψες εσύ; Με μολύβι;» Το βλέμμα της μαλακώνει. Λίγο.": "Zoe: “…You wrote this? In pencil?” Her gaze softens. A little.", "Της δίνεις το Εγχειρίδιο του Άλφα; Τάκη. Σοβαρά τώρα. Ίσως αν του πρόσθετες κάτι δικό σου…": "You’re giving her the Alpha Manual? Takis. Seriously. Maybe if you added something of your own…", "Η Αθήνα": "Athens", "Όλη η Αθήνα στα πόδια σου. Η Ακρόπολη, ο Πειραιάς, οι ταράτσες με τα ηλιακά. Από εδώ πάνω, ακόμα και η Πατησίων είναι ωραία.": "All of Athens at your feet. The Acropolis, Piraeus, the rooftops with their solar heaters. From up here, even Patission Street looks pretty.", "Άγιος Γεώργιος": "Agios Georgios", "Το εκκλησάκι του Αγίου Γεωργίου. Λευκό, μικρό, πεισματάρικο. Σαν την ελπίδα σου.": "The little chapel of Agios Georgios. White, small, stubborn. Like your hope.", "Τελεφερίκ προς Κολωνάκι": "Funicular to Kolonaki", "Λυκαβηττός. Ηλιοβασίλεμα. Η Αθήνα αλλάζει χρώμα από ροδακινί σε μωβ.": "Lycabettus. Sunset. Athens turns from peach to purple.", "Στο πεζούλι, μια γνώριμη σιλουέτα με σγουρά μαλλιά.": "On the low wall, a familiar silhouette with curly hair.", "Τελεφερίκ Λυκαβηττού": "Lycabettus funicular", "Το τελεφερίκ για τον Λυκαβηττό. Η πιο ρομαντική ανηφόρα της Αθήνας. €10 μετ’ επιστροφής. Η πιο ακριβή επίσης.": "The funicular up Lycabettus. The most romantic climb in Athens. €10 return. Also the most expensive.", "Τι να κάνεις στον Λυκαβηττό μόνος σου, Τάκη; Να κλάψεις με θέα;": "What would you do up Lycabettus on your own, Takis? Cry with a view?", "Στέλλα, 49": "Stella, 49", "«Λάτρης του yoga, του κρασιού και των ανδρών με \"ενέργεια\". Όχι λογιστές.»": "“Into yoga, wine and men with ‘energy’. No accountants.”", "Βούλα, 51": "Voula, 51", "«Ψάχνω άνδρα με όνειρα. Και αυτοκίνητο. Κυρίως αυτοκίνητο.»": "“Looking for a man with dreams. And a car. Mainly a car.”", "Coach Λύκος, 44": "Coach Wolf, 44", "«Δεν ψάχνω σχέση. Ψάχνω πελάτισσες. 🐺 Link στο bio.»": "“Not looking for a relationship. Looking for clients. 🐺 Link in bio.”", "Λένα, 53": "Lena, 53", "«Μ’ αρέσουν οι βόλτες στην Πλάκα, ο Ελύτης και οι άνδρες που ζητάνε συγγνώμη.»": "“I love walks in Plaka, Elytis and men who say sorry.”", "Κυρα-Λένη, 78": "Mrs Leni, 78", "«Η εγγονή μου μού έφτιαξε προφίλ. Δεν ξέρω τι κάνω εδώ. Έχεις φάει;»": "“My granddaughter made me this profile. I don’t know what I’m doing here. Have you eaten?”", "ΤΑΙΡΙ+: «Δεν υπάρχουν άλλα προφίλ στην περιοχή σου. Δοκίμασε να γίνεις πιο… High Value.»": "TAIRI+: “No more profiles in your area. Try being more… High Value.”", "Τάκης κλείνει την εφαρμογή. Μερικά πράγματα δεν βρίσκονται με αντίχειρα.": "Takis closes the app. Some things can’t be found with a thumb.", "📱 ΤΑΙΡΙ+ — ": "📱 TAIRI+ — ", "◀ Αριστερά (όχι)": "◀ Left (no)", "▶ Δεξιά (ναι)": "▶ Right (yes)", "ΤΑΙΡΙ+: «Η Στέλλα σε έκανε unmatch. Λόγος: \"λογιστής\".»": "TAIRI+: “Stella unmatched you. Reason: ‘accountant’.”", "ΤΑΙΡΙ+: «Η Βούλα ρωτάει τι αυτοκίνητο έχεις. Της απαντάς \"κάρτα ATH.ENA\". Η συνομιλία τελειώνει.»": "TAIRI+: “Voula asks what car you drive. You reply ‘ATH.ENA card’. The conversation ends.”", "ΤΑΙΡΙ+: «Ο Coach Λύκος σού έστειλε κουπόνι έκπτωσης 3%.»": "TAIRI+: “Coach Wolf sent you a 3% discount voucher.”", "ΤΑΙΡΙ+: «Match! Η Λένα σού στέλνει: \"Πάμε για καφέ;\" Της απαντάς ειλικρινά: \"Γνώρισα κάποια.\" Η Λένα: \"Μπράβο σου. Αυτό είναι ελκυστικό.\"»": "TAIRI+: “Match! Lena writes: ‘Coffee?’ You reply honestly: ‘I’ve met someone.’ Lena: ‘Good for you. That’s attractive.’”", "ΤΑΙΡΙ+: «Match! Η κυρα-Λένη: \"Παιδί μου, η μάνα σου μου είπε για σένα! Έλα για γ H.ENA». €997. Δεν ήρθε κανείς. Ούτε η Ζωή.": "Takis launched his own seminar: “The Vintage Uncle — How to Be High Value with an ATH.ENA Card”. €997. Nobody came. Not even Zoe.", " · Ειλικρίνεια: ": " · Honesty: ", "Τέλος ": "Ending ", " από 3.": " of 3.", "Το είδα στις ειδήσεις. Δεν ξέρω αν σε εμπιστεύομαι. Αν θες να μιλήσουμε: Λυκαβηττός, ηλιοβασίλεμα.": "I saw it on the news. I don’t know if I trust you. If you want to talk: Lycabettus, sunset.", "ΒΙΚΤΩΡΙΑ · VICTORIA": "ΒΙΚΤΩΡΙΑ · VICTORIA", "ΓΙΝΕ ΛΥΚΟΣ!": "BECOME A WOLF!", "ΕΘΝΙΚΟ": "NATIONAL", "ΑΡΧΑΙΟΛ.": "ARCHAEOL.", "ΜΟΥΣΕΙΟ": "MUSEUM", "Η ΕΥΚΑΙΡΙΑ ΣΟΥ": "YOUR CHANCE", "— Ρωμαίε, Ρωμαίε…": "— Romeo, Romeo…", "Ο Λουκουμάς στην Αθήνα": "Loukoumas in Athens", "ή πώς ο Τάκης έγινε High Value Man (σχεδόν)": "or how Takis became a High Value Man (almost)"};

function R(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function disc(g,cx,cy,r,c){ g.fillStyle=c; for(let dy=-r;dy<=r;dy++){ const dx=Math.floor(Math.sqrt(r*r-dy*dy+r*.6)); g.fillRect(Math.round(cx-dx),Math.round(cy+dy),dx*2+1,1); } }
function ell(g,cx,cy,rx,ry,c){ g.fillStyle=c; for(let y=-ry;y<=ry;y++){ const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/((ry+.5)*(ry+.5))))); g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1); } }
function line(g,x0,y0,x1,y1,c){ g.fillStyle=c; x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1; let e=dx+dy;

  if(o.hd){ const oh=s.hd; s.hd=function(cam,dt){ if(oh) oh.call(this,cam,dt); o.hd.call(this,cam,dt); }; }
  if(o.over){ const ov=s.over; s.over=function(g,dt){ if(ov) ov.call(this,g,dt); o.over.call(this,g,dt); }; }
  if(o.grade) s.grade=o.grade; Object.assign(s,o.flags||{}); }

/* ---------- walk grid + A* pathfinding ---------- */
const CELL=4;
function buildGrid(s){ const gw=Math.ceil(s.w/CELL), gh=Math.ceil(H/CELL), m=new Uint8Array(gw*gh);
  for(let gy=0;gy<gh;gy++) for(let gx=0;gx<gw;gx++){ const x=gx*CELL+2, y=gy*CELL+2; let ok=inPoly(x,y,s.walk); if(ok) for(const b of s.block) if(x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]){ ok=false; break; } m[gy*gw+gx]=ok?1:0; }
  s.grid={gw,gh,m}; }
function walkable(s,x,y){ const G=s.grid, gx=Math.floor(x/CELL), gy=Math.floor(y/CELL); return gx>=0&&gy>=0&&gx<G.gw&&gy<G.gh&&G.m[gy*G.gw+gx]===1; }
function nearestCell(s,x,y){ const G=s.grid; const gx=clamp(Math.floor(x/CELL),0,G.gw-1), gy=clamp(Math.floor(y/CELL),0,G.gh-1); if(G.m[gy*G.gw+gx]) return [gx,gy];
  for(let r=1;r<70;r++){ let best=null, bd=1e9; for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; const cx=gx+dx, cy=gy+dy; if(cx<0||cy<0||cx>=G.gw||cy>=G.gh||!G.m[cy*G.gw+cx]) continue; const d=dx*dx*2.5+dy*dy; if(d<bd){ bd=d; best=[cx,cy]; } } if(best) return best; } return null; }
function los(s,a,b){ const d=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.ceil(d/2); for(let i=1;i<=n;i++){ const t=i/n; if(!walkable(s,a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)) return false; } return true; }
function findPath(s,sx,sy,tx,ty){
  const G=s.grid, gw=G.gw, st=nearestCell(s,sx,sy), en=nearestCell(s,tx,ty); if(!st||!en) return [];
  const N=gw*G.gh, sI=st[1]*gw+st[0], eI=en[1]*gw+en[0], gS=new Float32Array(N).fill(1e9), came=new Int32Array(N).fill(-1), closed=new Uint8Array(N), heap=[];
  const push=(i,f)=>{ heap.push([f,i]); let c=heap.length-1; while(c>0){ const p=(c-1)>>1; if(heap[p][0]<=heap[c][0]) break; [heap[p],heap[c]]=[heap[c],heap[p]]; c=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let c=0; for(;;){ const l=c*2+1, r=l+1; let m=c; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===c) break; [heap[m],heap[c]]=[heap[c],heap[m]]; c=m; } } return top; };
  const hf=i=>{ const dx=Math.abs(i%gw-en[0]), dy=Math.abs(((i/gw)|0)-en[1]); return Math.max(dx,dy)+.414*Math.min(dx,dy); };
  gS[sI]=0; push(sI,hf(sI));
  while(heap.length){ const [,i]=pop(); if(closed[i]) continue; if(i===eI) break; closed[i]=1; const x=i%gw, y=(i/gw)|0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=gw||ny>=G.gh) continue; const j=ny*gw+nx; if(!G.m[j]||closed[j]) continue;
      if(dx&&dy&&(!G.m[y*gw+nx]||!G.m[ny*gw+x])) continue; const c=gS[i]+(dx&&dy?1.414:1); if(c<gS[j]){ gS[j]=c; came[j]=i; push(j,c+hf(j)); } } }
  if(sI!==eI&&came[eI]<0) return [];
  const cells=[]; for(let i=eI;i!==sI&&i>=0;i=came[i]) cells.push(i); cells.reverse();
  const pts=cells.map(i=>[(i%gw)*CELL+2,((i/gw)|0)*CELL+2]); if(walkable(s,tx,ty)) pts.push([tx,ty]); if(!pts.length) return [];
  const out=[]; let cur=[sx,sy], k=0;
  while(k<pts.length){ let far=k; for(let m=pts.length-1;m>k;m--) if(los(s,cur,pts[m])){ far=m; break; } out.push(pts[far]); cur=pts[far]; k=far+1; }
  return out; }
function walkTo(x,y,cb,force){ const s=SC[S.scene]; S.path=findPath(s,S.x,S.y,x,y); S.onArrive=cb||null; if(!S.path.length){ S.onArrive=null; if(cb) cb(); } }
function faceTo(h){ const f=h.face; if(f==='back') S.dir='back'; else if(f==='front') S.dir='front'; else if(f==='left'){ S.dir='side'; S.face=-1; } else if(f==='right'){ S.dir='side'; S.face=1; } }

const PFX=[];

/* ---------- hotspots ---------- */
function hRect(h){ return typeof h.rect==='function'?h.rect():h.rect; }
function hotAt(wx,wy){ const s=SC[S.scene]; let best=null, ba=1e9;
  for(const h of s.hs){ const r=hRect(h); if(wx>=r[0]&&wx<=r[0]+r[2]&&wy>=r[1]&&wy<=r[1]+r[3]){ const a=r[2]*r[3]; if(a<ba){ ba=a; best=h; } } } return best; }
const DEF=G.DEF;
const NOPE=G.NOPE;
function doVerb(h,v){
  if(v==='item'){ const it=S.sel; if(h.item&&h.item(it)) return; if(G.itemFallback&&G.itemFallback(h,it)) return; HINT.fails++; if(HINT.fails===3&&G.hints!=='off') after(.1,()=>tip(G.hintTip||'Κόλλησες; Πάτα τη λάμπα για μια μικρή βοήθεια.',5000)); return say([NOPE[(Math.random()*NOPE.length)|0]]); }
  if(v==='walk'&&h.exit) return h.exit();
  const f=h[v]; if(typeof f==='function') return f.call(h); if(Array.isArray(f)) return say(f);
  if(v==='hand'&&h.exit) return h.exit();
  say(DEF[v]||DEF.look); }
function smartTap(sx,sy,touch){ if(!$('settings').hidden) return;
  if(D.active){ if(!D.opts) advance(); return; }
  if(S.mode!=='play'||S.lock||S.trans) return;
  const wx=sx+S.cam, h=hotAt(wx,sy); HINT.idle=0; sfx('tap');
  if(touch&&h) flashLabel(tr(typeof h.n==='function'?h.n():h.n),sx,sy);
  if(h){ const go2=()=>{ faceTo(h); tapInteract(h); }; if(h.at) walkTo(h.at[0],h.at[1],go2); else go2(); }
  else { tapFx(wx,sy); walkTo(wx,Math.max(sy,SC[S.scene].far)); } }
function tapInteract(h){ if(S.sel){ const it=S.sel; S.sel=null; renderInv(); if(h.item&&h.item(it)) return; if(G.itemFallback&&G.itemFallback(h,it)) return; HINT.fails++; return say([G.NOPE[(Math.random()*G.NOPE.length)|0]]); }
  const f=h.act||h.hand||h.talk||h.look; if(typeof f==='function') return f.call(h); if(Array.isArray(f)) return say(f); if(h.exit) return h.exit(); }
function clickAt(sx,sy,touch){
  if(G.smart) return G.smart(sx,sy,touch);
  if(G.ui==='tap') return smartTap(sx,sy,touch);
  if(G.ui==='ab'){ if(D.active&&!D.opts) advance(); return; }
  HINT.idle=0;
  if(!$('settings').hidden) return;
  if(D.active){ if(!D.opts) advance(); return; }
  if(S.mode!=='play'||S.lock||S.trans) return;
  closeInv(); const wx=sx+S.cam, wy=sy, h=hotAt(wx,wy), v=S.verb; S.idle=0;
  if(touch&&h) flashLabel(tr(typeof h.n==='function'?h.n():h.n),sx,sy);
  if(v==='walk'){ if(h&&h.exit){ walkTo(h.at[0],h.at[1],()=>{ faceTo(h); h.exit(); }); return; } tapFx(wx,wy); walkTo(wx,Math.max(wy,SC[S.scene].far)); return; }
  if(!h){ if(v==='item'&&G.itemFallback&&G.itemFallback(null,S.sel)) return; if(v==='look'&&SC[S.scene].look) return say(SC[S.scene].look); tapFx(wx,wy); return; }
  if(v==='look'||!h.at){ if(h.at&&v!=='look'){} doVerb(h,v); return; }
  walkTo(h.at[0],h.at[1],()=>{ faceTo(h); doVerb(h,v); }); }
