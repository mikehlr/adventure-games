<style>

  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#2b1d3a; --paper:#fffbe8; --pink:#e0338a; --sun:#ffd23f; --sea:#1f74d0; --line:rgba(43,29,58,.9); --bg:#2b1d3a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#2b1d3a; --paper:#fffbe8; --bg:#2b1d3a; } }
:root[data-theme="dark"]{ --ink:#2b1d3a; --paper:#fffbe8; --bg:#2b1d3a; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;}
body{box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Comfortaa','Trebuchet MS','Verdana',sans-serif;font-weight:700;color:var(--ink);}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;background:#000;--u:2px;--ts:1;}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px;}

#score{position:absolute;left:50%;top:calc(var(--u)*5);transform:translateX(-50%);background:var(--ink);color:var(--sun);
  padding:calc(var(--u)*1.6) calc(var(--u)*6);border-radius:99px;font-size:calc(var(--u)*5.6*var(--ts));white-space:nowrap;pointer-events:none;}

@keyframes bump{30%{transform:translateX(-50%) scale(1.25);background:var(--pink);color:#fff;}}

#dlg{position:absolute;left:50%;top:calc(var(--u)*18);transform:translateX(-50%);width:min(94%,calc(68% + (var(--ts) - 1) * 46%));
  max-height:calc(100% - var(--u)*56);overflow-y:auto;background:var(--paper);border:calc(var(--u)*1.2) solid var(--ink);
  box-shadow:0 0 0 calc(var(--u)*1.2) var(--pink),calc(var(--u)*2) calc(var(--u)*3) 0 calc(var(--u)*1.2) rgba(43,29,58,.45);
  padding:calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*6);text-align:center;border-radius:calc(var(--u)*2);}
#dlg[hidden]{display:none;}
#dlg:not([hidden]){animation:dlgIn .18s ease-out;}
@keyframes dlgIn{from{opacity:0;transform:translateX(-50%) translateY(calc(var(--u)*-4)) scale(.96);}}
#dlgText{margin:0;font-size:calc(var(--u)*7*var(--ts));line-height:1.45;min-height:1.45em;text-wrap:pretty;}
#dlgOpts{display:flex;flex-direction:column;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*5);}
#dlgOpts:empty{display:none;}
#dlgOpts button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) calc(var(--u)*4);font-size:calc(var(--u)*6.4*var(--ts));}
#dlgOpts button:active{background:var(--sun);}
#dlg.pt{display:flex;align-items:center;gap:calc(var(--u)*6);text-align:left;width:min(96%,calc(82% + (var(--ts) - 1) * 36%));padding-left:calc(var(--u)*5);}
#pt{display:none;flex:none;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6);}
#dlg.pt #pt{display:flex;}
#ptc{width:calc(var(--u)*42);height:calc(var(--u)*42);image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--u)*1) solid var(--ink);border-radius:calc(var(--u)*1.5);box-shadow:0 0 0 calc(var(--u)*.9) var(--pink);background:#fff;}
#ptn{font-size:calc(var(--u)*5*var(--ts));background:var(--ink);color:var(--sun);border-radius:99px;padding:calc(var(--u)*.6) calc(var(--u)*3.4);white-space:nowrap;max-width:calc(var(--u)*56);overflow:hidden;text-overflow:ellipsis;}
#dlgBody{flex:1;min-width:0;}
#more{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1.5);font-size:calc(var(--u)*5);color:var(--pink);animation:bob 1s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(2px);}}

#whisper{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:calc(var(--u)*12*var(--ts));color:var(--sun);
  -webkit-text-stroke:calc(var(--u)*.6) var(--ink);text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--pink);opacity:0;transition:opacity .4s, transform .4s;transform:scale(.8);pointer-events:none;}
#whisper.show{opacity:1;transform:scale(1);}

#hint{position:absolute;left:50%;bottom:calc(var(--u)*6);transform:translateX(-50%);max-width:calc(44% + (var(--ts) - 1) * 10%);text-align:center;
  font-size:calc(var(--u)*6*var(--ts));background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.4) calc(var(--u)*5);
  pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hint:empty{display:none;}
#tip{position:absolute;left:50%;bottom:calc(var(--u)*20);transform:translateX(-50%);width:min(80%,calc(52% + (var(--ts) - 1) * 40%));text-align:center;
  font-size:calc(var(--u)*5.6*var(--ts));color:#fff;text-shadow:0 0 calc(var(--u)*2) var(--ink),0 0 calc(var(--u)*1) var(--ink);pointer-events:none;transition:opacity .6s;opacity:0;}
#tip.show{opacity:1;}

.ctl{position:absolute;width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;background:rgba(255,251,232,.78);
  border:calc(var(--u)*1) solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;
  box-shadow:calc(var(--u)*1) calc(var(--u)*1.5) 0 rgba(43,29,58,.5);}
.ctl svg{width:44%;height:44%;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.ctl.held{background:var(--sun);transform:translateY(1px);}
.ctl b{font-size:calc(var(--u)*12);line-height:1;}
#bL{left:calc(var(--u)*6);bottom:calc(var(--u)*6);}
#bR{left:calc(var(--u)*40);bottom:calc(var(--u)*6);}
#bA{right:calc(var(--u)*6);bottom:calc(var(--u)*6);width:calc(var(--u)*34);height:calc(var(--u)*34);background:rgba(255,210,63,.7);}

#bB{right:calc(var(--u)*44);bottom:calc(var(--u)*24);width:calc(var(--u)*26);height:calc(var(--u)*26);background:rgba(224,51,138,.75);color:#fff;}
#bB b{font-size:calc(var(--u)*10);}
#bInv{right:calc(var(--u)*6);top:calc(var(--u)*5);width:calc(var(--u)*24);height:calc(var(--u)*24);}
#bMenu{left:calc(var(--u)*6);top:calc(var(--u)*5);width:calc(var(--u)*22);height:calc(var(--u)*22);}
#sel{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*46);max-width:42%;display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:calc(var(--u)*1.6) calc(var(--u)*5) calc(var(--u)*1.6) calc(var(--u)*2);font-size:calc(var(--u)*6*var(--ts));white-space:nowrap;
  background:var(--paper);border:calc(var(--u)*.9) solid var(--pink);border-radius:calc(var(--u)*3);}
#sel[hidden]{display:none;}

#sel span{overflow:hidden;text-overflow:ellipsis;}

@keyframes pop{0%{transform:scale(.8)}100%{transform:none}}

#inv{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*7) calc(var(--u)*36) calc(var(--u)*6);background:var(--paper);
  border-bottom:calc(var(--u)*1.2) solid var(--ink);box-shadow:0 calc(var(--u)*1.2) 0 var(--pink);}
#inv[hidden]{display:none;}
#slots{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center;min-height:calc(var(--u)*22);}
.slot{width:calc(var(--u)*22);height:calc(var(--u)*22);padding:calc(var(--u)*3);background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);}
.slot.on{background:var(--sun);border-color:var(--pink);}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
#invBar{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5);margin-top:calc(var(--u)*4);flex-wrap:wrap;}
#invCap{font-size:calc(var(--u)*6.2*var(--ts));min-height:1.3em;text-align:center;}
#invBar button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1.5) calc(var(--u)*6);font-size:calc(var(--u)*5.8*var(--ts));}

#menu{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*30);display:flex;flex-direction:column;gap:calc(var(--u)*2);}
#menu[hidden]{display:none;}
#menu button{background:var(--paper);border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) calc(var(--u)*7);font-size:calc(var(--u)*6.2*var(--ts));text-align:left;}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 calc(var(--u)*16) calc(var(--u)*12);
  background:linear-gradient(90deg,rgba(43,29,58,.72) 0%,rgba(43,29,58,.3) 55%,rgba(43,29,58,0) 80%);color:#fff;}
.screen[hidden]{display:none;}
#title h1{margin:0;font-weight:700;font-size:calc(var(--u)*20);line-height:1;color:var(--sun);
  -webkit-text-stroke:calc(var(--u)*.7) var(--ink);text-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--pink);letter-spacing:-.01em;}
#title h1 b{font-weight:700;display:inline-block;}
#title h1 .v2{display:inline-block;vertical-align:top;margin-left:calc(var(--u)*3);font-style:normal;font-size:calc(var(--u)*7);background:var(--pink);color:#fff;-webkit-text-stroke:0;text-shadow:none;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*4);transform:rotate(-8deg);}
#title h1 span{display:block;font-size:calc(var(--u)*9);color:#fff;-webkit-text-stroke:0;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink);margin-top:calc(var(--u)*3);}
#title nav{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*3);margin-top:calc(var(--u)*8);}
#title nav button{background:var(--paper);color:var(--ink);border:calc(var(--u)*.9) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2) calc(var(--u)*9);
  font-size:calc(var(--u)*7.4*var(--ts));box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--pink);}
#title nav button:active{transform:translate(1px,1px);box-shadow:none;}
#title nav button[hidden]{display:none;}
#title small{font-size:calc(var(--u)*5*var(--ts));margin-top:calc(var(--u)*6);opacity:.9;}
#end{background:linear-gradient(#ff8a3d,#e0338a 60%,#6b2a8a);justify-content:center;align-items:center;text-align:center;padding:calc(var(--u)*10) calc(16% - (var(--ts) - 1) * 16%);overflow-y:auto;}
#end h2{margin:0 0 calc(var(--u)*6);font-size:calc(var(--u)*18);color:var(--sun);-webkit-text-stroke:calc(var(--u)*.7) var(--ink);text-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--ink);}
#end p{font-size:calc(var(--u)*7*var(--ts));line-height:1.5;margin:0 0 calc(var(--u)*3.5);opacity:0;animation:rise 1.4s ease forwards;text-shadow:0 calc(var(--u)*.6) 0 rgba(43,29,58,.6);}
#end button{margin-top:calc(var(--u)*5);background:var(--paper);color:var(--ink);border:calc(var(--u)*.9) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2) calc(var(--u)*9);
  font-size:calc(var(--u)*6.6*var(--ts));opacity:0;animation:rise 1.4s ease forwards;}
@keyframes rise{to{opacity:1;}}

#settings{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:0 12%;gap:calc(var(--u)*4);z-index:5;}
#settings[hidden]{display:none;}
#settings h3{margin:0;font-size:calc(var(--u)*13);color:var(--pink);}
#settings .lab{margin:0;font-size:calc(var(--u)*6);opacity:.75;}
#tsRow,#lgRow,#ptRow,#fxRow{display:flex;gap:calc(var(--u)*3);}
#tsRow button,#lgRow button,#ptRow button,#fxRow button{flex:1;background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) 0;line-height:1;}
#tsRow button[aria-pressed="true"],#lgRow button[aria-pressed="true"],#ptRow button[aria-pressed="true"],#fxRow button[aria-pressed="true"]{background:var(--sun);border-color:var(--pink);}
#tsPrev{margin:0;font-size:calc(var(--u)*7*var(--ts));line-height:1.4;min-height:2.8em;}
#settings .row{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;}
#settings .row button{background:#fff;border:calc(var(--u)*.8) solid var(--ink);border-radius:99px;padding:calc(var(--u)*2.5) calc(var(--u)*8);font-size:calc(var(--u)*6.4);}

#rotate{position:fixed;inset:0;background:var(--bg);color:var(--sun);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  font-size:20px;text-align:center;padding:0 12%;z-index:9;}
#rotate i{display:block;width:34px;height:58px;border:3px solid var(--sun);border-radius:7px;animation:turn 2.4s ease-in-out infinite;}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){#more,#rotate i{animation:none;}}

[hidden]{display:none!important;}
</style>
<style>

  background:linear-gradient(#4a3a6a,#2b1d3a);border-bottom:calc(var(--u)*1) solid var(--sun);box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.35);z-index:2;}

  box-shadow:inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.18),inset 0 calc(var(--u)*-1) 0 rgba(0,0,0,.3);padding:calc(var(--u)*1.6) calc(var(--u)*3);display:flex;align-items:center;justify-content:center;}

#score.bump{animation:sbump .6s ease;}
@keyframes sbump{30%{color:#fff;transform:scale(1.2);}}
#hover{position:absolute;transform:translate(-50%,calc(var(--u)*10));background:rgba(43,29,58,.88);color:var(--sun);font-size:calc(var(--u)*5.4*var(--ts));padding:calc(var(--u)*1) calc(var(--u)*4);border-radius:99px;pointer-events:none;white-space:nowrap;z-index:1;}

beg you: stop it again at 3:17.\"", "«Μην το αφήσεις να προχωρήσει χωρίς εκείνον. — Ευτέρπη»": "\"Don't let it go on without him. — Evterpi\"", "Ανάβω το κερί με το τελευταίο σπίρτο. Η φλόγα τρεμοπαίζει, αλλά κρατάει.": "I light the candle with the last match. The flame shivers, but it holds.", "Δένω τον μαγνήτη στην άκρη του σπάγκου. Σφιχτός κόμπος.": "I tie the magnet to the end of the string. A tight knot.", "Αυτοκίνητο": "Car", "Το Φιατάκι μου. Τα τζάμια θολώνουν από μέσα.": "My little Fiat. The windows are fogging up from the inside.", "Όχι ακόμα. Πρώτα η δουλειά.": "Not yet. Work first.", "Φανοστάτης": "Street lamp", "Η λάμπα τρεμοπαίζει. Σαν να ανασαίνει.": "The lamp flickers. As if it were breathing.", "Γραμματοκιβώτιο": "Mailbox", "Λογαριασμοί της ΔΕΗ, απλήρωτοι. Διαφημιστικά.": "Electricity bills, unpaid. Flyers.", "Και στο βάθος, μια παλιά κάρτα. Την κρατάω.": "And at the very back, an old card. I keep it.", "Μόνο λογαριασμοί. Κανείς δεν θα τους πληρώσει.": "Only bills. Nobody will ever pay them.", "Εξώπορτα": "Front door", "Κλειδωμένη.": "Locked.", "Το έγγραφο του δικαστηρίου λέει πως το κλειδί «βρίσκεται εντός του ακινήτου».": "The court order says the key \"is located on the premises\".", "Πολύ βοηθητικό.": "Very helpful.", "Το κλειδί γυρνάει με κόπο. Κάτι μέσα στην κλειδαριά τρίζει σαν κόκαλο.": "The key turns with effort. Something inside the lock creaks like bone.", "Γλάστρα": "Flowerpot", "Βασιλικός. Ξερός εδώ και χρόνια.": "Basil. Dead for years.", "Γλάστρα με γεράνι": "Geranium pot", "Ένα μαραμένο γεράνι. Του πήρα ό,τι είχε.": "A withered geranium. I took all it had.", "Ένα μαραμένο γεράνι. Το χώμα είναι σκληρό σαν πέτρα.": "A withered geranium. The soil is hard as stone.", "«Στο γεράνι.»": "\"In the geranium.\"", "Σκάβω με τα δάχτυλα. Το χώμα είναι παγωμένο.": "I dig with my fingers. The soil is ice cold.", "Ένα κλειδί. Σκουριασμένο.": "A key. Rusted.", "Άδεια γλάστρα": "Empty pot", "Άδεια. Μόνο βρόχινο νερό και ένα πεσμένο φύλλο.": "Empty. Just nd.", "Πόρτα του υπογείου": "Cellar door", "Σκαλοπάτια που χάνονται στο απόλυτο σκοτάδι.": "Steps vanishing into total darkness.", "Έχω ένα κερί. Χρειάζομαι κάτι για να το ανάψω.": "I have a candle. I need something to light it.", "Χωρίς φως δεν κατεβαίνω.": "I'm not going down without light.", "Πρέπει πρώτα να το ανάψω.": "I need to light it first.", "Ημερολόγιο τοίχου": "Wall calendar", "Ημερολόγιο τοίχου. Νοέμβριος 1967.": "A wall calendar. November 1967.", "Η 17η είναι κυκλωμένη με κόκκινο. Κανείς δεν γύρισε τη σελίδα από τότε.": "The 17th is circled in red. Nobody has turned the page since.", "Ψυγείο": "Fridge", "Το ψυγείο είναι αποσυνδεδεμένο. Δεν τολμώ να το ανοίξω.": "The fridge is unplugged. I don't dare open it.", "Στην πόρτα, ένας μαγνήτης-σουβενίρ. Τον παίρνω.": "On the door, a souvenir magnet. I take it.", "Δεν το ανοίγω. Όχι.": "I'm not opening it. No.", "Συρτάρια": "Drawers", "Κουτάλια, ένα σπασμένο ψαλίδι… και σπίρτα.": "Spoons, a broken pair of scissors… and matches.", "Τίποτε άλλο χρήσιμο.": "Nothing else useful.", "Νεροχύτης": "Sink", "Η βρύση στάζει. Ρυθμικά. Σαν να μετράει κάτι.": "The tap drips. Rhythmically. As if it were counting something.", "Τραπέζι": "Table", "Δύο φλιτζάνια, στρωμένα αντικριστά.": "Two cups, set facing each other.", "Το ένα δεν το έπιασε ποτέ κανείς. Έχει σκόνη μέσα.": "One was never touched. There's dust inside.", "Προς το χολ": "To the hallway", "Η κουζίνα. Πιο κρύα από τον δρόμο.": "The kitchen. Colder than the street.", "Ράφια": "Shelves", "Βάζα με γλυκό του κουταλιού. Δεκάδες.": "Jars of spoon sweets. Dozens of them.", "Όλα έχουν την ίδια ετικέτα, με το ίδιο χέρι: «Για τον Α., όταν γυρίσει».": "Every one has the same label, in the same hand: \"For A., when he comes back.\"", "Στέρνα": "Cistern", "Μαύρο νερό. Δεν βλέπω πια τον πάτο. Ή μήπως εκείνος δεν βλέπει εμένα;": "Black water. I can't see the bottom anymore. Or does it no longer see me?", "Μια παλιά στέρνα. Το νερό είναι ακίνητο σαν γυαλί.": "An old cistern. The water is still as glass.", "Κάτι μεταλλικό γυαλίζει στον πάτο. Πολύ βαθιά για το χέρι μου.": "Something metal glints at the bottom. Too deep for my hand.", "Κατεβάζω τον μαγνήτη αργά…": "I lower the magnet slowly…", "Κάτι τραβάει τον σπάγκο. Μια στιγμή μόνο. Πιο δυνατά απ’ όσο θα έπρεπε.": "Something pulls on the string. Just for a moment. Harder than it should.", "Ένα μικρό ορειχάλκινο κλειδί.": "A small brass key.", "Δεν φτάνει ως κάτω. Αν το συνδύαζα με κάτι…": "It won't reach the bottom. If I combined it with something…", "Μπαούλο": "Trunk", "Ανδρικά ρούχα, διπλωμένα με προσοχή. Ναφθαλίνη.": "Men's clothes, carefully folded. Mothballs.", "Από πάνω, ένα πηλήκιο σιδηροδρομικού.": "On top, a railwayman's cap.", "…Υπάρχει κανείς εδώ κάτω;": "…Is anyone down here?", "Μόνο η σταγόνα που πέφτει στη στέρνα.": "Only the drip falling into the cistern.", "Βιβλιοθήκη": "Bookcase", "Δρομολόγια του σιδηροδρόμου, δεμένα σε τόμους. Από το 1958 ως το 1967.": "Railway timetables, bound in volumes. From 1958 to 1967.", "Μετά το 1967, τίποτα.": "After 1967, nothing.", "Φωτογραφία": "Photograph", "Ένα ζευγάρι σε παραλία. Εκείνη γελάει. Εκείνος κοιτάζει το ρολόι του.": "A couple on a beach. She is laughing. He is looking at his watch.", "Από πίσω: «Ευτέρπη και Ανδρέας, Καβάλα 1966».": "On the back: \"Evterpi and Andreas, Kavala 1966\".", "Γραφείο": "Desk", "Ένα ημερολόγιο, ανοιχτό στην τελευταία σελίδα:": "A diary, open at the last page:", "«Το ρολόι σταμάτησε τη νύχτα που ο Ανδρέας πήρε το τρένο των 3:17.»": "\"The clock stopped the night Andreas took the 3:17 train.\"", "«Δεν θα το ξανακουρδίσω. Όσο ο χρόνος δεν προχωρά, δεν έχει φύγει.»": "\"I will never wind it again. As long as time stands still, he hasn't left.\"", "Στο συρτάρι, ένα κλειδί κουρδίσματος με μαύρη κορδέλα.": "In the drawer, a winding key on a black ribbon.", "Πρέπει να ελέγξω αν το ρολόι λειτουργεί. Αλλάζει την εκτίμηση.": "I have to check whether the clock works. It changes the valuation.", "«Όσο ο χρόνος δεν προχωρά, δεν έχει φύγει.»": "\"As long as time stands still, he hasn't left.\"", "Χάρτης": "Map", "Χάρτης του σιδηροδρομικού δικτύου. Μια διαδρομή είναι σημαδεμένη με κόκκινο μελάνι, ξανά και ξανά.": "A map of the railway network. One route is marked in red ink, over and over.", "Θεσσαλονίκη – Αθήνα. Μόνο το πήγαινε.": "Thessaloniki – Athens. One way only.", "Τα τζάμια τρέμουν σε κάθε βροντή. Κι εγώ λίγο.": "The panes shake with every thunderclap. So do I, a little.", "Πόρτα": "Door", "Τικ.": "Tick.", "Πού πας, Ανδρέα;": "Where are you going, Andreas?", "Το τρένο δεν περιμένει κανέναν.": "The train waits for no one.", "Μείνε. Μόνο απόψε.": "Stay. Just tonight.", "Εικονοστάσι": "Icon shelf", "Το εικονοστάσι. Το καντήλι είναι αναμμένο.": "The icon shelf. The oil lamp is lit.", "Η Ευτέρπη πέθανε πριν από τρεις εβδομάδες.": "Evterpi died three weeks ago.", "Ποιος το άναψε;": "Who lit it?", "Κρεβάτι": "Bed", "Στρωμένο για δύο. Το ένα μαξιλάρι είναι ακόμα βαθουλωμένο.": "Made up for two. One pillow still holds the shape of a head.", "Κουνιστή πολυθρόνα": "Rocking chair", "Κουνιέται. Δεν την αγγίζει κανείς.": "It's rocking. Nobody is touching it.", "Τη σταματάω με το χέρι. Είναι ζεστή.": "I stop it with my hand. It's warm.", "Κάτω από το μαξιλάρι, ένας φάκελος: «Σε όποιον έρθει να με μετρήσει».": "Under the cushion, an envelope: \"To whoever comes to count me.\"", "Ξανακουνιέται. Την αφήνω.": "It starts rocking again. I let it.", "Από εδώ φαίνεται η στάση του τρένου. Το φως της είναι ακόμα αναμμένο.": "From here you can see the railway stop. Its light is still on.", "Συρταριέρα": "Chest of drawers", "Ένα μουσικό κουτί. Παίζει έναν σκοπό που δεν ξέρω.": "A music box. It plays a tune I don't know.", "Κι όμως, τον θυμάμαι.": "And yet I remember it.", "Γραφειάκι": "Writing desk", "Εδώ θα συμπληρώσω την απογραφή. Χρειάζομαι το έντυπο.": "I'll fill in the inventory here. I need the form.", "Ένα μικρό γραφείο με λάμπα. Εδώ θα συμπληρώσω την απογραφή.": "A small desk with a lamp. I'll const A = { c:null, m:null, on:true,
  init(){ if(this.c){ if(this.c.state==='suspended') this.c.resume(); return; }
    try{ this.c = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    const c=this.c; this.m=c.createGain(); this.m.gain.value=this.on?.9:0; this.m.connect(c.destination);
    const b=c.createBuffer(1,c.sampleRate*3,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.nb=b;
    const s=c.createBufferSource(); s.buffer=b; s.loop=true; this.rf=c.createBiquadFilter(); this.rf.type='lowpass'; this.rf.frequency.value=1800; this.rg=c.createGain(); this.rg.gain.value=0;
    s.connect(this.rf); this.rf.connect(this.rg); this.rg.connect(this.m); s.start();
    this.dl=c.createBiquadFilter(); this.dl.type='lowpass'; this.dl.frequency.value=170; this.dl.Q.value=5; this.dg=c.createGain(); this.dg.gain.value=0;
    [55,55.5,82.6].forEach(f=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(this.dl); o.start(); });
    const lfo=c.createOscillator(), lgn=c.createGain(); lfo.frequency.value=.06; lgn.gain.value=80; lfo.connect(lgn); lgn.connect(this.dl.frequency); lfo.start();
    this.dl.connect(this.dg); this.dg.connect(this.m); this.amb(); },
  amb(){ if(!this.c) return; const s=SC[S.scene], t=this.c.currentTime;
    const rain = S.mode==='title'||s.outdoor ? .085 : s.storm ? .03 : .004, cut = s.outdoor||S.mode==='title' ? 2400 : 480;
    this.rg.gain.setTargetAtTime(s.dream?0:rain,t,.6); this.rf.frequency.setTargetAtTime(cut,t,.6);
    this.dg.gain.setTargetAtTime(s.dream?.11:s.id==='basement'?.08:.045,t,1); this.dl.frequency.setTargetAtTime(s.dream?110:170,t,1); },
  setOn(v){ this.on=v; if(this.m) this.m.gain.setTargetAtTime(v?.9:0,this.c.currentTime,.05); },
  tone(f,dur,o={}){ const c=this.c; if(!c) return; const t=c.currentTime+(o.at||0), osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t); if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.1,t+(o.att||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    osc.connect(g); g.connect(this.m); osc.start(t); osc.stop(t+dur+.05); },
  noise(dur,o={}){ const c=this.c; if(!c) return; const t=c.currentTime+(o.at||0), s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.nb; f.type=o.ft||'lowpass'; f.frequency.setValueAtTime(o.ff||1000,t); if(o.ff2) f.frequency.exponentialRampToValueAtTime(o.ff2,t+dur); f.Q.value=o.q||1;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.1,t+(o.att||.003)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.m); s.start(t, Math.random()*Math.max(0,2.8-dur)); s.stop(t+dur+.05); }
};

/* ---------- walk grid + A* pathfinding ---------- */
const CELL=4;
function buildGrid(s){ const gw=Math.ceil(s.w/CELL), gh=Math.ceil(H/CELL), m=new Uint8Array(gw*gh);

/* ---------- update ---------- */
function update(dt){

    else { S.x+=nx/L*step; S.y+=ny/L*step*.62; S.moving=true; }
    if(Math.abs(dx)>Math.abs(dy)*1.1){ S.dir='side'; S.face=dx>0?1:-1; } else if(Math.abs(dy)>.5) S.dir=dy>0?'front':'back';
    const b=Math.floor(S.phase/Math.PI); S.phase+=dt*10; if(Math.floor(S.phase/Math.PI)!==b){ sfx('step'); const c=(G.dust||{})[S.scene]; if(c&&FXFULL) puff(S.x,S.y,c,2); } }

  if(TAP){ TAP.t-=dt; if(TAP.t<=0) TAP=null; else { const r=Math.round((.35-TAP.t)*24); ctx.globalAlpha=TAP.t*2.4; ctx.strokeStyle=G.tapCol||'#ffffff'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(TAP.x,TAP.y,r+.5,r*.35+.5,0,0,7); ctx.stroke(); ctx.globalAlpha=1; } }
  if(s.over) s.over(ctx,dt);

  ctx.setTransform(1,0,0,1,0,0);
  if(G.lowPost) G.lowPost(ctx,s,dt);
  let lights=[], dark=0; if(s.dark){ dark=s.dark*(G.darkMul?G.darkMul(s):1); lights=s.lights?s.lights().slice():[]; const pl=G.playerLight&&G.playerLight(s); if(pl) lights.push(pl); }

<script id="gfx">
/* ===== GFX+ — engine-independent graphics pack =====
   Works on any of our builds (needs: render(), a composite*() HD pass, SC[*].img backgrounds, S.cam, cv, octx, OW/OH).
   Each background is split automatically into FAR (sky and sea, found by flood-fill from the top row and from the sea band,
   so blue doors/windows/domes inside buildings are NOT taken) and NEAR (everything else). Every frame:
   far (45% parallax, palette-cycled sea, heat shimmer) → drifting clouds → boat → birds → near.
   HD post: soft bloom, horizon haze, indoor dust motes, optional CRT. A frame-time monitor lowers quality on its own. */
(()=>{
  const KEY='gfx-'+((typeof G!=='undefined'&&G.key)||document.title||'game').replace(/\s+/g,'-');
  const P=(()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
  const GX={on:P.on!==false, crt:!!P.crt, lvl:2, ft:[], st:{}};
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({on:GX.on,crt:GX.crt})); }catch(e){} };
  const L=a=>(typeof LANG!=='undefined'&&LANG==='en')?a[1]:a[0];
  const FULL=()=>typeof FXFULL==='undefined'?true:FXFULL;
  const blue=(r,g,b)=>b>165&&b-r>55&&g-r>18;
  function build(s,id){ const src=s.img; if(!src||!src.getContext) return {none:true,src}; const w=src.width, h=src.height, d=src.getContext('2d').getImageData(0,0,w,h).data;
    const lim=typeof s.gy==='number'?s.gy:typeof s.far==='number'?s.far-2:140, band=Math.max(0,Math.min(h,140,lim));
    const reg=new Uint8Array(w*h), dist=(i,c)=>Math.abs(d[i]-c[0])+Math.abs(d[i+1]-c[1])+Math.abs(d[i+2]-c[2]);
    const rowTop=y=>{ const m={}; for(let x=0;x<w;x++){ const i=(y*w+x)*4, k=d[i]<<16|d[i+1]<<8|d[i+2]; m[k]=(m[k]||0)+1; } return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,n])=>[[k>>16&255,k>>8&255,k&255],n/w]); };
    let skyBot=-1, lum=0, ln=0;

      for(let x=0;x<w;x++){ const p=y*w+x, i=p*4; if(cols.some(c=>dist(i,c)<36)){ reg[p]=1; n++; if(y<20){ lum+=d[i]*.3+d[i+1]*.59+d[i+2]*.11; ln++; } } }
      const c0=t[0][0], ground=y>45&&((c0[0]>c0[2]+40&&c0[1]>c0[2]&&c0[0]+c0[1]+c0[2]>330)||(c0[1]>c0[0]+15&&c0[1]>c0[2]+15));
      if(n<w*.5||ground){ for(let x=0;x<w;x++) reg[y*w+x]=0; break; } skyBot=y; }
    lum=ln?lum/ln:0; const day=lum>45&&!s.underwater&&!s.night&&!s.dark;
    if(skyBot<15||!day) return {none:true,src,indoor:skyBot<15,lum};
    const sb=(r,g,b)=>b>150&&b-r>100&&g-r>40; let seaTop=-1, seaBot=-1;
    let hz=-1, prev=rowTop(24)[0][0]; for(let y=25;y<=skyBot;y++){ const c=rowTop(y)[0][0]; if(Math.abs(c[0]-prev[0])+Math.abs(c[1]-prev[1])+Math.abs(c[2]-prev[2])>80){ hz=y; break; } prev=c; }
    if(hz>0) for(let y=hz;y<=skyBot;y++){ let n=0; for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(sb(d[i],d[i+1],d[i+2])) n++; } if(n>w*.35){ if(seaTop<0) seaTop=y; seaBot=y; } else if(seaTop>0) break; }
    if(seaTop<0) for(let y=skyBot+1;y<band;y++){ let n=0; for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(sb(d[i],d[i+1],d[i+2])) n++; }
      if(n>w*.35){ if(seaTop<0) seaTop=y; seaBot=y; for(let x=0;x<w;x++){ const p=y*w+x, i=p*4; if(sb(d[i],d[i+1],d[i+2])) reg[p]=1; } } else if(seaTop>0) break; else if(y>skyBot+14) break; }

      if(!big) for(const c of comp) reg[c]=2; }
    const fill=[]; for(let y=0;y<=bot;y++){ let n=0,r=0,g=0,b=0; for(let x=0;x<w;x++){ const p=y*w+x; if(reg[p]===1){ const i=p*4; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; } } fill[y]=n?[r/n|0,g/n|0,b/n|0]:(fill[y-1]||[d[0],d[1],d[2]]); }
    const far=document.createElement('canvas'); far.width=w; far.height=bot+1; const fg=far.getContext('2d'), fid=fg.createImageData(w,bot+1), fd=fid.data;
    const nc=document.createElement('canvas'); nc.width=w; nc.height=h; const ng=nc.getContext('2d'), nid=ng.createImageData(w,h), nd=nid.data;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const p=y*w+x, i=p*4; if(y<=bot){ if(reg[p]){ fd[i]=d[i]; fd[i+1]=d[i+1]; fd[i+2]=d[i+2]; } else { const f=fill[y]; fd[i]=f[0]; fd[i+1]=f[1]; fd[i+2]=f[2]; nd[i]=d[i]; nd[i+1]=d[i+1]; nd[i+2]=d[i+2]; nd[i+3]=255; } fd[i+3]=255; }
      else { nd[i]=d[i]; nd[i+1]=d[i+1]; nd[i+2]=d[i+2]; nd[i+3]=255; } }
    const sea=[]; if(seaTop>0) for(let y=seaTop;y<=seaBot;y++) for(let x=0;x<w;x++){ const p=y*w+x; if(reg[p]) sea.push(p*4,x,y); }

    const top2=hz>0?hz:skyBot, cy=Math.max(10,top2-14), tint=fill[Math.min(bot,8)]||[255,255,255], ct='rgba('+[0,1,2].map(k=>Math.round(255*.75+tint[k]*.25)).join(',')+',.9)';
    return {src,out,far,fg,fid,base:new Uint8ClampedArray(fd),near:nc,bot,skyBot,seaTop,seaBot,sea,w,h,seaT:0,beach:/beach|παραλ/i.test(id),ct,
      clouds:[...Array(5)].map(()=>({x:rnd()*w,y:4+rnd()*Math.max(4,cy-8),s:.6+rnd()*.8,v:1+rnd()*2})),
      birds:[...Array(4)].map(()=>({x:rnd()*w,y:6+rnd()*Math.max(4,cy-6),v:(8+rnd()*10)*(rnd()<.5?-1:1),ph:rnd()*6})), boat:{x:rnd()*w,v:2.5}}; }
  function cloud(g,x,y,s,ct){ const r=Math.round; g.fillStyle=ct||'rgba(255,255,255,.9)'; for(const [dx,dy,rr] of [[0,0,5],[6,-2,6],[13,0,5],[6,2,6]]){ const R2=r(rr*s); for(let yy=-R2;yy<=R2;yy++){ const ww=r(Math.sqrt(R2*R2-yy*yy)); g.fillRect(r(x+dx*s-ww),r(y+dy*s+yy),ww*2+1,1); } } g.fillStyle='rgba(215,232,250,.85)'; g.fillRect(r(x-3*s),r(y+3*s),r(22*s),Math.max(1,r(2*s))); }
  function animSea(L2,t){ const fd=L2.fid.data, b=L2.base, s=L2.sea, n=s.length, span=L2.seaBot-L2.seaTop+1;
    for(let j=0;j<n;j+=3){ const i=s[j], x=s[j+1], y=s[j+2], dp=(y-L2.seaTop)/span, w=Math.sin(x*.11+y*.9-t*2.6)*Math.sin(x*.027+y*.2+t*1.1), k=1+w*.09*(1-dp*.5);
      let r=b[i]*k, g=b[i+1]*k, bl=b[i+2]*k; if(w>.86&&((x*7+y*13)&3)===0){ r=g=bl=255; } fd[i]=r; fd[i+1]=g; fd[i+2]=bl; }

  function idOf(s){ if(s.id) return s.id; for(const k in SC) if(SC[k]===s) return s.id=k; return 'x'; }
  function compose(s,dt){ const id=idOf(s); let L2=GX.st[id];
    if(!L2||(s.img!==L2.out&&s.img!==L2.src)) L2=GX.st[id]=build(s,id);

    const g=L2.out.getContext('2d'), cam=S.cam, w=L2.w; g.imageSmoothingEnabled=false;

/* ---------- hooks: intro before New game · mid at a key point · ending before the end screen ---------- */
function cineInstall(cfg){ const $$=id=>document.getElementById(id); let bypass=false;
  document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#tNew'); if(!b||bypass||CINE.busy()) return; e.stopImmediatePropagation(); e.preventDefault(); try{ if(typeof A!=='undefined'&&A.init) A.init(); }catch(_){}
    CINE.play(cfg.intro,()=>{ bypass=true; b.click(); bypass=false; },cfg.introMood); },true);
  setInterval(()=>{ if(CINE.busy()||typeof S==='undefined'||S.mode!=='play'||typeof F==='undefined'||!F||F.__cm) return; if(cfg.midWhen()){ F.__cm=1; CINE.play(cfg.mid,()=>{},cfg.midMood); } },300);
  const end=$$('end'); if(end) new MutationObserver(()=>{ if(end.hidden||end.dataset.cine==='1'||end.classList.contains('over')) return; end.dataset.cine='1'; end.style.visibility='hidden';

  const tn=$$('tNew'); if(tn) tn.addEventListener('click',()=>{ if(end) end.dataset.cine='0'; }); }
